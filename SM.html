<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunmin's Works</title>
<meta name="theme-color" content="#fff8f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
  :root{
    --bg:#f1f1fb;
    --card:#ffffff;
    --border:#eceafc;
    --text:#211f3d;
    --muted:#8f8ca8;
    --muted-soft:#b5b2ca;

    --primary:#5b5fef;
    --primary-dark:#4547c9;
    --primary-soft:#edeefd;

    --mint:#10b981;
    --mint-soft:#e6f9f1;
    --blue:#3b82f6;
    --blue-soft:#eaf2ff;
    --rose:#f43f5e;
    --rose-soft:#ffe9ed;
    --violet:#8b5cf6;
    --violet-soft:#f3eefe;
    --amber:#f59e0b;
    --amber-soft:#fff5e6;
    --slate:#475569;
    --slate-soft:#eef1f5;

    --shadow-sm: 0 1px 2px rgba(33,31,61,.05);
    --shadow-md: 0 1px 3px rgba(33,31,61,.05), 0 10px 24px -8px rgba(33,31,61,.12);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 헤더 ===== */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 28px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }
  header .wordmark{
    justify-self:center;
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:21px;
    font-weight:600;
    color:var(--text);
    letter-spacing:.2px;
  }
  header .today-pill{
    justify-self:end;
    font-size:12.5px;
    color:var(--muted);
    background:var(--bg);
    padding:6px 14px;
    border-radius:999px;
  }

  /* ===== 레이아웃: 사이드바 + 본문 ===== */
  .app-shell{ display:flex; align-items:flex-start; }

  aside.sidebar{
    width:96px;
    flex:none;
    padding:24px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
  }
  .nav-item{
    width:68px;
    padding:12px 4px 10px;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    border:none;
    background:var(--card);
    color:var(--muted);
    box-shadow:var(--shadow-sm);
    transition:transform .12s, box-shadow .12s, background .12s, color .12s;
  }
  .nav-item svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item .tiny{
    font-size:10.5px; font-weight:700; white-space:nowrap;
  }
  .nav-item:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .nav-item.active{
    background:var(--primary-soft);
    color:var(--primary-dark);
    box-shadow:var(--shadow-md);
  }

  .nav-gutter{
    width:168px;
    flex:none;
    align-self:stretch;
    border-right:1px solid var(--border);
  }
  .nav-wrap{ position:relative; width:100%; display:flex; justify-content:center; }
  .nav-flyout{
    position:absolute;
    left:calc(100% + 18px);
    top:6px;
    min-width:150px;
    background:transparent;
    border:none;
    box-shadow:none;
    padding-left:14px;
    display:flex;
    flex-direction:column;
    gap:0;
    opacity:0;
    visibility:hidden;
    transform:translateX(-4px);
    transition:opacity .12s, transform .12s, visibility .12s;
    z-index:40;
  }
  .nav-flyout.open{
    opacity:1; visibility:visible; transform:translateX(0);
  }
  .nav-flyout::before{
    content:'';
    position:absolute;
    left:0; top:4px; bottom:4px;
    width:1.5px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--primary), var(--mint));
    opacity:.4;
  }
  .nav-flyout-item{
    position:relative;
    font-family:inherit; font-size:13.5px; font-weight:600;
    text-align:left; white-space:nowrap;
    padding:9px 0 9px 14px; border:none;
    background:transparent; color:var(--text); cursor:pointer;
  }
  .nav-flyout-item::before{
    content:'';
    position:absolute;
    left:-14px; top:50%;
    width:10px; height:1.5px;
    background:var(--border);
    transform:translateY(-50%);
  }
  .nav-flyout-item:hover{ color:var(--primary-dark); }
  .nav-flyout-item:hover::before{ background:var(--primary); }

  main{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .page-head{ margin-bottom:22px; text-align:center; }
  .page-head:empty{ margin-bottom:0; }
  .page-head h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:-.3px;
  }
  .underline-bar{
    width:52px; height:5px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--primary));
    margin:0 auto 8px;
  }
  .page-head .subtitle{ color:var(--muted); font-size:13px; }

  .tab{ display:none; }
  .tab.active{ display:block; }

  /* ===== 카드 ===== */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{
    font-size:15.5px;
    margin:0 0 4px;
    font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  .card .desc{
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:16px;
  }

  .hero-row{
    display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px;
  }
  .hero-tile{
    flex:1; min-width:180px;
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow-sm);
    position:relative;
    overflow:hidden;
  }
  .hero-tile .n{ font-size:30px; font-weight:800; line-height:1; }
  .hero-tile .label{ font-size:12.5px; font-weight:700; margin-top:8px; opacity:.85; }
  .hero-tile.tone-amber{ background:linear-gradient(135deg,#fff1e0,#ffe3d6); color:#b45309; }
  .hero-tile.tone-indigo{ background:linear-gradient(135deg,#e9eafd,#dfe1fb); color:var(--primary-dark); }
  .hero-tile.tone-mint{ background:linear-gradient(135deg,#e2f9ef,#d3f3e6); color:#047857; }

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  }
  select, input[type=text], input[type=date], input[type=number]{
    font-family:inherit; font-size:13px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--bg);
    color:var(--text);
  }
  select:focus, input:focus{ outline:2px solid var(--primary-soft); border-color:var(--primary); }

  button.btn{
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  button.btn:hover{ background:var(--bg); }
  button.btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:var(--shadow-sm); }
  button.btn.primary:hover{ background:var(--primary-dark); }
  button.btn.ghost{ border-color:transparent; color:var(--muted); background:transparent; }
  button.btn.danger{ color:var(--rose); }
  .spacer{ flex:1; }

  .summary-row{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:110px;
    border-radius:var(--radius-md);
    padding:14px 16px;
    background:var(--bg);
  }
  .stat.tone-mint{ background:var(--mint-soft); }
  .stat.tone-blue{ background:var(--blue-soft); }
  .stat.tone-rose{ background:var(--rose-soft); }
  .stat.tone-violet{ background:var(--violet-soft); }
  .stat .n{ font-size:21px; font-weight:800; }
  .stat .label{ font-size:11.5px; color:var(--muted); margin-top:3px; font-weight:600; }

  .progress-bar{ height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px; }
  .progress-bar .fill{ height:100%; border-radius:999px; transition:width .2s; }
  .fill.tone-mint{ background:linear-gradient(90deg,#34d399,var(--mint)); }
  .fill.tone-blue{ background:linear-gradient(90deg,#60a5fa,var(--blue)); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:10px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ color:var(--muted-soft); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.note-cell{ white-space:normal; min-width:160px; }
  .table-scroll{ overflow-x:auto; }

  .pill{ display:inline-block; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ok{ background:var(--mint-soft); color:#059669; }
  .pill.warn{ background:var(--amber-soft); color:#b45309; }
  .pill.danger{ background:var(--rose-soft); color:#e11d48; }
  .pill.muted{ background:var(--slate-soft); color:var(--muted); }

  .tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; }
  .tag.tag-vat{ background:var(--mint-soft); color:#047857; }
  .tag.tag-pay{ background:var(--blue-soft); color:#1d4ed8; }
  .tag.tag-corp{ background:var(--rose-soft); color:#be123c; }
  .tag.tag-indiv{ background:var(--violet-soft); color:#6d28d9; }
  .tag.tag-corp-type{ background:var(--primary-soft); color:var(--primary-dark); }
  .tag.tag-indiv-type{ background:var(--mint-soft); color:#047857; }

  .due-overdue{ color:var(--rose); font-weight:800; }
  .due-soon{ color:var(--amber); font-weight:800; }

  .steps{ display:flex; gap:5px; flex-wrap:wrap; }
  .step-chip{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:var(--bg); color:var(--muted); cursor:pointer;
    border:1px solid var(--border); white-space:nowrap; transition:all .12s;
  }
  .step-chip.done.tone-corp{ background:var(--rose-soft); color:#be123c; border-color:transparent; }
  .step-chip.done.tone-indiv{ background:var(--violet-soft); color:#6d28d9; border-color:transparent; }

  .small-input{ width:110px; }

  .task-list{ list-style:none; margin:0; padding:0; }
  .task-list li{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .task-list li:last-child{ border-bottom:none; }
  .task-list input[type=checkbox]{
    width:18px; height:18px; accent-color:var(--primary); cursor:pointer;
  }
  .task-list .task-date{ font-size:11.5px; color:var(--muted); min-width:82px; font-weight:700; }
  .task-list .task-text{ flex:1; }
  .task-list li.done .task-text{ text-decoration:line-through; color:var(--muted); }

  /* ===== To do: 연속 스크롤 아젠다(네이버 할일 스타일) ===== */
  .wl-agenda{
    max-height:620px;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:14px;
    padding:0 16px;
    background:var(--bg);
  }
  .wl-day{ padding:6px 0 4px; }
  .wl-day-head{
    position:sticky; top:0; z-index:2;
    background:var(--bg);
    padding:10px 0 6px;
    font-size:12.5px; font-weight:800; color:var(--muted);
  }
  .wl-day-head.today{ color:var(--primary-dark); }
  .wl-day .task-list{ margin:0; }
  .wl-day .task-list li{ padding:8px 0; }

  .deadline-list{ list-style:none; margin:0; padding:0; }
  .deadline-list li{ display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .deadline-list li:last-child{ border-bottom:none; }
  .deadline-list .left{ display:flex; align-items:center; gap:10px; }

  .empty{ text-align:center; color:var(--muted); padding:30px 0; font-size:13px; }

  .type-tag{ font-size:11px; padding:3px 9px; border-radius:999px; background:var(--bg); color:var(--muted); font-weight:700; }

  .date-cell{ display:flex; align-items:center; gap:6px; }
  .date-cell input[type=date]{ width:132px; padding:6px 8px; font-size:12px; }
  button.btn.xs{ padding:5px 10px; font-size:11px; }
  button.btn:disabled{ opacity:.35; cursor:default; }
  .step-date{ display:block; font-size:9.5px; font-weight:600; opacity:.75; margin-top:1px; }

  .settings-card{ max-width:820px; margin-left:auto; margin-right:auto; }
  .settings-block{
    padding:16px 18px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
  }
  .settings-block:last-child{ margin-bottom:0; }
  .settings-block .row{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .settings-block h3{ font-size:13.5px; font-weight:800; margin-bottom:3px; }
  .settings-block .hint{ font-size:12px; color:var(--muted); line-height:1.5; max-width:420px; }
  .settings-block .ctrl{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .cal-title-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:16px; }
  .cal-title{ justify-self:center; margin:0; }
  .cal-title-row button{ justify-self:end; }
  .cal-head{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px; }
  .cal-head .month-label{ font-size:15px; font-weight:800; min-width:110px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:92px; gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:800; color:var(--muted-soft); padding:2px 0 8px; text-transform:uppercase; }
  .cal-day{
    position:relative; height:92px; overflow:hidden;
    border-radius:12px; background:var(--bg);
    padding:7px 7px 8px; border:1px solid transparent;
  }
  .cal-day.other{ opacity:.4; }
  .cal-day.today{ border-color:var(--primary); background:var(--primary-soft); }
  .cal-daynum{ font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  .cal-day.today .cal-daynum{ color:var(--primary-dark); }
  .cal-tasks{ display:flex; flex-direction:column; gap:3px; overflow:hidden; max-height:60px; }
  .cal-task{
    font-size:10.5px; font-weight:700; background:var(--card); color:var(--text);
    padding:3px 6px; border-radius:6px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:var(--shadow-sm); flex-shrink:0;
  }
  .cal-task.done{ text-decoration:line-through; color:var(--muted); background:var(--bg); box-shadow:none; }

  /* ===== 로그인 게이트 ===== */
  #authGate{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#fff8f0,#f1f1fb);
  }
  #authGate .gate-card{
    background:var(--card);
    border-radius:24px;
    box-shadow:var(--shadow-md);
    padding:40px 36px;
    max-width:340px;
    width:90%;
    text-align:center;
  }
  #authGate .gate-title{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:22px;
    font-weight:600;
    margin-bottom:6px;
  }
  #authGate .gate-desc{
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:22px;
    line-height:1.6;
  }
  #authGate .gate-btn-wrap{
    display:flex; justify-content:center; margin-bottom:14px;
    min-height:42px;
  }
  #authGate .gate-error{
    color:var(--rose);
    font-size:12.5px;
    font-weight:700;
    margin-top:10px;
    display:none;
  }
  #authGate .gate-error.show{ display:block; }
</style>
</head>
<body>

<div id="authGate">
  <div class="gate-card">
    <div class="gate-title">Sunmin's Works</div>
    <div class="gate-desc">나만 쓰는 개인 업무 도구예요.<br>등록된 Google 계정으로만 열 수 있습니다.</div>
    <div class="gate-btn-wrap">
      <button class="btn primary" id="gateSignInBtn" onclick="gateSignIn()" disabled>Google로 로그인</button>
    </div>
    <div class="gate-error" id="gateError">이 계정으로는 열 수 없어요. 등록된 계정으로 다시 시도해주세요.</div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<header>
  <span></span>
  <span class="wordmark">Sunmin's Works</span>
  <span style="justify-self:end; display:flex; align-items:center; gap:8px;">
    <span class="pill warn" id="syncWarningBadge" style="display:none; cursor:pointer;" onclick="goToSettingsSection('settings-google')" title="눌러서 다시 연결하기">⚠ 연동 끊김 · 다시 로그인</span>
    <span class="today-pill" id="todayPill"></span>
  </span>
</header>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-gutter"></div>

  <main>
    <div class="page-head" id="pageHead"></div>

    <div id="tab-home" class="tab"></div>
    <div id="tab-worklist" class="tab"></div>
    <div id="tab-vat" class="tab"></div>
    <div id="tab-pay" class="tab"></div>
    <div id="tab-corp" class="tab"></div>
    <div id="tab-indiv" class="tab"></div>
    <div id="tab-clients" class="tab"></div>
    <div id="tab-settings" class="tab"></div>
  </main>
</div>
</div>

<script>
/* =========================================================
   로그인 게이트 — 등록된 구글 계정 1개만 앱 접근 허용
   ========================================================= */
const ALLOWED_EMAILS = ['sunmin2040@gmail.com'];
const AUTH_STORAGE_KEY = 'sm_auth_verified_email';

function parseJwt(token){
  try{
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
  }catch(e){ return null; }
}

function showGateError(msg){
  const el = document.getElementById('gateError');
  if(!el) return;
  if(msg) el.textContent = msg;
  el.classList.add('show');
}

function unlockApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  startAppAfterAuth();
}

function lockApp(){
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){}
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';
}

// 게이트에서 "Google로 로그인"을 누르면, 신원 확인(이 계정이 맞는지)과 Google Sheets 연동용
// access token 발급을 한 번의 클릭으로 같이 처리한다. 예전에는 이 둘이 분리돼 있어서
// 게이트만 통과하고 설정 탭의 "Google Sheets 연동"은 따로 눌러야 했는데, 그러면 로그인했는데도
// 연동 버튼이 그대로 남아있는 것처럼 보이는 문제가 있었음.
async function fetchGoogleUserEmail(accessToken){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken },
    });
    if(!res.ok) return null;
    const info = await res.json();
    return info && info.email ? info.email : null;
  }catch(e){ return null; }
}

function gateSignIn(){
  if(!googleTokenClient){
    alert('Google 연동 스크립트를 아직 불러오지 못했습니다. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');
    return;
  }
  const btn = document.getElementById('gateSignInBtn');
  if(btn){ btn.disabled = true; btn.textContent = '로그인 중...'; }

  googleTokenClient.callback = async (resp) => {
    if(resp.error){
      if(btn){ btn.disabled = false; btn.textContent = 'Google로 로그인'; }
      showGateError('로그인에 실패했어요. 다시 시도해주세요.');
      return;
    }
    const accessToken = resp.access_token;
    const email = await fetchGoogleUserEmail(accessToken);

    if(!email || !ALLOWED_EMAILS.includes(email)){
      if(typeof google !== 'undefined' && google.accounts){
        google.accounts.oauth2.revoke(accessToken, () => {});
      }
      if(btn){ btn.disabled = false; btn.textContent = 'Google로 로그인'; }
      showGateError();
      return;
    }

    googleAccessToken = accessToken;
    gapi.client.setToken({ access_token: googleAccessToken });
    try{ localStorage.setItem(AUTH_STORAGE_KEY, email); }catch(e){}
    unlockApp();
    await afterGoogleSignIn(); // 같은 토큰으로 Sheets 연동까지 바로 진행 (자동 연동됨 표시)
  };
  googleTokenClient.requestAccessToken({ prompt: 'consent' });
}

function initAuthGate(){
  try{
    const saved = localStorage.getItem(AUTH_STORAGE_KEY);
    if(saved && ALLOWED_EMAILS.includes(saved)){
      unlockApp();
      return;
    }
  }catch(e){}
  maybeEnableGateButton();
}

function maybeEnableGateButton(){
  const btn = document.getElementById('gateSignInBtn');
  if(btn && gapiReady && gisReady){ btn.disabled = false; }
}

function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayS = todayStr();

  const cells = [];
  for(let i = 0; i < startDow; i++){
    const d = daysInPrevMonth - startDow + 1 + i;
    let y = calYear, m = calMonth - 1;
    if(m < 0){ m = 11; y--; }
    cells.push({ d, dateStr: `${y}-${pad2(m+1)}-${pad2(d)}`, other:true });
  }
  for(let d = 1; d <= daysInMonth; d++){
    cells.push({ d, dateStr: `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`, other:false });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    let y = calYear, m = calMonth + 1;
    if(m > 11){ m = 0; y++; }
    cells.push({ d: nextDay, dateStr: `${y}-${pad2(m+1)}-${pad2(nextDay)}`, other:true });
    nextDay++;
  }

  const dow = ['일','월','화','수','목','금','토'];

  return `
    <div class="cal-head">
      <button class="btn ghost xs" onclick="calPrev()">이전</button>
      <div class="month-label">${calYear}년 ${calMonth+1}월</div>
      <button class="btn ghost xs" onclick="calToday()">오늘</button>
      <button class="btn ghost xs" onclick="calNext()">다음</button>
    </div>
    <div class="cal-grid">
      ${dow.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(c => {
        const dayTasks = tasks.filter(t => t.date === c.dateStr);
        return `
        <div class="cal-day ${c.dateStr===todayS?'today':''} ${c.other?'other':''}">
          <div class="cal-daynum">${c.d}</div>
          <div class="cal-tasks">
            ${dayTasks.map(t => `<div class="cal-task ${t.done?'done':''}" onclick="toggleTask(${t.id})" title="${t.text}">${t.text}</div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

let worklistSelMonth = null;
function selectWorklistMonth(m){
  if(!m) return;
  worklistSelMonth = m;
  renderWorklist();
}

function toggleWorklistCheck(month, idx){
  const item = worklistChecklist[month] && worklistChecklist[month][idx];
  if(item) item.done = !item.done;
  renderWorklist();
}

function scrollToWorklistDate(dateStr){
  const container = document.getElementById('worklistAgenda');
  if(!container || !dateStr) return;
  let target = document.getElementById('wl-day-' + dateStr);
  if(!target){
    const days = Array.from(container.querySelectorAll('.wl-day'));
    target = days.find(d => d.id.replace('wl-day-','') >= dateStr) || days[days.length - 1];
  }
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}
function jumpToWorklistDate(){
  const val = document.getElementById('worklistJumpDate').value;
  scrollToWorklistDate(val);
}
function jumpToWorklistToday(){ scrollToWorklistDate(todayStr()); }

const WL_DOW = ['일','월','화','수','목','금','토'];
function worklistDayLabel(dateStr){
  const d = new Date(dateStr);
  return `${dateStr} (${WL_DOW[d.getDay()]})`;
}

function renderWorklist(){
  const el = document.getElementById('tab-worklist');
  const monthNum = k => { const n = parseInt(k, 10); return isNaN(n) ? 99 : n; };
  const months = Array.from(new Set([...Object.keys(worklistChecklist), ...Object.keys(worklistSchedule)]))
    .sort((a, b) => monthNum(a) - monthNum(b));
  if(!worklistSelMonth || !months.includes(worklistSelMonth)){
    const cur = `${new Date().getMonth() + 1}월`;
    worklistSelMonth = months.includes(cur) ? cur : (months[months.length - 1] || null);
  }
  const selIdx = months.indexOf(worklistSelMonth);

  const refSections = months.length ? [worklistSelMonth].map(m => `
    <div class="card">
      <div class="toolbar" style="justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">${m} 체크리스트</h2>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <button class="btn ghost xs" ${selIdx <= 0 ? 'disabled' : ''} onclick="selectWorklistMonth('${months[selIdx - 1] || ''}')">◀</button>
          ${months.map(mm => `<button class="btn xs ${mm === m ? 'primary' : ''}" onclick="selectWorklistMonth('${mm}')">${mm}</button>`).join('')}
          <button class="btn ghost xs" ${selIdx >= months.length - 1 ? 'disabled' : ''} onclick="selectWorklistMonth('${months[selIdx + 1] || ''}')">▶</button>
        </div>
      </div>
      <div class="desc">그 달에 반복적으로 챙겨야 하는 항목이에요. 특정 날짜에 매이지 않아요.</div>
      <ul class="task-list">
        ${(worklistChecklist[m] || []).map((item, idx) => `
          <li class="${item.done ? 'done' : ''}">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleWorklistCheck('${m}', ${idx})">
            <span class="task-text">${item.text}</span>
          </li>`).join('')}
      </ul>
      ${(worklistSchedule[m] || []).length ? `
        <div class="desc" style="margin-top:14px; margin-bottom:6px;">주요 세무일정 (참고용)</div>
        <ul class="deadline-list">
          ${(worklistSchedule[m] || []).map(s => `<li><span class="left">${s}</span></li>`).join('')}
        </ul>` : ''}
    </div>
  `).join('') : '';

  const sorted = [...tasks].sort((a, b) => a.date.localeCompare(b.date));
  const byDate = {};
  sorted.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
  const dateKeys = Object.keys(byDate).sort();
  const todayS = todayStr();

  const agenda = dateKeys.map(date => `
    <div class="wl-day" id="wl-day-${date}">
      <div class="wl-day-head ${date === todayS ? 'today' : ''}">${worklistDayLabel(date)}</div>
      <ul class="task-list">
        ${byDate[date].map(t => `
          <li class="${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
            <span class="task-text">${t.text}</span>
            <button class="btn ghost xs" onclick="deleteTask(${t.id})">삭제</button>
          </li>`).join('')}
      </ul>
    </div>
  `).join('');

  el.innerHTML = `
    ${refSections}
    <div class="card">
      <h2>날짜별 할 일</h2>
      <div class="desc">스크롤로 날짜를 계속 이어서 볼 수 있고, 특정 날짜로 바로 이동할 수도 있어요.</div>
      <div class="toolbar">
        <input type="date" id="newTaskDate" value="${todayS}">
        <input type="text" id="newTaskText" placeholder="할 일을 입력하세요" style="flex:1; min-width:200px;">
        <button class="btn primary" onclick="addTask()">추가</button>
      </div>
      <div class="toolbar">
        <input type="date" id="worklistJumpDate" value="${todayS}">
        <button class="btn" onclick="jumpToWorklistDate()">이 날짜로 이동</button>
        <button class="btn ghost" onclick="jumpToWorklistToday()">오늘로 이동</button>
      </div>
      <div class="wl-agenda" id="worklistAgenda">
        ${dateKeys.length ? agenda : `<div class="empty">등록된 할 일이 없습니다.</div>`}
      </div>
    </div>
  `;
}

function vatSummary(){
  const rows = Object.entries(vatData[currentVatPeriod] || {});
  const targets = rows.filter(([,r]) => r.target);
  const filed = targets.filter(([,r]) => r.filedDate);
  return {total: targets.length, filed: filed.length};
}

function addVatPeriod(){
  const label = prompt('새 기간 이름을 입력하세요 (예: 2026년 2기 예정)');
  if(!label) return;
  const due = prompt('신고기한을 입력하세요 (예: 2026-10-25)', '');
  vatPeriods.push(label);
  vatDue[label] = due || '';
  vatData[label] = {};
  clients.forEach(c => { vatData[label][c.id] = {target:true, office:'', sales:0, purchase:0, filedDate:'', paidDate:'', note:''}; });
  currentVatPeriod = label;
  renderVat();
}

function updateVat(id, field, value){
  const row = vatData[currentVatPeriod][id];
  row[field] = (field === 'sales' || field === 'purchase') ? (Number(value) || 0) : value;
  renderVat();
}

        </tr></thead>
        <tbody>

function setSyncStatus(text){
  googleSyncStatus = text;
  const el = document.getElementById('syncStatusLine');
  if(el) el.textContent = text;
}

function gapiLoaded(){
  gapi.load('client', async () => {
    try {
      await gapi.client.init({});
      await gapi.client.load('sheets', 'v4');
      await gapi.client.load('drive', 'v3');
      gapiReady = true;
      maybeEnableGoogleSignIn();
    } catch(e){
      console.error('gapi 초기화 실패', e);
    }
  });
}

function gisInit(){
  try {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: '',
    });
    gisReady = true;
    maybeEnableGoogleSignIn();
  } catch(e){
    console.error('Google Identity Services 초기화 실패', e);
  }
}

function maybeEnableGoogleSignIn(){
  const btn = document.getElementById('googleSignInBtn');
  if(btn && gapiReady && gisReady){ btn.disabled = false; }
  maybeEnableGateButton();
}

function handleGoogleSignIn(){
  if(!googleTokenClient){
    alert('Google 연동 스크립트를 아직 불러오지 못했습니다. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');
    return;
  }
  googleTokenClient.callback = async (resp) => {
    if(resp.error){
      setSyncStatus('로그인 실패: ' + resp.error);
      renderSettings();
      return;
    }
    googleAccessToken = resp.access_token;
    gapi.client.setToken({ access_token: googleAccessToken });
    await afterGoogleSignIn();
  };
  googleTokenClient.requestAccessToken({ prompt: '' });
}

function handleGoogleSignOut(){
  if(googleAccessToken && typeof google !== 'undefined'){
    google.accounts.oauth2.revoke(googleAccessToken, () => {});
  }
  clearInterval(googlePollTimer);
  googleAccessToken = null;
  googleSpreadsheetId = null;
  settings.sheetsConnected = false;
  setSyncStatus('');
  clearSyncWarningBadge();
  renderSettings();
}

async function afterGoogleSignIn(){
  clearSyncWarningBadge();
  setSyncStatus('연결하는 중...');
  renderSettings();
  try {
    const found = await findGoogleDataSheet();
    googleSpreadsheetId = found || await createGoogleDataSheet();
    await loadFromGoogleSheet();
    settings.sheetsConnected = true;
    setSyncStatus('연동됨 · 방금 불러왔습니다');
    startGooglePolling();
  } catch(e){
    console.error(e);
    const msg = (e && e.result && e.result.error && e.result.error.message) || e.message || '알 수 없는 오류';
    setSyncStatus('연동 실패: ' + msg);
  }
  renderAll();
}

async function findGoogleDataSheet(){
  const res = await gapi.client.drive.files.list({
    q: `name='${GOOGLE_SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`,
    fields: 'files(id,name)',
    spaces: 'drive',
  });
  const files = res.result.files || [];
  return files.length ? files[0].id : null;
}

async function createGoogleDataSheet(){
  const res = await gapi.client.sheets.spreadsheets.create({
    properties: { title: GOOGLE_SHEET_NAME },
    sheets: [{ properties: { title: 'data' } }],
  });
  const id = res.result.spreadsheetId;
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: id,
    range: 'data!A1:B1',
    valueInputOption: 'RAW',
    resource: { values: [['key', 'json']] },
  });
  return id;
}

const GOOGLE_DATA_KEYS = [
  'clients','tasks','vatData','payData','corpData','indivData','settings',
  'vatPeriods','payMonths','corpYears','indivYears',
  'vatDue','payDue','corpDue','indivDue',
  'nextClientId','nextTaskId',
  'worklistChecklist','worklistSchedule',
];

function collectGoogleSnapshot(){
  return {
    clients, tasks, vatData, payData, corpData, indivData, settings,
    vatPeriods, payMonths, corpYears, indivYears,
    vatDue, payDue, corpDue, indivDue,
    nextClientId, nextTaskId,
    worklistChecklist, worklistSchedule,
  };
}

async function loadFromGoogleSheet(){
  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: googleSpreadsheetId,
    range: 'data!A2:B1000',
  });
  const rows = res.result.values || [];
  const map = {};
  rows.forEach(r => { if(r[0] && r[1]) map[r[0]] = r[1]; });
  if(!Object.keys(map).length) return;

  try {
    if(map.clients)     clients     = JSON.parse(map.clients);
    if(map.tasks)        tasks        = JSON.parse(map.tasks);
    if(map.vatData)      vatData      = JSON.parse(map.vatData);
    if(map.payData)      payData      = JSON.parse(map.payData);
    if(map.corpData)     corpData     = JSON.parse(map.corpData);
    if(map.indivData)    indivData    = JSON.parse(map.indivData);
    if(map.settings)     settings     = Object.assign(settings, JSON.parse(map.settings));
    if(map.vatPeriods)   vatPeriods   = JSON.parse(map.vatPeriods);
    if(map.payMonths)    payMonths    = JSON.parse(map.payMonths);
    if(map.corpYears)    corpYears    = JSON.parse(map.corpYears);
    if(map.indivYears)   indivYears   = JSON.parse(map.indivYears);
    if(map.vatDue)        vatDue       = JSON.parse(map.vatDue);
    if(map.payDue)        payDue       = JSON.parse(map.payDue);
    if(map.corpDue)       corpDue      = JSON.parse(map.corpDue);
    if(map.indivDue)      indivDue     = JSON.parse(map.indivDue);
    if(map.nextClientId)  nextClientId = JSON.parse(map.nextClientId);
    if(map.nextTaskId)    nextTaskId   = JSON.parse(map.nextTaskId);
    if(map.worklistChecklist) worklistChecklist = JSON.parse(map.worklistChecklist);
    if(map.worklistSchedule)  worklistSchedule  = JSON.parse(map.worklistSchedule);
  } catch(e){
    console.error('시트 데이터 파싱 실패', e);
  }
}

// 로그인 만료(access token 만료/취소)를 감지해서 사용자가 알아챌 수 있게 만드는 부분.
// 예전에는 저장/자동새로고침이 조용히 실패만 하고, 설정 탭을 직접 열어봐야만 알 수 있었음.
// 이제는 401(권한 없음) 오류가 나면 즉시 연동을 끊긴 상태로 표시하고, 어느 탭에 있든
// 헤더에 "연동 끊김" 배지가 떠서 바로 알 수 있게 함.
function isAuthError(e){
  const code = (e && e.status) || (e && e.result && e.result.error && e.result.error.code);
  return code === 401 || code === 403;
}

function handleGoogleTokenExpired(){
  googleAccessToken = null;
  settings.sheetsConnected = false;
  clearInterval(googlePollTimer);
  setSyncStatus('로그인이 만료됐어요 · 설정에서 다시 로그인해주세요');
  const badge = document.getElementById('syncWarningBadge');
  if(badge) badge.style.display = '';
  if(activeTab === 'settings') renderSettings();
}

function clearSyncWarningBadge(){
  const badge = document.getElementById('syncWarningBadge');
  if(badge) badge.style.display = 'none';
}

async function saveToGoogleSheet(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  const snap = collectGoogleSnapshot();
  const rows = GOOGLE_DATA_KEYS.map(k => [k, JSON.stringify(snap[k])]);
  setSyncStatus('저장 중...');
  try {
    await gapi.client.sheets.spreadsheets.values.clear({
      spreadsheetId: googleSpreadsheetId, range: 'data!A2:B1000',
    });
    await gapi.client.sheets.spreadsheets.values.update({
      spreadsheetId: googleSpreadsheetId, range: 'data!A2',
      valueInputOption: 'RAW',
      resource: { values: rows },
    });
    const t = new Date();
    clearSyncWarningBadge();
    setSyncStatus(`연동됨 · ${pad2(t.getHours())}:${pad2(t.getMinutes())} 저장됨`);
  } catch(e){
    console.error(e);
    if(isAuthError(e)){
      handleGoogleTokenExpired();
    } else {
      setSyncStatus('저장 실패 (다음 변경 때 다시 시도합니다)');
    }
  }
}

function scheduleGoogleSave(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToGoogleSheet, 900);
}

function setMasterSyncStatus(text){
  masterSyncStatus = text;
  const el = document.getElementById('masterSyncStatusLine');
  if(el) el.textContent = text;
}

async function getMasterSheetTitles(){
  const res = await gapi.client.sheets.spreadsheets.get({
    spreadsheetId: MASTER_SHEET_ID,
    fields: 'sheets.properties.title',
  });
  return (res.result.sheets || []).map(s => s.properties.title);
}

async function findTabByHeaders(titles, requiredHeaderGroups){
  for(const title of titles){
    try {
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: MASTER_SHEET_ID,
        range: `'${title}'!A1:Z5`,
      });
      const rows = res.result.values || [];
      let best = null;
      rows.forEach((row, ri) => {
        const texts = row.map(c => (c || '').toString().trim());
        const matchCount = requiredHeaderGroups.filter(group =>
          group.some(alias => texts.some(t => t.includes(alias)))
        ).length;
        if(matchCount === requiredHeaderGroups.length){
          if(!best) best = { rowIndex: ri, texts };
        }
      });
      if(best) return { title, headerRowIndex: best.rowIndex, headerTexts: best.texts };
    } catch(e){
      console.warn(`탭 "${title}" 확인 실패`, e);
    }
  }
  return null;
}

function findColIndex(headerTexts, aliases){
  for(let i = 0; i < headerTexts.length; i++){
    if(aliases.some(a => headerTexts[i].includes(a))) return i;
  }
  return -1;
}

async function importClientsFromMaster(){
  const titles = await getMasterSheetTitles();
  const found = await findTabByHeaders(titles, [
    ['순번'],
    ['구분'],
    ['수임'],
    ['상호명', '상호'],
    ['법인번호', '법인등록번호'],
    ['사업자 번호', '사업자등록번호', '사업자번호'],
    ['개업일'],
    ['대표자', '대표'],
  ]);
  if(!found){ console.warn('거래처 기본정보("기장현황") 탭을 찾지 못했습니다.'); return 0; }

  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: MASTER_SHEET_ID,
    range: `'${found.title}'!A${found.headerRowIndex + 1}:Z3000`,
  });
  const rows = res.result.values || [];
  const header = rows[0].map(c => (c || '').toString().trim());
  const idxSeq  = findColIndex(header, ['순번']);
  const idxType = findColIndex(header, ['구분']);
  const idxFee  = findColIndex(header, ['수임']);
  const idxName = findColIndex(header, ['상호명', '상호']);
  const idxCorp = findColIndex(header, ['법인번호', '법인등록번호']);
  const idxBiz  = findColIndex(header, ['사업자 번호', '사업자등록번호', '사업자번호']);
  const idxOpen = findColIndex(header, ['개업일']);
  const idxCeo  = findColIndex(header, ['대표자', '대표']);

  const cell = (r, idx) => idx >= 0 ? (r[idx] || '').toString().trim() : '';

  const imported = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    if(!r) continue;
    const name = cell(r, idxName);
    if(!name) continue;
    const corp = cell(r, idxCorp);
    const explicitType = cell(r, idxType);
    const isCorp = explicitType ? explicitType.includes('법인') : (!!corp && corp !== '-');
    imported.push({
      id: nextClientId++,
      seq: cell(r, idxSeq),
      name,
      ceo: cell(r, idxCeo),
      biz: (() => { const v = cell(r, idxBiz); return v && v !== '-' ? v : ''; })(),
      corpNo: corp && corp !== '-' ? corp : '',
      openDate: cell(r, idxOpen),
      fee: cell(r, idxFee),
      type: isCorp ? '법인' : '개인',
      source: 'master',
    });
  }
  clients = clients.filter(c => c.source !== 'master').concat(imported);
  return imported.length;
}

// "Work List" 형식 탭은 이름이 아니라 A1 셀 내용("Work List")으로 찾는다. 실제 마스터 시트는
// 탭 이름이 "Work List"가 아니라 달마다 W7·W8·W9처럼 늘어나는 구조라서, 이름으로 찾으면 계속
// 못 찾게 됨. A1로 식별하면 다음 달에 탭이 하나 더 생겨도(W10 등) 자동으로 같이 가져와진다.
// 각 탭에서 상단 고정 체크리스트(Check·주요세무일정)와, 날짜별 할 일을 모두 가져온다.
async function findWorkListTabs(){
  const titles = await getMasterSheetTitles();
  const found = [];
  for(const title of titles){
    try{
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: MASTER_SHEET_ID,
        range: `'${title}'!A1`,
      });
      const v = res.result.values && res.result.values[0] && res.result.values[0][0];
      if(v && v.toString().trim() === 'Work List') found.push(title);
    }catch(e){ /* 열람 권한이 없거나 오류가 난 탭은 건너뜀 */ }
  }
  return found;
}

async function importWorklistFromMaster(){
  const tabTitles = await findWorkListTabs();
  if(!tabTitles.length){ console.warn('Work List 형식의 탭을 찾지 못했습니다.'); return { taskCount: 0, checklistMonths: 0 }; }

  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const importedTasks = [];
  const newChecklist = {};
  const newSchedule = {};

  for(const title of tabTitles){
    const res = await gapi.client.sheets.spreadsheets.get({
      spreadsheetId: MASTER_SHEET_ID,
      ranges: [`'${title}'!A1:F4000`],
      fields: 'sheets(merges,data.rowData.values.formattedValue)',
    });
    const sheet = (res.result.sheets || [])[0];
    if(!sheet) continue;
    const rowData = (sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
    const merges = sheet.merges || [];
    const cellText = (ri, ci) => {
      const row = rowData[ri];
      if(!row || !row.values || !row.values[ci]) return '';
      return (row.values[ci].formattedValue || '').toString().trim();
    };

    // 상단 고정 체크리스트(4~12행: B열)와 주요 세무일정(4~12행: E열)
    const checklist = [];
    const schedule = [];
    for(let ri = 3; ri <= 11; ri++){
      const b = cellText(ri, 1);
      const e = cellText(ri, 4);
      if(b) checklist.push(b);
      if(e) schedule.push(e);
    }

    const dateHeaders = merges
      .filter(m => m.startColumnIndex === 0 && (m.endColumnIndex - m.startColumnIndex) >= 2)
      .map(m => ({ merge: m, text: cellText(m.startRowIndex, 0) }))
      .filter(h => dateRe.test(h.text))
      .sort((a, b) => a.merge.startRowIndex - b.merge.startRowIndex);

    const dayTasks = [];
    const monthCounts = {};
    dateHeaders.forEach((h, idx) => {
      const m = dateRe.exec(h.text);
      let year = parseInt(m[1], 10);
      if(year < 100) year += 2000;
      const mo = parseInt(m[2], 10);
      const mm = pad2(mo);
      const dd = pad2(parseInt(m[3], 10));
      const dateStr = `${year}-${mm}-${dd}`;
      monthCounts[mo] = (monthCounts[mo] || 0) + 1;

      const startRow = h.merge.endRowIndex;
      const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.startRowIndex : rowData.length;
      for(let ri = startRow; ri < endRow; ri++){
        const check = cellText(ri, 0);
        const text = cellText(ri, 1);
        if(!text) continue;
        if(check !== 'TRUE' && check !== 'FALSE') continue;
        dayTasks.push({ date: dateStr, text, done: check === 'TRUE' });
      }
    });

    // 탭의 실제 월은 A2에 적힌 라벨보다, 날짜 항목 중 가장 많이 나온 월을 더 신뢰한다.
    // (예: 어떤 탭은 A2가 실수로 다른 달로 적혀 있어도 실제 날짜들은 그 탭의 진짜 달인 경우가 있었음)
    let monthLabel = null, bestCount = -1;
    Object.entries(monthCounts).forEach(([mo, cnt]) => {
      if(cnt > bestCount){ bestCount = cnt; monthLabel = `${parseInt(mo, 10)}월`; }
    });
    if(!monthLabel) monthLabel = cellText(1, 0) || title;

    if(checklist.length) newChecklist[monthLabel] = checklist.map(text => ({ text, done: false }));
    if(schedule.length) newSchedule[monthLabel] = schedule;
    dayTasks.forEach(t => importedTasks.push({ id: nextTaskId++, date: t.date, text: t.text, done: t.done, source: 'master' }));
  }

  tasks = tasks.filter(t => t.source !== 'master').concat(importedTasks);
  worklistChecklist = Object.assign({}, worklistChecklist, newChecklist);
  worklistSchedule = Object.assign({}, worklistSchedule, newSchedule);

  return { taskCount: importedTasks.length, checklistMonths: Object.keys(newChecklist).length };
}

  if(labelText) labelText.textContent = smDeploySelectedFile ? smDeploySelectedFile.name : 'SM.html 파일 선택';
  const msgEl = document.getElementById('smDeployMsg');
  if(msgEl) msgEl.textContent = smDeploySelectedFile ? `업로드 완료: ${smDeploySelectedFile.name} (아직 배포 전이에요)` : '';
  smDeployUpdateBtnState();
}
function smUtf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
async function runSmDeploy(){
  const msgEl = document.getElementById('smDeployMsg');
  const token = (localStorage.getItem(GITHUB_DEPLOY_TOKEN_KEY) || '').trim();
  if(!token || !smDeploySelectedFile) return;
  if(!confirm(`GitHub(${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME})의 ${GITHUB_DEPLOY_FILE_PATH}에 커밋할까요?`)) return;
  const btn = document.getElementById('smDeployBtn');
  if(btn) btn.disabled = true;
  try {
    if(msgEl) msgEl.textContent = '파일 읽는 중...';
    const content = await smDeploySelectedFile.text();
    const apiBase = `https://api.github.com/repos/${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME}/contents/${GITHUB_DEPLOY_FILE_PATH}`;
    const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
    if(msgEl) msgEl.textContent = '기존 파일 정보 확인 중...';
    const getRes = await fetch(apiBase, { headers });
    if(!getRes.ok){
      if(getRes.status === 401) throw new Error('토큰이 유효하지 않아요. 저장소 쓰기 권한이 있는 토큰인지 확인해주세요.');
      if(getRes.status === 404) throw new Error('저장소 또는 파일 경로를 찾을 수 없어요.');
      throw new Error(`GitHub 조회 실패 (${getRes.status})`);
    }
    const cur = await getRes.json();
    if(msgEl) msgEl.textContent = 'GitHub에 커밋하는 중...';
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `SM 업데이트 (${new Date().toLocaleString('ko-KR')})`,
        content: smUtf8ToBase64(content),
        sha: cur.sha,
      }),
    });
    if(!putRes.ok){
      const errBody = await putRes.json().catch(() => ({}));
      throw new Error(errBody.message || `GitHub 커밋 실패 (${putRes.status})`);
    }
    if(msgEl) msgEl.textContent = '배포 완료! 잠시 후 실제 서비스 화면에 반영돼요.';
    smDeploySelectedFile = null;
    const labelText = document.getElementById('smDeployFileLabelText');
    if(labelText) labelText.textContent = 'SM.html 파일 선택';
    const fileInput = document.getElementById('smDeployFile');
    if(fileInput) fileInput.value = '';
  } catch(e){
    console.error('GitHub 배포 실패', e);
    if(msgEl) msgEl.textContent = '배포 실패: ' + (e && e.message ? e.message : e);
  } finally {
    smDeployUpdateBtnState();
  }
}

const GOOGLE_POLL_INTERVAL_MS = 20000;
let googlePollTimer = null;

function isEditingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

async function pollGoogleSheetForUpdates(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  if(saveTimer) return;
  if(isEditingNow()) return;
  try {
    await loadFromGoogleSheet();
    renderAllNoSave();
  } catch(e){
    console.warn('자동 새로고침 실패', e);
    if(isAuthError(e)){
      handleGoogleTokenExpired();
    }
  }
}

function startGooglePolling(){
  clearInterval(googlePollTimer);
  googlePollTimer = setInterval(pollGoogleSheetForUpdates, GOOGLE_POLL_INTERVAL_MS);
}

window.addEventListener('focus', () => { pollGoogleSheetForUpdates(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') pollGoogleSheetForUpdates();
});

function startAppAfterAuth(){
  document.getElementById('todayPill').textContent = todayStr().replaceAll('-','.');
  renderNav();
  switchTab('home');
}
