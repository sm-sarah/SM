async function findTabByHeaders(titles, requiredHeaderGroups){
  // "기장현황"이 들어간 탭을 먼저 확인하고, 제목줄은 위에서 20줄까지 찾음
  const ordered = titles.filter(t => t.includes('기장현황')).concat(titles.filter(t => !t.includes('기장현황')));
  for(const title of ordered){
    try {
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: MASTER_SHEET_ID,
        range: `'${title.replace(/'/g, "''")}'!A1:AZ20`,
      });
      const rows = res.result.values || [];
      let best = null;
      rows.forEach((row, ri) => {
        const texts = row.map(c => (c || '').toString().trim());
        const matchCount = requiredHeaderGroups.filter(group =>
          group.some(alias => texts.some(t => t.includes(alias)))
        ).length;
        if(matchCount === requiredHeaderGroups.length){
          if(!best) best = { rowIndex: ri, texts };
        }
      });
      if(best) return { title, headerRowIndex: best.rowIndex, headerTexts: best.texts };
    } catch(e){
      console.warn(`탭 "${title}" 확인 실패`, e);
    }
  }
  return null;
}

function findColIndex(headerTexts, aliases){
  for(let i = 0; i < headerTexts.length; i++){
    if(aliases.some(a => headerTexts[i].includes(a))) return i;
  }
  return -1;
}

let lastMasterClientTab = '';
let lastMasterClientMap = '';
const CLIENT_FIELDS = [
  // key, 화면 이름, 정확히 일치할 제목들(우선), 포함 검색 제목들(보조)
  { key:'seq',      label:'순번',         exact:['순번','No','NO','no','번호','연번'], incl:['순번'] },
  { key:'type',     label:'구분',         exact:['구분','법인/개인','법인구분'],     incl:['구분'] },
  { key:'name',     label:'상호명',       exact:['상호명','상호','거래처명','회사명','업체명'], incl:['상호','거래처명'] },
  { key:'biz',      label:'사업자번호',   exact:['사업자번호','사업자등록번호','사업자 번호'], incl:['사업자번호','사업자등록번호','사업자 번호'] },
  { key:'corpNo',   label:'법인등록번호', exact:['법인등록번호','법인번호','법인(주민)번호','주민/법인번호'], incl:['법인등록','법인번호'] },
  { key:'ceo',      label:'대표자',       exact:['대표자','대표','대표자명'],        incl:['대표자'] },
  { key:'openDate', label:'개업일',       exact:['개업일','개업일자','개업연월일','설립일'], incl:['개업'] },
  { key:'fee',      label:'수임료',       exact:['수임료','기장료','수수료','월기장료'], incl:['수임료','기장료'] },
];
const normHead = v => (v == null ? '' : String(v)).replace(/\s+/g, '').trim();

// 제목줄(1~2줄짜리 이중 제목도 대응)을 찾아 각 항목이 몇 번째 열인지 알아냄
function mapClientColumns(rows){
  const top = rows.slice(0, 20).map(r => (r || []).map(normHead));
  let bestRow = -1, bestScore = 0;
  top.forEach((r, ri) => {
    let score = 0;
    CLIENT_FIELDS.forEach(f => { if(r.some(t => f.exact.map(normHead).includes(t))) score += 2; else if(r.some(t => t && f.incl.some(a => t.includes(normHead(a))))) score += 1; });
    if(score > bestScore){ bestScore = score; bestRow = ri; }
  });
  if(bestRow < 0) return null;
  const used = new Set(); const idx = {}; const idxRow = {};
  const tryRows = [bestRow, bestRow + 1, bestRow - 1].filter(r => r >= 0 && r < top.length);
  CLIENT_FIELDS.forEach(f => {   // 1순위: 정확히 일치
    for(const r of tryRows){ const c = top[r].findIndex((t, ci) => !used.has(ci) && f.exact.map(normHead).includes(t)); if(c >= 0){ idx[f.key] = c; idxRow[f.key] = r; used.add(c); return; } }
  });
  CLIENT_FIELDS.forEach(f => {   // 2순위: 포함
    if(idx[f.key] != null) return;
    for(const r of tryRows){ const c = top[r].findIndex((t, ci) => t && !used.has(ci) && f.incl.some(a => t.includes(normHead(a)))); if(c >= 0){ idx[f.key] = c; idxRow[f.key] = r; used.add(c); return; } }
  });
  // 수임료를 못 찾았을 때만 "수임" 열을 사용
  if(idx.fee == null){ const c = top[bestRow].findIndex((t, ci) => !used.has(ci) && t === '수임'); if(c >= 0){ idx.fee = c; idxRow.fee = bestRow; used.add(c); } }
  // 데이터 시작 줄: 제목줄 다음 줄이 또 제목(하위 제목)이면 한 줄 더 내려감
  let dataStart = bestRow + 1;
  if(top[bestRow + 1]){
    const sub = CLIENT_FIELDS.filter(f => top[bestRow + 1].some(t => f.exact.map(normHead).includes(t))).length;
    if(sub >= 2) dataStart = bestRow + 2;
  }
  return { headerRow: bestRow, dataStart, idx, idxRow, headerTexts: rows[bestRow] || [] };
}

async function importClientsFromMaster(){
  const titles = await getMasterSheetTitles();
  const ordered = titles.filter(t => t.includes('기장현황')).concat(titles.filter(t => !t.includes('기장현황')));
  let found = null, rows = null, map = null;
  for(const title of ordered){
    try{
      const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: MASTER_SHEET_ID, range: `'${title.replace(/'/g, "''")}'!A1:AZ3000` });
      const rs = res.result.values || [];
      const m = mapClientColumns(rs);
      if(m && m.idx.name != null && (m.idx.biz != null || m.idx.corpNo != null)){ found = title; rows = rs; map = m; break; }
    }catch(e){ console.warn(`탭 "${title}" 확인 실패`, e); }
  }
  if(!found) throw new Error(`거래처 표를 찾지 못했어요. 확인한 탭: ${titles.join(', ')} — "상호"와 "사업자번호" 제목이 있는 탭이 필요해요.`);

  const cell = (r, key) => { const c = map.idx[key]; if(c == null) return ''; const v = (r[c] == null ? '' : String(r[c])).trim(); return v === '-' ? '' : v; };
  const incoming = [];
  for(let i = map.dataStart; i < rows.length; i++){
    const r = rows[i]; if(!r) continue;
    const name = cell(r, 'name'); if(!name) continue;
    const corpNo = cell(r, 'corpNo');
    const typeText = cell(r, 'type');
    incoming.push({
      seq: cell(r, 'seq'), name, ceo: cell(r, 'ceo'), biz: cell(r, 'biz'), corpNo,
      openDate: cell(r, 'openDate'), fee: cell(r, 'fee'),
      type: typeText ? (typeText.includes('법인') ? '법인' : '개인') : (corpNo ? '법인' : '개인'),
    });
  }
  if(!incoming.length) throw new Error(`"${found}" 탭에서 거래처를 한 건도 읽지 못했어요.`);

  // 기존 거래처와 사업자번호(없으면 상호)로 짝지어서, 직접 수정한 칸은 유지하고 이력도 이어감
  const oldMaster = clients.filter(c => c.source === 'master');
  const keyOf = c => (c.biz || '').replace(/\D/g, '') || ('N:' + c.name);
  const oldByKey = {}; oldMaster.forEach(c => { oldByKey[keyOf(c)] = c; });
  const nowIso = new Date().toISOString();
  const merged = incoming.map(n => {
    const old = oldByKey[keyOf(n)];
    const base = old ? { ...old } : { id: nextClientId++, source: 'master', history: [{ at: nowIso, kind: '가져옴', changes: [] }] };
    const overrides = base.overrides || {};
    const changes = [];
    CLIENT_FIELDS.forEach(f => {
      if(overrides[f.key]) return;                       // 직접 수정한 칸은 마스터 값으로 덮지 않음
      const from = old ? (old[f.key] || '') : ''; const to = n[f.key] || '';
      if(old && from !== to) changes.push({ field: f.key, label: f.label, from, to });
      base[f.key] = to;
    });
    if(old && changes.length) base.history = (base.history || []).concat([{ at: nowIso, kind: '마스터 반영', changes }]);
    return base;
  });
  const isSample = c => !c.source && typeof c.id === 'number' && c.id <= 8 && /^(110-81|220-11)-\d{5}$/.test(c.biz || '');
  clients = clients.filter(c => c.source !== 'master' && !isSample(c)).concat(merged);
  lastMasterClientTab = found;
  lastMasterClientMap = CLIENT_FIELDS.map(f => `${f.label}: ${map.idx[f.key] != null ? `"${String((rows[map.idxRow[f.key]] || [])[map.idx[f.key]] || '').trim()}" 열` : '못 찾음'}`).join('\n');
  return merged.length;
}

// "Work List" 형식 탭은 이름이 아니라 A1 셀 내용("Work List")으로 찾는다. 실제 마스터 시트는
// 탭 이름이 "Work List"가 아니라 달마다 W7·W8·W9처럼 늘어나는 구조라서, 이름으로 찾으면 계속
// 못 찾게 됨. A1로 식별하면 다음 달에 탭이 하나 더 생겨도(W10 등) 자동으로 같이 가져와진다.
// 각 탭에서 상단 고정 체크리스트(Check·주요세무일정)와, 날짜별 할 일을 모두 가져온다.
async function findWorkListTabs(){
  const titles = await getMasterSheetTitles();
  const found = [];
  for(const title of titles){
    try{
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: MASTER_SHEET_ID,
        range: `'${title}'!A1`,
      });
      const v = res.result.values && res.result.values[0] && res.result.values[0][0];
      if(v && v.toString().trim() === 'Work List') found.push(title);
    }catch(e){ /* 열람 권한이 없거나 오류가 난 탭은 건너뜀 */ }
  }
  return found;
}

async function importWorklistFromMaster(){
  const tabTitles = await findWorkListTabs();
  if(!tabTitles.length){ console.warn('Work List 형식의 탭을 찾지 못했습니다.'); return { taskCount: 0, checklistMonths: 0 }; }

  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const importedTasks = [];
  const newChecklist = {};
  const newSchedule = {};

  for(const title of tabTitles){
    const res = await gapi.client.sheets.spreadsheets.get({
      spreadsheetId: MASTER_SHEET_ID,
      ranges: [`'${title}'!A1:F4000`],
      fields: 'sheets(merges,data.rowData.values.formattedValue)',
    });
    const sheet = (res.result.sheets || [])[0];
    if(!sheet) continue;
    const rowData = (sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
    const merges = sheet.merges || [];
    const cellText = (ri, ci) => {
      const row = rowData[ri];
      if(!row || !row.values || !row.values[ci]) return '';
      return (row.values[ci].formattedValue || '').toString().trim();
    };

    // 상단 고정 체크리스트(4~12행: B열)와 주요 세무일정(4~12행: E열)
    const checklist = [];
    const schedule = [];
    for(let ri = 3; ri <= 11; ri++){
      const b = cellText(ri, 1);
      const e = cellText(ri, 4);
      if(b) checklist.push(b);
      if(e) schedule.push(e);
    }

    const dateHeaders = merges
      .filter(m => m.startColumnIndex === 0 && (m.endColumnIndex - m.startColumnIndex) >= 2)
      .map(m => ({ merge: m, text: cellText(m.startRowIndex, 0) }))
      .filter(h => dateRe.test(h.text))
      .sort((a, b) => a.merge.startRowIndex - b.merge.startRowIndex);

    const dayTasks = [];
    const monthCounts = {};
    dateHeaders.forEach((h, idx) => {
      const m = dateRe.exec(h.text);
      let year = parseInt(m[1], 10);
      if(year < 100) year += 2000;
      const mo = parseInt(m[2], 10);
      const mm = pad2(mo);
      const dd = pad2(parseInt(m[3], 10));
      const dateStr = `${year}-${mm}-${dd}`;
      monthCounts[mo] = (monthCounts[mo] || 0) + 1;

      const startRow = h.merge.endRowIndex;
      const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.startRowIndex : rowData.length;
      for(let ri = startRow; ri < endRow; ri++){
        const check = cellText(ri, 0);
        const text = cellText(ri, 1);
        if(!text) continue;
        if(check !== 'TRUE' && check !== 'FALSE') continue;
        dayTasks.push({ date: dateStr, text, done: check === 'TRUE' });
      }
    });

    // 탭의 실제 월은 A2에 적힌 라벨보다, 날짜 항목 중 가장 많이 나온 월을 더 신뢰한다.
    // (예: 어떤 탭은 A2가 실수로 다른 달로 적혀 있어도 실제 날짜들은 그 탭의 진짜 달인 경우가 있었음)
    let monthLabel = null, bestCount = -1;
    Object.entries(monthCounts).forEach(([mo, cnt]) => {
      if(cnt > bestCount){ bestCount = cnt; monthLabel = `${parseInt(mo, 10)}월`; }
    });
    if(!monthLabel) monthLabel = cellText(1, 0) || title;

    if(checklist.length) newChecklist[monthLabel] = checklist.map(text => ({ text, done: false }));
    if(schedule.length) newSchedule[monthLabel] = schedule;
    dayTasks.forEach(t => importedTasks.push({ id: nextTaskId++, date: t.date, text: t.text, done: t.done, source: 'master' }));
  }

  // 오늘로 넘긴 할 일은 원래 날짜에 다시 생기지 않도록 제외
  const movedKeys = new Set(tasks.filter(t => t.movedFrom).map(t => t.movedFrom + '|' + t.text).concat(settings.hiddenMasterTasks || []));
  tasks = tasks.filter(t => t.source !== 'master').concat(importedTasks.filter(t => !movedKeys.has(t.date + '|' + t.text)));
  // 체크리스트는 달별로 합치기: 체크 상태·이력 유지, 직접 추가한 항목 유지, 지우거나 고친 마스터 항목은 되살리지 않음
  const hiddenCL = new Set(settings.hiddenMasterChecklist || []);
  Object.keys(newChecklist).forEach(mo => {
    const old = worklistChecklist[mo] || [];
    const byText = {}; old.forEach(it => { byText[it.origText || it.text] = it; });
    const fromMaster = newChecklist[mo]
      .filter(it => !hiddenCL.has(mo + '|' + it.text) || byText[it.text])
      .map(it => byText[it.text] || it);
    const kept = old.filter(it => it.source === 'user' || (it.origText && !fromMaster.includes(it)));
    worklistChecklist[mo] = fromMaster.concat(kept.filter(it => !fromMaster.includes(it)));
  });
  worklistSchedule = Object.assign({}, worklistSchedule, newSchedule);

  return { taskCount: importedTasks.length, checklistMonths: Object.keys(newChecklist).length };
}

/* ===== 엑셀 파일에서 체크리스트·할 일 가져오기 =====
   "★Tax_2026" 마스터 시트를 엑셀로 내려받은 파일을 읽어요.
   A1이 "Work List"인 시트(들)에서, B4:B12는 고정 체크리스트, E4:E12는 주요 세무일정,
   A열에 "OO년 O월 O일"로 병합된 칸을 날짜 구간으로 보고 그 아래 A열(체크)·B열(내용)을 할 일로 읽어요. */
function computeWorklistImportFromExcel(wb){
  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const importedTasks = [];
  const newChecklist = {};
  const newSchedule = {};

  const wlSheets = wb.SheetNames.filter(name => {
    const ws = wb.Sheets[name];
    const a1 = ws && ws['A1'] ? String(ws['A1'].v == null ? '' : ws['A1'].v).trim() : '';
    return a1 === 'Work List';
  });
  const targetSheets = wlSheets.length ? wlSheets : wb.SheetNames;

  targetSheets.forEach(title => {
    const ws = wb.Sheets[title];
    if(!ws) return;
    const merges = ws['!merges'] || [];
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
    const cellText = (ri, ci) => {
      const cell = ws[XLSX.utils.encode_cell({ r: ri, c: ci })];
      if(!cell) return '';
      return String(cell.w != null ? cell.w : (cell.v == null ? '' : cell.v)).trim();
    };

    const checklist = [];
    const schedule = [];
    for(let ri = 3; ri <= 11; ri++){
      const b = cellText(ri, 1);
      const e = cellText(ri, 4);
      if(b) checklist.push(b);
      if(e) schedule.push(e);
    }

    const dateHeaders = merges
      .filter(m => m.s.c === 0 && (m.e.c - m.s.c) >= 2)
      .map(m => ({ merge: m, text: cellText(m.s.r, 0) }))
      .filter(h => dateRe.test(h.text))
      .sort((a, b) => a.merge.s.r - b.merge.s.r);

    const dayTasks = [];
    const monthCounts = {};
    dateHeaders.forEach((h, idx) => {
      const m = dateRe.exec(h.text);
      let year = parseInt(m[1], 10);
      if(year < 100) year += 2000;
      const mo = parseInt(m[2], 10);
      const mm = pad2(mo);
      const dd = pad2(parseInt(m[3], 10));
      const dateStr = `${year}-${mm}-${dd}`;
      monthCounts[mo] = (monthCounts[mo] || 0) + 1;

      const startRow = h.merge.e.r + 1;
      const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.s.r : (range.e.r + 1);
      for(let ri = startRow; ri < endRow; ri++){
        const check = cellText(ri, 0);
        const text = cellText(ri, 1);
        if(!text) continue;
        if(check !== 'TRUE' && check !== 'FALSE') continue;
        dayTasks.push({ date: dateStr, text, done: check === 'TRUE' });
      }
    });

    let monthLabel = null, bestCount = -1;
    Object.entries(monthCounts).forEach(([mo, cnt]) => {
      if(cnt > bestCount){ bestCount = cnt; monthLabel = `${parseInt(mo, 10)}월`; }
    });
    if(!monthLabel) monthLabel = cellText(1, 0) || title;

    if(checklist.length) newChecklist[monthLabel] = checklist.map(text => ({ text, done:false }));
    if(schedule.length) newSchedule[monthLabel] = schedule;
    dayTasks.forEach(t => importedTasks.push({ id: nextTaskId++, date: t.date, text: t.text, done: t.done, source:'master' }));
  });

  return { importedTasks, newChecklist, newSchedule };
}

function applyWorklistImport({ importedTasks, newChecklist, newSchedule }){
  const movedKeys = new Set(tasks.filter(t => t.movedFrom).map(t => t.movedFrom + '|' + t.text).concat(settings.hiddenMasterTasks || []));
  tasks = tasks.filter(t => t.source !== 'master').concat(importedTasks.filter(t => !movedKeys.has(t.date + '|' + t.text)));
  const hiddenCL = new Set(settings.hiddenMasterChecklist || []);
  Object.keys(newChecklist).forEach(mo => {
    const old = worklistChecklist[mo] || [];
    const byText = {}; old.forEach(it => { byText[it.origText || it.text] = it; });
    const fromMaster = newChecklist[mo]
      .filter(it => !hiddenCL.has(mo + '|' + it.text) || byText[it.text])
      .map(it => byText[it.text] || it);
    const kept = old.filter(it => it.source === 'user' || (it.origText && !fromMaster.includes(it)));
    worklistChecklist[mo] = fromMaster.concat(kept.filter(it => !fromMaster.includes(it)));
  });
  worklistSchedule = Object.assign({}, worklistSchedule, newSchedule);
}

async function importWorklistExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    if(typeof XLSX === 'undefined'){
      await new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; el.onload = res; el.onerror = () => rej(new Error('엑셀 읽기 도구를 불러오지 못했어요')); document.head.appendChild(el); });
    }
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const parsed = computeWorklistImportFromExcel(wb);
    const checklistMonths = Object.keys(parsed.newChecklist).length;
    if(!parsed.importedTasks.length && !checklistMonths){
      smAlert('가져올 내용을 찾지 못했어요', '"Work List" 형식의 엑셀 파일인지 확인해주세요.', { tone:'danger' });
      return;
    }
    if(!(await smConfirm(`할 일 ${parsed.importedTasks.length}건, 체크리스트 ${checklistMonths}개월분을 가져올까요?`,
      '엑셀 파일의 최신 내용으로 맞춰요.\n직접 추가한 항목은 그대로 남아요.', { icon:'↓', okText:'가져오기' }))) return;
    applyWorklistImport(parsed);
    scheduleGoogleSave();
    renderAll();
    smAlert('가져왔어요', `할 일 ${parsed.importedTasks.length}건, 체크리스트 ${checklistMonths}개월분을 반영했어요.`, { icon:'✓' });
  }catch(e){
    console.error(e);
    smAlert('가져오지 못했어요', e.message || '알 수 없는 오류', { tone:'danger' });
  }
}

    // (표시 글자를 그대로 적으면 이 코드 자체가 그 글자를 품게 되므로 잘라서 이어 붙임)
    {
      const has = t => content.indexOf(t) >= 0;
      const mustHave = [['<ti' + "tle>Sunmin's Works</ti" + 'tle>', 'works 제목'], ["GITHUB_DEPLOY_REPO_NAME = 'S" + "M'", 'works 배포 설정'], ['function render' + 'Worklist', 'To do 화면']];
      const mustNot = [['<ti' + 'tle>Tax.J</ti' + 'tle>', 'Tax.J 제목'], ["FS_COLLECTION = 'ta" + "xj'", 'Tax.J 저장소 설정'], ["GITHUB_DEPLOY_REPO_NAME = 'Ta" + "x.J'", 'Tax.J 배포 설정']];
      const miss = mustHave.filter(([t]) => !has(t)).map(x => x[1]), bad = mustNot.filter(([t]) => has(t)).map(x => x[1]);
      if(miss.length || bad.length) throw new Error(`works 파일이 아니에요(${bad.length ? bad.join('·') + ' 들어 있음' : miss.join('·') + ' 없음'}). SM.html을 골라 주세요. 회사웹 index.html은 Tax.J에서 배포해요.`);
    }
    const apiBase = `https://api.github.com/repos/${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME}/contents/${GITHUB_DEPLOY_FILE_PATH}`;
    const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };

    if(!getRes.ok){
      if(getRes.status === 401) throw new Error('토큰이 유효하지 않아요. 저장소 쓰기 권한이 있는 토큰인지 확인해주세요.');
      if(getRes.status === 404) throw new Error('저장소 또는 파일 경로를 찾을 수 없어요.');
      throw new Error(`GitHub 조회 실패 (${getRes.status})`);
    }
    const cur = await getRes.json();
    // 지금 올라가 있는 파일과 크기가 30% 넘게 다르면(통째로 다른 파일일 가능성) 한 번 더 확인
    {
      const newSize = new Blob([content]).size, oldSize = Number(cur.size) || 0;

        const kb = n => Math.round(n / 1024).toLocaleString() + 'KB';
        if(!(await smConfirm('크기가 많이 달라요', `지금 올라가 있는 파일과 크기가 많이 달라요 (${kb(oldSize)} → ${kb(newSize)}).\n다른 파일일 수 있어요. 그래도 배포할까요?`, { tone:'danger', icon:'!', okText:'그래도 배포' }))) throw new Error('크기가 많이 달라서 배포를 멈췄어요.');
      }
    }
    setSmDeployMsg('GitHub에 커밋하는 중...');
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `SM 업데이트 (${new Date().toLocaleString('ko-KR')})`,
        content: smUtf8ToBase64(content),
        sha: cur.sha,
      }),
    });
    if(!putRes.ok){
      const errBody = await putRes.json().catch(() => ({}));
      throw new Error(errBody.message || `GitHub 커밋 실패 (${putRes.status})`);
    }
    setSmDeployMsg('배포 완료! 잠시 후 실제 서비스 화면에 반영돼요.');
    // 요청 배경(2026.10.06): 왼쪽 퀵배포로 올리면 설정 화면의 작은 글씨가 안 보여 완료 여부를 몰랐음 → 어느 화면에서든 팝업으로 알림
    smAlert('배포 완료!', '잠시 후 실제 서비스 화면에 반영돼요.', { icon:'✓' });
    smDeploySelectedFile = null;
    const labelText = document.getElementById('smDeployFileLabelText');
    if(labelText) labelText.textContent = 'SM.html 파일 선택';
    const fileInput = document.getElementById('smDeployFile');
    if(fileInput) fileInput.value = '';
  } catch(e){
    console.error('GitHub 배포 실패', e);
    setSmDeployMsg('배포 실패: ' + (e && e.message ? e.message : e));
    smAlert('배포 실패', String(e && e.message ? e.message : e));
  } finally {
    smDeployUpdateBtnState();
  }
}

function taxjLiveClientRows(){
  const list = taxjClientsList().length ? taxjClientsList() : (((taxjLive && taxjLive.data && taxjLive.data.clients) || {}).list || []);   // [2026.10.12] 실시간 연결 자료가 있으면 그걸 먼저
  const isReg = c => ['기장대행','신고대리'].includes(c.taxType);
  const w1 = c => c.entityType === '법인' ? 0 : c.entityType === '개인' ? 1 : 2;
  const w2 = c => c.taxType === '기장대행' ? 0 : c.taxType === '신고대리' ? 1 : 2;
  const sorted = list.map((c, i)=> ({ c, i })).sort((a, b)=> (w1(a.c) - w1(b.c)) || (w2(a.c) - w2(b.c)) || (a.i - b.i)).map(x=> x.c);
  const fee = v => { const n = String(v == null ? '' : v).replace(/[^0-9]/g, ''); return n ? Number(n).toLocaleString() : ''; };
  const row = (c, i) => ({ seq: String(i + 1), taxType: c.taxType === '기타' && c.taxTypeEtc ? c.taxTypeEtc : (c.taxType || ''), type: c.entityType === '법인' ? '법인' : '개인',
    name: c.name || '', biz: c.bizNo || '', corpNo: c.corpRegNo || '', ceo: c.repName || '', fee: fee(c.fee), contractDate: c.contractDate || '', start: c.start || '', openDate: c.openDate || '',
    terminationDate: c.terminationDate || '', terminationMonth: c.terminationMonth || '', terminationReason: c.terminationReason || '', taxjId: c.id });
  const reg = sorted.filter(c=> isReg(c) && c.status !== '해지').map(row);
  const other = sorted.filter(c=> !isReg(c) && c.status !== '해지').map(row);
  const term = sorted.filter(c=> c.status === '해지').map(row);
  return { reg, other, term };
}

function taxjParseSnap(snap){
  const mains = {}, parts = {};

    const id = d.id;
    if(id === '_meta' || id.startsWith('_presence__')) return;
    const m = id.match(/^(.*)~p(\d+)$/);
    if(m) (parts[m[1]] = parts[m[1]] || {})[Number(m[2])] = d.data(); else mains[id] = d.data();
  });
  const docs = {};
  Object.keys(mains).forEach(k => {
    const m = mains[k], n = m.n || 1; let json = m.j || 'null';
    for(let i = 1; i < n; i++){ const p = parts[k] && parts[k][i]; if(!p || p.w !== m.w){ json = null; break; } json += p.j; }
    if(json != null){ try{ docs[k] = JSON.parse(json); }catch(e){} }
    else if(taxjFull && taxjFull.docs && k in taxjFull.docs) docs[k] = taxjFull.docs[k];   // 조각이 덜 모였으면 직전 값 유지
  });
  return docs;
}

// '회사 진행' 칸과 제출 탭에 바로 반영. 읽기만 하고 회사 원본은 고치지 않음. 내 확인·메모는 works 저장 공간(submitMine)에만 저장.
// 다음에 열면 Firebase가 기억한 회사 로그인으로 창 없이 다시 연결(sm_taxj_live). 큰 자료라 이 기기 저장은 몇 초 모아서, Google 시트는 10분에 한 번만
let taxjLiveUnsub = null, taxjLiveOn = false, taxjLiveErr = '', taxjLiveIdbTimer = null, taxjLiveSheetAt = 0, taxjLiveRenderPending = false;
let taxjMatchCache = null;
function taxjLiveStart(app){
  if(taxjLiveUnsub) return;
  taxjLiveErr = '';
  taxjLiveUnsub = app.firestore().collection('taxj').onSnapshot(snap => {
    if(snap.metadata && snap.metadata.fromCache) return;
    const changed = !taxjLiveOn || snap.docChanges().some(ch => ch.doc.id !== '_meta' && !ch.doc.id.startsWith('_presence__'));
    taxjLiveOn = true; taxjLiveErr = '';
    if(!changed) return;
    const user = app.auth().currentUser;
    taxjFull = { at: Date.now(), email: (user && user.email) || (taxjFull && taxjFull.email) || '', docs: taxjParseSnap(snap) };
    taxjMatchCache = null;
    taxjLiveRerender();
    taxjLivePersist();
  }, err => {
    console.error('Tax.J 실시간 수신 오류', err);
    taxjLiveOn = false; taxjLiveUnsub = null;
    taxjLiveErr = err && err.code === 'permission-denied' ? '읽기 권한이 없어요(회사 계정인지 확인해 주세요)' : (err && (err.code || err.message)) || String(err);
    if(!(err && err.code === 'permission-denied')) taxjLiveRetrySoon();   // [2026.10.13] 끊기면 1분 뒤 저절로 다시 연결
    taxjLiveRerender();
  });
  try{ localStorage.setItem('sm_taxj_live', '1'); }catch(e){}
}
function taxjLivePersist(){
  clearTimeout(taxjLiveIdbTimer);
  taxjLiveIdbTimer = setTimeout(async () => {
    if(Date.now() - taxjLiveSheetAt > 10 * 60 * 1000){ taxjLiveSheetAt = Date.now(); await taxjSaveFull(taxjFull); }
    else { try{ await taxjIdbSet(taxjFull); }catch(e){ console.error('Tax.J 자료 기기 저장 실패', e); } }
  }, 4000);
}

//   다시 붙는 길이 첫 화면 한 번뿐이라 버튼을 다시 눌러야 했음 → 화면으로 돌아올 때·인터넷이 다시 연결될 때·끊긴 뒤 1분마다 조용히 다시 시도(로그인 창은 안 띄움).
//   다시 붙는 동안엔 버튼 대신 '자동 연결 중…'을 보여 줌. 권한 없음(다른 계정) 오류는 다시 시도하지 않음
let taxjLiveAutoBusy = false, taxjLiveRetryTimer = null, taxjLiveAutoReady = false;   // Ready: 첫 화면이 뜬 뒤에만 다시 시도
function taxjLiveRetrySoon(){

}
window.addEventListener('online', () => { if(taxjLiveAutoReady && !taxjLiveOn) taxjLiveAutoStart(); });
document.addEventListener('visibilitychange', () => { if(taxjLiveAutoReady && document.visibilityState === 'visible' && !taxjLiveOn) taxjLiveAutoStart(); });
async function taxjLiveAutoStart(){
  try{ if(localStorage.getItem('sm_taxj_live') !== '1') return; }catch(e){ return; }
  if(taxjLiveAutoBusy || taxjFullBusy || taxjLiveOn || taxjLiveUnsub) return;
  taxjLiveAutoBusy = true; taxjLiveRerender();
  try{
    if(!taxjFullRestoreTried) taxjRestoreFull();
    const app = await taxjCompanyApp();
    const auth = app.auth();
    // [2026.10.13] 휴대폰에서 로그인 확인이 늦으면 5초로는 모자라서 15초까지 기다림
    const user = auth.currentUser || await new Promise(res => { let off = null; const t = setTimeout(() => { try{ off && off(); }catch(e){} res(null); }, 15000); off = auth.onAuthStateChanged(u => { clearTimeout(t); try{ off(); }catch(e){} res(u); }); });
    if(!user || !String(user.email || '').toLowerCase().endsWith(TAXJ_COMPANY_DOMAIN)) return;
    taxjLiveStart(app);
  }catch(e){ console.warn('Tax.J 실시간 연결 건너뜀', e); taxjLiveRetrySoon(); }
  finally{ taxjLiveAutoBusy = false; taxjLiveRerender(); }
}

function taxjDoc(key){ return taxjFull && taxjFull.docs ? taxjFull.docs['s__' + key] : undefined; }

function taxjNormName(v){ return String(v || '').replace(/\s+/g, '').replace(/주식회사|\(주\)|㈜|^주\)/g, '').toLowerCase(); }
function taxjIdOf(c){

const SUBMIT_DUE = { 사업간이:'pay', 기타간이:'pay', 일용지급:'pay', 일용근확:'att15', 특고:'att15', 학자금상환:'pay10' };

function attWorkdays(ms, att, pd){

  const hire = String((pd.settings && pd.settings.hireDate) || ''), hireFrom = hire.startsWith(ms) ? hire : '';
  let raw = 0; for(let d = hireFrom ? Number(hireFrom.slice(8, 10)) : 1; d <= total; d++){ const w = new Date(yy, mm - 1, d).getDay(); if(w && w !== 6) raw++; }
  const SPECIAL = ['포상휴가','경조사휴가','공가','기타휴가'];
  const usage = (att.leaveUsage || []).filter(u => String(u.date || '').startsWith(ms));
  let noLunch = 0; const noLunchDates = new Set();
  usage.forEach(u => {
    if(u.type === '연차'){ noLunch += 1; noLunchDates.add(u.date); }
    else if(u.type === '반차' && (u.subtype === '오전반차' || u.subtype === '오후반차_식사X')){ noLunch += 1; noLunchDates.add(u.date); }
    else if(SPECIAL.includes(u.type)){ noLunch += Number(u.days) || 0; noLunchDates.add(u.date); }
  });
  const exc = taxjDoc('exclusionDays'), list = (Array.isArray(exc) ? exc : []).filter(x => x && String(x.date || '').startsWith(ms) && (!hireFrom || x.date >= hireFrom));
  const isWd = ds => { const w = new Date(ds + 'T00:00:00').getDay(); return w && w !== 6; };
  const hol = list.filter(x => x.reason === '공휴일' && isWd(x.date)).length;
  const exclusion = list.filter(x => x.reason === '점심회식' || x.reason === '기타').length;
  const remoteNoLunch = (att.remoteEntries || []).filter(r => {
    if(!String(r.date || '').startsWith(ms)) return false;
    if(r.half) return !!r.noLunch && !noLunchDates.has(r.date);
    if(r.bonus) return ms >= '2026-09';
    return !!r.noLunch;

  const weekdays = Math.max(0, raw - hol);
  return { weekdays, workdays: Math.max(0, weekdays - noLunch - exclusion - remoteNoLunch) };

      return `<div class="table-scroll"><table><thead><tr>${show.map(c => `<th>${taxjEsc(taxjKo(c))}</th>`).join('')}</tr></thead>
        <tbody>${v.slice(0, 500).map(x => `<tr>${show.map(c => `<td style="vertical-align:top;">${taxjCellHtml(x[c], depth)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        ${v.length > 500 ? `<div class="hint">앞의 500건만 보여요 (전체 ${v.length}건)</div>` : ''}${cols.length > 14 ? `<div class="hint">칸이 많아 앞의 14칸만 보여요.</div>` : ''}`;
    }
    return `<ul style="margin:0; padding-left:18px;">${v.slice(0, 500).map(x => `<li>${taxjValHtml(x, depth + 1)}</li>`).join('')}</ul>`;
  }
  const keys = Object.keys(v);
  if(!keys.length) return '<span class="hint" style="margin:0;">(비어 있음)</span>';
  if(keys.every(k => v[k] == null || typeof v[k] !== 'object' || taxjIsLocked(v[k])))
    return `<div style="display:grid; grid-template-columns:max-content 1fr; gap:2px 12px; font-size:13px;">${keys.map(k => `<div style="color:var(--muted);">${taxjEsc(taxjKo(k))}</div><div>${taxjValHtml(v[k], depth + 1)}</div>`).join('')}</div>`;
  return keys.map(k => `<details style="margin:4px 0 4px ${depth ? 8 : 0}px;" ${keys.length === 1 ? 'open' : ''}><summary style="cursor:pointer; font-weight:700;">${taxjEsc(taxjKo(k))} <span class="hint" style="margin:0; font-weight:500;">${taxjSizeTxt(v[k])}</span></summary><div style="margin:6px 0 0 12px;">${taxjValHtml(v[k], depth + 1)}</div></details>`).join('');
}
function taxjCellHtml(v, depth){
  if(v && typeof v === 'object' && !taxjIsLocked(v)) return `<details><summary style="cursor:pointer;" class="hint">${taxjSizeTxt(v) || '보기'}</summary>${taxjValHtml(v, depth + 1)}</details>`;
  return taxjValHtml(v, depth + 1);
}
function taxjSizeTxt(v){
  if(Array.isArray(v)) return `${v.length}건`;
  if(v && typeof v === 'object' && !taxjIsLocked(v)) return `${Object.keys(v).length}항목`;
  return '';
}
function taxjSectionHtml(label, value){
  const empty = value == null || (typeof value === 'object' && !taxjIsLocked(value) && !Object.keys(value).length);
  return `<details class="card" style="margin-bottom:10px;" ${empty ? '' : ''}>
    <summary style="cursor:pointer; font-weight:800; font-size:15px;">${taxjEsc(label)} <span class="hint" style="margin:0; font-weight:500;">${empty ? '(내용 없음)' : taxjSizeTxt(value)}</span></summary>
    <div style="margin-top:10px;">${empty ? '<div class="empty">Tax.J에 저장된 내용이 없어요.</div>' : taxjValHtml(value, 0)}</div>
  </details>`;
}

// ── [2026.10.08] Tax.J › 신고 진행 현황을 보기 좋게 정리(요청: "보기좋게 정리해도 좋아") ──
// 저장해 둔 Tax.J 자료(taxjFull)를 Tax.J 화면과 같은 기준으로 표로 보여줌. 자료 구조는 Tax.J index.html의 shared* 변수 주석과 같음.
let taxjFilingSub = 'itReview';     // [2026.10.13] 원천세 진행·총괄은 원천세 메뉴로 옮겨서 뺌(요청) · it(원천세 진행) | itReview(원천세 검토) | itOverview(원천세 총괄) | vat(부가세) | pl(손익보고서) | raw(원본 자료)
let taxjFilingMonth = '', taxjFilingYear = '';
const TAXJ_IT_STAGES_FULL = [['payslip','급여명세서 전달'], ['payroll','급여마감'], ['returnClose','원천세 신고서 마감'], ['returnCloseLocal','지방세 신고서 마감'], ['national','원천세 신고'], ['local','지방세 신고']];
const TAXJ_FILING_SUBS = [['itReview','원천세 검토'], ['vat','부가세'], ['pl','손익보고서'], ['raw','원본 자료']];
const TAXJ_VAT_PERIODS = ['1기예정','1기확정','2기예정','2기확정'];
const TAXJ_VAT_LABEL = { filing:'예정신고', notice:'예정고지', 'notice-excluded':'고지제외', 'not-target':'미대상', target:'대상' };
const TAXJ_REVIEW_SKIP_INCOME = new Set(['근로미제출비과세','중도미제출비과세']);
const TAXJ_REVIEW_SKIP_TAX = new Set(['연말','중도']);
function setTaxjFilingSub(v){ taxjFilingSub = v; renderTaxjFull(); }
function setTaxjFilingMonth(v){ if(v) taxjFilingMonth = v; renderTaxjFull(); }
function setTaxjFilingYear(v){ if(v) taxjFilingYear = String(v); renderTaxjFull(); }
// Tax.J 거래처: id → 거래처, 순서는 Tax.J와 같게(법인 → 개인, 기장대행 → 신고대리 → 그 외, 그다음 등록 순)
function taxjClientIndex(docs){
  const list = ((docs.s__clients || {}).list || []).filter(c => c && c.id);
  const w1 = c => c.entityType === '법인' ? 0 : c.entityType === '개인' ? 1 : 2;
  const w2 = c => c.taxType === '기장대행' ? 0 : c.taxType === '신고대리' ? 1 : 2;
  const sorted = list.map((c, i) => ({ c, i })).sort((a, b) => (w1(a.c) - w1(b.c)) || (w2(a.c) - w2(b.c)) || (a.i - b.i)).map(x => x.c);
  const byId = {}; sorted.forEach((c, i) => { byId[c.id] = Object.assign({ _order: i }, c); });
  return { byId, sorted };
}
function taxjClientName(idx, key){
  const id = String(key).split('@')[0];
  const c = idx.byId[id];
  return (c ? c.name : '(삭제된 거래처)') + (String(key).endsWith('@nextMonth') ? ' <span class="hint" style="margin:0; color:#be123c; font-weight:700;">익월</span>' : '');
}
function taxjOrderKeys(idx, keys){
  return keys.slice().sort((a, b) => { const ca = idx.byId[String(a).split('@')[0]], cb = idx.byId[String(b).split('@')[0]];
    return (ca ? ca._order : 1e9) - (cb ? cb._order : 1e9) || String(a).localeCompare(String(b)); });
}
function taxjMoney(v){ if(v === '' || v == null || isNaN(Number(v))) return '<span style="color:#d4c6cd;">-</span>'; return Number(v).toLocaleString(); }
function taxjMd(v){ return v ? taxjEsc(String(v).slice(5).replace('-', '/')) : '<span style="color:#d4c6cd;">-</span>'; }
// 거래처의 그 달 신고구분(매월/반기): 신고구분 이력에서 그 달 이전 가장 최근 것
function taxjCycleAt(docs, cid, period){
  const hist = ((docs.s__filingCycles || {})[cid] || []).filter(h => h && h.effectiveFrom && h.effectiveFrom <= period).sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
  return hist.length ? hist[hist.length - 1].cycle : '';
}
function taxjYearSelectHtml(years){
  const ys = Array.from(new Set(years.concat([String(new Date().getFullYear())]))).sort().reverse();
  if(!taxjFilingYear || !ys.includes(taxjFilingYear)) taxjFilingYear = String(new Date().getFullYear());
  return `<select onchange="setTaxjFilingYear(this.value)">${ys.map(y => `<option ${y === taxjFilingYear ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
}
function taxjTable(head, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="table-scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function taxjFilingHtml(docs){
  const idx = taxjClientIndex(docs);
  const now = new Date();
  if(!taxjFilingMonth) taxjFilingMonth = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  const subBar = `<div class="cl-subtabs" style="margin-bottom:12px;">${TAXJ_FILING_SUBS.map(([k, l]) => `<button class="cl-subtab ${taxjFilingSub === k ? 'on' : ''}" onclick="setTaxjFilingSub('${k}')">${l}</button>`).join('')}</div>`;
  let ctrl = '', body = '';
  if(taxjFilingSub === 'it'){
    // 원천세 진행: 그 달 신고대상 거래처 × 지급시기(당월/익월)별 단계 날짜
    const p = taxjFilingMonth, tg = docs.s__filingTargets || {}, st = (docs.s__itFilingStatus || {})[p] || {}, ov = docs.s__itOverview || {};

          <td>${li ? '' : taxjEsc(taxjCycleAt(docs, cid, p) || t.cycle || '-')}</td>
          <td><span style="font-weight:700; color:${k === 'sameMonth' ? '#047857' : '#be123c'};">${k === 'sameMonth' ? '당월' : '익월'}</span></td>
          ${TAXJ_IT_STAGES_FULL.map(([f]) => `<td>${taxjMd(v[f])}</td>`).join('')}
          <td>${li ? '' : taxjEsc(((ov[cid] || {}).payKinds || []).join(', '))}</td>
          <td style="text-align:left; white-space:pre-wrap; min-width:120px;">${taxjEsc(v.memo || '')}</td></tr>`);
      });
    });
    const doneN = ids.filter(cid => { const e = st[cid] || {}; return ['sameMonth','nextMonth'].some(k => e[k] && e[k].national && e[k].local); }).length;
    ctrl = `<input type="month" value="${p}" onchange="setTaxjFilingMonth(this.value)"><span class="hint" style="margin:0;">${Number(p.slice(0,4))}년 ${Number(p.slice(5))}월 귀속 · 신고대상 ${ids.length}곳 · 신고 완료 ${doneN}곳</span>`;
    body = taxjTable(['순번','상호명','신고구분','지급'].concat(TAXJ_IT_STAGES_FULL.map(([, l]) => l)).concat(['급여종류','메모']), rows, '이 달에 신고대상·입력된 날짜가 없어요.');
  }else if(taxjFilingSub === 'itReview'){
    // 원천세 검토: 거래처 × 1~12월, 칸마다 총지급액(계산)·소득세(계산). 신고서 값과 다르면 빨강
    const rf = docs.s__reviewFigures || {};
    ctrl = taxjYearSelectHtml(Array.from(new Set(Object.values(rf).flatMap(o => Object.keys(o || {}))))) + '<span class="hint" style="margin:0;">칸마다 위: 총지급액 · 아래: 소득세 (매월 신고 기준으로 신고서 값과 다르면 빨강)</span>';
    const y = taxjFilingYear;
    const keys = taxjOrderKeys(idx, Object.keys(rf).filter(k => (rf[k] || {})[y]));
    const rows = keys.map((k, i) => {
      const yd = rf[k][y] || {};
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, k)}</td>${Array.from({ length:12 }, (_, m) => {
        const d = yd[String(m + 1)];

        const tax = Object.keys(d.tax || {}).reduce((s, g) => s + (TAXJ_REVIEW_SKIP_TAX.has(g) ? 0 : (Number((d.tax[g] || {}).tax) || 0)), 0);

      }).join('')}</tr>`;
    });
    body = taxjTable(['순번','상호명'].concat(Array.from({ length:12 }, (_, m) => `${m + 1}월`)), rows, `${y}년 검토표에 입력된 숫자가 없어요.`);
  }else if(taxjFilingSub === 'itOverview'){
    const ov = docs.s__itOverview || {};
    const ids = taxjOrderKeys(idx, Object.keys(ov));
    const rows = ids.map((cid, i) => { const e = ov[cid] || {};
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, cid)}</td><td>${taxjEsc((e.payKinds || []).join(', '))}</td>
        <td>${taxjEsc(e.reportPayDay || '')}</td><td>${taxjEsc(e.actualPayDay || '')}</td><td>${taxjEsc(e.payComm || '')}</td><td>${taxjEsc(e.payslipVia || '')}</td><td>${taxjEsc(e.billVia || '')}</td>
        <td>${taxjEsc(e.wpNo || '')}</td><td>${taxjEsc(e.wpNoSpecial || '')}</td><td>${e.edi ? '✓' : ''}</td><td style="text-align:left; white-space:pre-wrap;">${taxjEsc(e.note || '')}</td></tr>`; });
    ctrl = `<span class="hint" style="margin:0;">거래처별로 한 번 정해두고 계속 쓰는 원천세 업무 정보 · ${ids.length}곳</span>`;
    body = taxjTable(['순번','상호명','급여종류','신고 지급일','실 급여일','급여소통','급여명세서 전달','납부서 전달','사업장관리번호(일반)','사업장관리번호(특고 등)','EDI','비고'], rows, 'Tax.J 원천세 총괄에 입력된 내용이 없어요.');
  }else if(taxjFilingSub === 'vat'){
    // 부가세: 거래처 × 4기수, 칸마다 신고대상 상태 + 검토표 신고상태·납부세액
    const tg = docs.s__vatFilingTargets || {}, rf = docs.s__vatReviewFigures || {};
    ctrl = taxjYearSelectHtml(Array.from(new Set([tg, rf].flatMap(o => Object.values(o).flatMap(x => Object.keys(x || {})))))) + '<span class="hint" style="margin:0;">칸마다 신고대상 · 신고상태 · 납부세액</span>';
    const y = taxjFilingYear;
    const ids = taxjOrderKeys(idx, Array.from(new Set(Object.keys(tg).filter(c => (tg[c] || {})[y]).concat(Object.keys(rf).filter(c => (rf[c] || {})[y])))));
    const rows = ids.map((cid, i) => {
      const c = idx.byId[cid] || {};
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, cid)}</td><td>${taxjEsc(c.entityType || '')}</td>${TAXJ_VAT_PERIODS.map(per => {
        const e = ((tg[cid] || {})[y] || {})[per] || {};
        const s = per.endsWith('예정') ? (e.status || (e.applicable ? 'filing' : e.expectedNotice ? 'notice' : c.entityType === '개인' ? 'notice' : 'not-target')) : (e.applicable === false ? 'not-target' : 'target');
        const r = ((rf[cid] || {})[y] || {})[per] || {};
        const off = s === 'not-target';
        return `<td style="font-size:12px; line-height:1.5;${off ? ' color:var(--muted);' : ''}"><b>${TAXJ_VAT_LABEL[s] || s}</b>${r.filingStatus ? `<br>${taxjEsc(r.filingStatus)}` : ''}${r.taxPay != null && r.taxPay !== '' ? `<br>${taxjMoney(r.taxPay)}` : ''}${(e.send && (e.send.notice || e.send.bill)) ? `<br><span class="hint" style="margin:0;">발송 ${taxjMd(e.send.notice || e.send.bill)}</span>` : ''}</td>`;
      }).join('')}</tr>`;
    });
    body = taxjTable(['순번','상호명','구분'].concat(TAXJ_VAT_PERIODS), rows, `${y}년 부가세 신고대상·검토 자료가 없어요.`);
  }else if(taxjFilingSub === 'pl'){
    const pl = docs.s__profitLossReports || {};
    ctrl = taxjYearSelectHtml(Array.from(new Set(Object.values(pl).flatMap(o => Object.keys(o || {})))));
    const y = taxjFilingYear;
    const ids = taxjOrderKeys(idx, Object.keys(pl).filter(c => (pl[c] || {})[y]));
    const F = [['revenue','매출액'], ['cogs','매출원가'], ['sga','판관비'], ['otherIncome','영업외수익'], ['otherExpense','영업외비용']];
    const rows = ids.map((cid, i) => { const e = pl[cid][y] || {};
      const profit = ['revenue','otherIncome'].reduce((s, k) => s + (Number(e[k]) || 0), 0) - ['cogs','sga','otherExpense'].reduce((s, k) => s + (Number(e[k]) || 0), 0);
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, cid)}</td><td>${taxjEsc(e.entityKind || '')}</td>${F.map(([k]) => `<td style="text-align:right;">${taxjMoney(e[k])}</td>`).join('')}<td style="text-align:right; font-weight:700;">${profit.toLocaleString()}</td><td style="text-align:left; white-space:pre-wrap;">${taxjEsc(e.memo || '')}</td></tr>`; });
    body = taxjTable(['순번','상호명','세목'].concat(F.map(([, l]) => l)).concat(['당기순이익(계산)','메모']), rows, `${y}년 손익보고서가 없어요.`);
  }else{
    return subBar + TAXJ_FULL_GROUPS[0].keys.map(([k, label]) => taxjSectionHtml(label, docs['s__' + k])).join('');
  }
  return subBar + `<div class="card"><div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">${ctrl}</div>${body}</div>`;
}

// ── [2026.10.08] 홈·Month 달력에 회사(Tax.J) 공휴일·제외일정과 '내 근태'(휴가·재택) 표시(요청: "둘 다 넣고, 내 근태만") ──
// 저장해 둔 Tax.J 자료(taxjFull)에서 읽음: 공용 제외일(s__exclusionDays: 공휴일/회식 등) + 로그인한 회사 계정과 이메일이 같은 직원의
// attendance.leaveUsage(휴가)·remoteEntries(재택). 회사웹에서 근태를 바꾸면 Tax.J 메뉴에서 '새로고침'해야 달력에도 반영됨
function taxjCalMarks(){
  let full = null;
  try{ full = taxjFull; if(!taxjFullRestoreTried) taxjRestoreFull(); }catch(e){ return null; }   // 첫 화면에서 아직 선언 전이면 건너뜀
  if(!full || !full.docs) return null;
  if(taxjCalMarks.cache && taxjCalMarks.cache.at === full.at) return taxjCalMarks.cache.map;
  const docs = full.docs, map = {};
  const add = (d, k, v) => { if(!d) return; const o = map[d] = map[d] || { hol:'', items:[] }; if(k === 'hol') o.hol = o.hol || v; else o.items.push(v); };
  (Array.isArray(docs.s__exclusionDays) ? docs.s__exclusionDays : []).forEach(x => {
    if(!x || !x.date || x.deleted) return;
    if(x.reason === '공휴일') add(x.date, 'hol', x.name || '공휴일');
    else add(x.date, 'item', { cls:'etc', label: x.name || x.reason || '제외일', title: [x.reason, x.name].filter(Boolean).join(' · ') });
  });
  const me = (docs.profiles || []).find(p => p && String(p.email || '').toLowerCase() === String(full.email || '').toLowerCase());
  const att = me ? ((docs['data__' + me.id] || {}).attendance || {}) : {};
  (att.leaveUsage || []).forEach(u => { if(u && u.date && !u.deleted) add(u.date, 'item', { cls:'leave', label: u.type || '휴가', title: [u.type, u.subtype, u.memo].filter(Boolean).join(' · ') }); });
  (att.remoteEntries || []).forEach(r => { if(r && r.date && !r.deleted) add(r.date, 'item', { cls:'remote', label: r.bonus ? '특별재택' : r.half === 'am' ? '오전재택' : r.half === 'pm' ? '오후재택' : '재택', title: [r.bonus ? '특별재택' : r.half ? '반일재택' : '정기재택', r.memo].filter(Boolean).join(' · ') }); });
  taxjCalMarks.cache = { at: full.at, map };
  return map;
}
function taxjCalItemsHtml(mk){
  return mk && mk.items.length ? `<div class="tj-atts">${mk.items.map(i => `<span class="tj-att ${i.cls}" title="${escapeAttr(i.title || i.label)}">${taxjEsc(i.label)}</span>`).join('')}</div>` : '';
}

// [2026.10.16] "등록기기 / 마지막 접속 / 알림 허용 / 출퇴근 알림 / 권한이 다 나오게"(요청) - 칸을 나눠서 보여줌. 최근 출퇴근 알림(7일)은 서버 보고서에 기록이 있을 때만
const TAXJ_NOTIF_CATS = [['notice','공지'], ['approvalNew','결재 요청'], ['approvalDecision','결재 결과'], ['teamSchedule','팀일정']];
function taxjUsageTableHtml(rep){
  const people = ((rep && rep.people) || []).filter(p=> p.status !== '퇴사');
  const notifTxt = { granted:'허용', denied:'차단', default:'안 정함', unsupported:'미지원' };
  const hasClock = people.some(p=> (p.clock||[]).length), hasPrefs = people.some(p=> p.prefs), hasAdmin = people.some(p=> p.admin !== undefined);
  const mute = t=> `<span class="hint" style="margin:0;">${t}</span>`;
  const rows = people.map(p=>{
    const online = (p.presence||[]).filter(x=> x.online);
    const last = Math.max(0, ...(p.presence||[]).map(x=> Math.max(x.at||0, x.lastAt||0)));
    const nowTxt = online.length ? `<b style="color:var(--ok, #16a34a);">접속 중</b><div class="hint" style="margin:0;">${online.map(x=> taxjEsc((x.device||'기기') + (x.screen ? ' · ' + x.screen : ''))).join('<br>')}</div>` : mute(rep && rep.noLive ? '-' : '접속 안 함');
    const lastTxt = online.length ? '지금' : last ? taxjWhen(last) : mute('-');
    const devs = (p.devices||[]).map(d=> `${taxjEsc(d.dev || (d.mob ? '휴대폰' : '기기'))} ${mute('등록 ' + taxjWhen(d.at))}`).join('<br>') || mute('없음');
    const devNotif = (p.devices||[]).length ? (p.devices||[]).map(d=> taxjEsc(notifTxt[d.notif] || '-')).join('<br>') : mute('-');
    const pf = p.prefs || {}, offs = TAXJ_NOTIF_CATS.filter(([k])=> pf[k] === false);
    const cats = !hasPrefs ? '' : offs.length === TAXJ_NOTIF_CATS.length ? mute('모두 끔') : offs.length ? `${TAXJ_NOTIF_CATS.filter(([k])=> pf[k] !== false).map(([,l])=> l).join('·')}<div class="hint" style="margin:0;">끔: ${offs.map(([,l])=> l).join('·')}</div>` : '모두 켬';
    const clk = (p.clock||[]).slice(0,7).map(c=> `${c.date.slice(5).replace('-','/')} ${c.checkIn ? (c.checkIn === 'done' ? '출근✓' : c.checkIn === 'leave' ? '휴가' : '출근알림') : ''}${c.checkIn && c.checkOut ? ' · ' : ''}${c.checkOut ? (c.checkOut === 'done' ? '퇴근✓' : c.checkOut === 'leave' ? '휴가' : '퇴근알림') : ''}`).join('<br>') || '-';
    return `<tr><td style="white-space:nowrap;"><b>${taxjEsc(p.name)}</b>${p.position ? `<div class="hint" style="margin:0;">${taxjEsc(p.position)}</div>` : ''}</td>`
      + (hasAdmin ? `<td style="white-space:nowrap;">${p.admin ? '<b>관리자</b>' : '일반'}</td>` : '')
      + `<td>${nowTxt}</td><td style="white-space:nowrap;">${lastTxt}</td><td style="white-space:nowrap;">${devs}</td><td style="white-space:nowrap;">${devNotif}</td>`
      + (hasPrefs ? `<td>${cats}</td>` : '')
      + `<td style="white-space:nowrap;">${p.clockReminder ? '켬' : mute('끔')}</td>`
      + (hasClock ? `<td style="white-space:nowrap; font-size:12px;">${clk}</td>` : '') + `</tr>`;
  }).join('');
  const heads = ['직원'].concat(hasAdmin ? ['권한'] : [], ['지금','마지막 접속','등록 기기','기기 알림 권한'], hasPrefs ? ['받는 알림'] : [], ['출퇴근 알림'], hasClock ? ['최근 출퇴근 알림(7일)'] : []);
  return `<div class="hint" style="margin-bottom:6px;">${taxjWhen(rep && rep.at)} 기준${rep && rep.noLive ? ' · 지금 접속·마지막 접속은 회사웹 실시간 연결(회사 계정) 중일 때만 보여요' : ''}</div>
    <div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:12.5px;">
      <thead><tr>${heads.map(h=>`<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line, #eee); white-space:nowrap;">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.replace(/<td/g, '<td style="padding:6px 8px; border-bottom:1px solid var(--line, #f1f1f1); vertical-align:top;"').replace(/<td style="padding:6px 8px; border-bottom:1px solid var\(--line, #f1f1f1\); vertical-align:top;" style="/g, '<td style="padding:6px 8px; border-bottom:1px solid var(--line, #f1f1f1); vertical-align:top; ')}</tbody>
    </table></div>`;
}

// 요청 배경(2026.10.08): "업무하면서 필요한 매뉴얼을 정리할 메뉴. 분야(개인·회사·신고 등)를 정해서 하위메뉴로 나눠서".
// 분야는 직접 추가·이름변경·순서변경 가능하고 왼쪽 메뉴의 '매뉴얼' 아래 하위메뉴로 나옴. 화면은 [왼쪽 목록 | 오른쪽 본문].
// 본문은 글로 적되 간단한 표시를 알아봄: '# 제목', '- 목록', '1. 순서', '**굵게**', 주소(https://…)는 링크. 고칠 때마다 이력이 남음
let manualCat = '', manualSel = null, manualSearch = '';
function setManualCat(c){ manualCat = c || ''; manualSel = null; if(activeTab !== 'manuals') switchTab('manuals'); else renderManuals(); }
function manualBodyHtml(t){
  const inline = x => taxjEsc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null;
  const close = () => { if(list){ out.push(`</${list}>`); list = null; } };
  String(t || '').split('\n').forEach(line => {
    let m;
    if((m = /^\s*#{1,3}\s+(.*)$/.exec(line))){ close(); out.push(`<div class="mn-h">${inline(m[1])}</div>`); }
    else if((m = /^\s*[-•·]\s+(.*)$/.exec(line))){ if(list !== 'ul'){ close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))){ if(list !== 'ol'){ close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if(!line.trim()){ close(); out.push('<div class="mn-gap"></div>'); }
    else { close(); out.push(`<div>${inline(line)}</div>`); }
  });
  close();
  return out.join('');
}
function manualFields(x){
  x = x || {};
  const cats = manualCats.length ? manualCats : ['미분류'];
  return [
    { label:'분야', options: cats, value: x.cat || manualCat || cats[0] },
    { label:'제목', value:x.title || '', placeholder:'예: 원천세 반기 신고 순서' },
    { label:'참고 사이트 (한 줄에 하나 · "이름 | 주소" 또는 주소만)', type:'textarea', value:(x.refs || []).map(r => r.name && r.name !== r.url ? `${r.name} | ${r.url}` : r.url).join('\n'), rows:3, placeholder:'홈택스 | hometax.go.kr\nhttps://www.wehago.com' },
    { label:'내용 (# 제목, - 목록, 1. 순서, **굵게** · Enter 줄바꿈, Ctrl+Enter 저장)', type:'textarea', value:x.body || '', rows:16, placeholder:'# 준비물\n- 급여대장\n- 지급명세서\n\n# 순서\n1. 홈택스 로그인\n2. 원천세 신고 메뉴' },
  ];
}
// 참고 사이트 칸: 한 줄에 하나, "이름 | 주소" 또는 주소만
function manualParseRefs(t){
  return String(t || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => {
    const i = x.lastIndexOf('|');
    const name = i >= 0 ? x.slice(0, i).trim() : '', url = (i >= 0 ? x.slice(i + 1) : x).trim();
    return url ? { name: name || url.replace(/^https?:\/\//, '').replace(/\/$/, ''), url } : null;
  }).filter(Boolean);
}
async function manualAdd(){
  const r = await smForm('매뉴얼 추가', manualFields(), { okText:'추가', wide:true });
  if(!r || !(r[1] || '').trim()) return;
  const m = { id: nextManualId++, cat: r[0], title: r[1].trim(), refs: manualParseRefs(r[2]), body: r[3] || '', at: new Date().toISOString(), history: [] };
  manuals.push(m); manualSel = m.id; manualCat = manualCat && manualCat !== m.cat ? m.cat : manualCat;
  renderAll();
}
async function manualEdit(id){
  const m = manuals.find(x => x.id === id);
  if(!m) return;
  const r = await smForm('매뉴얼 수정', manualFields(m), { okText:'저장', icon:'✎', wide:true });
  if(!r || !(r[1] || '').trim()) return;
  const refs = manualParseRefs(r[2]);
  if(r[0] === m.cat && r[1].trim() === m.title && (r[3] || '') === m.body && JSON.stringify(refs) === JSON.stringify(m.refs || [])) return;
  (m.history = m.history || []).unshift({ at: m.at, cat: m.cat, title: m.title, body: m.body, refs: m.refs || [] });
  if(m.history.length > 20) m.history.length = 20;   // 예전 내용은 최근 20번까지만 보관
  Object.assign(m, { cat: r[0], title: r[1].trim(), refs, body: r[3] || '', at: new Date().toISOString() });
  renderAll();
}
async function manualDelete(id){
  const m = manuals.find(x => x.id === id);
  if(!m || !(await smConfirm('이 매뉴얼을 삭제할까요?', m.title, { tone:'danger', icon:'!', okText:'삭제' }))) return;
  manuals = manuals.filter(x => x.id !== id); if(manualSel === id) manualSel = null;
  renderAll();
  (m.files || []).forEach(f => smDriveTrash(f.id));   // [2026.10.22] 첨부도 드라이브 휴지통으로(서식·링크와 같게)
}
// [2026.10.22] 매뉴얼 첨부(요청) - 링크 첨부와 같은 방식. 올리는 동안 시트 다시 읽기 멈추고, 다 올린 뒤 지금 목록의 항목에 붙임
let manualUpTarget = null;
function manualPickFiles(id){
  if(!smUploadReady()) return;
  manualUpTarget = id; smFileInput('smManualFileInput', manualUploadFiles);
}
async function manualUploadFiles(input){
  const mid = manualUpTarget;
  let x = manuals.find(m => m.id === mid);
  const files = Array.from((input && input.files) || []);
  if(!x || !files.length) return;
  const big = files.find(f => f.size > 50 * 1024 * 1024);
  if(big){ smAlert('파일이 너무 커요', `${big.name}: 50MB 이하만 올릴 수 있어요.`); return; }
  x._uploading = files.length; renderManuals(); smToast(`${files.length}개 파일을 드라이브에 올리고 있어요…`);
  window.smUploadingN = (window.smUploadingN || 0) + 1;
  try{
    const up = [];
    for(const f of files) up.push(await smDriveUpload(f));
    { const cur = manuals.find(m => m.id === mid); if(cur && cur !== x){ delete x._uploading; x = cur; } }
    (x.files = x.files || []).push(...up);
    smToast('첨부했어요.');
  }catch(e){ console.error(e); smAlert('첨부하지 못했어요', String(e && e.message || e), { tone:'danger' }); }
  finally{ window.smUploadingN = Math.max(0, (window.smUploadingN || 1) - 1); delete x._uploading; { const cur = manuals.find(m => m.id === mid); if(cur) delete cur._uploading; } renderAll(); }
}
async function manualRemoveFile(id, fid){
  const x = manuals.find(m => m.id === id);
  const f = x && (x.files || []).find(a => a.id === fid);
  if(!f || !(await smConfirm('첨부파일을 뺄까요?', `${f.name}\n드라이브에서는 휴지통으로 옮겨져요(30일 안에 되살릴 수 있어요).`, { tone:'danger', icon:'!', okText:'빼기' }))) return;
  x.files = x.files.filter(a => a.id !== fid);
  renderAll();
  smDriveTrash(fid);
}
function manualHistory(id){
  const m = manuals.find(x => x.id === id);
  if(!m) return;
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const h = m.history || [];
  smDialog({ title:`${m.title} · 예전 내용`, icon:'⟲', cancelText:null, okText:'닫기', wide:true,
    html: h.length ? h.map(x => `<details style="text-align:left; margin:6px 0;"><summary style="cursor:pointer; font-weight:700;">${fmt(x.at)} 까지의 내용 <span class="hint" style="margin:0;">${taxjEsc(x.cat)} · ${taxjEsc(x.title)}</span></summary><div class="mn-body" style="margin-top:6px;">${manualBodyHtml(x.body)}</div></details>`).join('')
      : '<div class="hint">아직 고친 적이 없어요.</div>' });
}
// 분야 관리: 한 줄에 하나씩. 줄 수가 같으면 같은 자리끼리 이름을 바꾼 것으로 보고, 없어진 분야의 매뉴얼은 '미분류'로 옮김
// [2026.10.16] 줄바꿈 입력 대신 입력칸+추가, 목록에서 이름 바꾸기·순서·삭제 창으로 바꿈(요청). 이름 바꾸면 그 분야 매뉴얼도 같이 바뀜
async function manualEditCats(){
  const r = await smCatEditor('분야 관리', manualCats, { countOf: c => manuals.filter(m => m.cat === c).length });
  if(!r) return;
  if(!r.length){ smAlert('분야를 하나 이상 남겨 주세요'); return; }
  const next = r.map(x => x.name);
  const ren = Object.create(null); r.forEach(x => { if(x.orig != null && x.orig !== x.name) ren[x.orig] = x.name; });
  const orphan = manuals.filter(m => !(m.cat in ren) && !next.includes(m.cat));
  if(orphan.length){
    if(!(await smConfirm('없어지는 분야가 있어요', `매뉴얼 ${orphan.length}개는 '미분류'로 옮겨져요.`, { okText:'저장' }))) return;
  }
  manuals.forEach(m => { if(m.cat in ren) m.cat = ren[m.cat]; });
  if(manualCat in ren) manualCat = ren[manualCat];
  if(orphan.length){
    orphan.forEach(m => { m.cat = '미분류'; });
    if(!next.includes('미분류')) next.push('미분류');
  }
  if(manualCat && !next.includes(manualCat)) manualCat = '';
  manualCats = next;
  renderAll();
  renderNav();   // 왼쪽 메뉴의 분야 하위메뉴도 바로 바꿈
}
function manualOnSearch(v){ manualSearch = v; renderManuals(); const el = document.getElementById('manualSearch'); if(el){ el.focus(); el.setSelectionRange(v.length, v.length); } }

  const qRaw = manualSearch.trim();
  if(qRaw) smFileContentSearch(qRaw, () => { if(manualSearch.trim() === qRaw && activeTab === 'manuals' && document.activeElement?.id !== 'manualSearch') renderManuals(); else if(manualSearch.trim() === qRaw && activeTab === 'manuals') manualOnSearch(manualSearch); });
  const hits = smFileHits[qRaw] instanceof Set ? smFileHits[qRaw] : null;
  const inFile = m => !!hits && (m.files || []).some(f => hits.has(f.id));
  const textHit = m => [m.title, m.body, m.cat, ...(m.refs || []).map(r => r.name + ' ' + r.url), ...(m.files || []).map(f => f.name)].some(v => String(v || '').toLowerCase().includes(q));
  const list = manuals.filter(m => (!manualCat || m.cat === manualCat) && (!q || textHit(m) || inFile(m)))
    .sort((a, b) => manualCats.indexOf(a.cat) - manualCats.indexOf(b.cat) || String(a.title).localeCompare(String(b.title), 'ko'));
  if(!list.some(m => m.id === manualSel)) manualSel = list.length ? list[0].id : null;
  const sel = manuals.find(m => m.id === manualSel);
  const cnt = c => manuals.filter(m => !c || m.cat === c).length;
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
  el.innerHTML = `
    <div class="card">
      <div class="cl-head">
        <div><!-- [2026.10.14] 왼쪽 하위메뉴와 같은 가로 메뉴는 없앰(요청) --></div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="btn ghost xs" onclick="manualEditCats()">분야 관리</button>

      <div class="mn-layout">

          <input type="text" id="manualSearch" placeholder="제목·내용 검색" value="${escapeAttr(manualSearch)}" oninput="manualOnSearch(this.value)">
          ${list.length ? list.map(m => `<button class="mn-item ${m.id === manualSel ? 'on' : ''}" onclick="manualSel=${m.id}; renderManuals();">
              <span class="mn-item-t">${taxjEsc(m.title)}</span><span class="mn-item-s">${manualCat ? '' : taxjEsc(m.cat) + ' · '}${when(m.at)}${q && !textHit(m) && inFile(m) ? ' · 첨부 내용에 있음' : ''}</span></button>`).join('')
            : `<div class="empty">${manuals.length ? (q ? '검색과 맞는 매뉴얼이 없어요.' : '이 분야에는 아직 매뉴얼이 없어요.') : "아직 매뉴얼이 없어요. '매뉴얼 추가'로 정리해 보세요."}</div>`}
          ${q ? (() => { const st = smFileHits[qRaw];
              const noRead = manuals.filter(m => !manualCat || m.cat === manualCat).flatMap(m => m.files || []).filter(f => !smFileSearchable(f.name)).length;
              const msg = [!googleAccessToken ? 'Google에 연결하면 첨부파일 안 내용도 같이 찾아요.' : st === 'pending' ? '첨부파일 안 내용도 찾는 중…' : st === 'error' ? '첨부파일 안 내용은 지금 찾지 못했어요.' : '',
                noRead ? `한글·이미지 등 첨부 ${noRead}개는 내용을 읽을 수 없어서 파일명으로만 찾아요.` : ''].filter(Boolean);
              return msg.length ? `<div class="hint" style="margin:6px 2px 0; font-size:12px;">${msg.map(taxjEsc).join('<br>')}</div>` : ''; })() : ''}
        </div>
        <div class="mn-view">
          ${sel ? `
            <div class="mn-view-head">
              <div><div class="mn-view-cat">${taxjEsc(sel.cat)}</div><div class="mn-view-title">${taxjEsc(sel.title)}</div><div class="hint" style="margin:2px 0 0;">마지막 수정 ${when(sel.at)}</div></div>
              <span class="row-actions" style="display:inline-flex; gap:2px;">

                <button class="icon-btn" onclick="manualHistory(${sel.id})" title="이력" aria-label="이력">${ICON_HISTORY}</button>
                <button class="icon-btn danger" onclick="manualDelete(${sel.id})" title="삭제" aria-label="삭제">${ICON_TRASH}</button>
              </span>
            </div>
            ${(sel.refs || []).length ? `<div class="mn-refs"><span class="mn-refs-l">참고 사이트</span>${sel.refs.map(r => `<a class="mn-ref" href="${escapeAttr(linkHref(r.url))}" target="_blank" rel="noopener" title="${escapeAttr(r.url)}">${taxjEsc(r.name)} ↗</a>`).join('')}</div>` : ''}
            <!-- [2026.10.22] "매뉴얼에 첨부파일 올리고 싶어"(요청) - 참고 사이트 줄과 같은 모양의 첨부 줄. 링크·서식처럼 내 드라이브 'SM_첨부파일'에 올림(여러 개·끌어다 놓기 가능) -->
            <div class="mn-refs att-list" ondragover="if(Array.from(event.dataTransfer.types||[]).includes('Files')) event.preventDefault();" ondrop="manualUpTarget=${sel.id}; smDropFiles(event, manualUploadFiles);"><span class="mn-refs-l">첨부</span>${smFilesHtml(sel.files, f => `manualRemoveFile(${sel.id}, '${f.id}')`)}${sel._uploading ? `<span class="hint" style="margin:0;">올리는 중… (${sel._uploading})</span>` : `<button class="att-add" onclick="manualPickFiles(${sel.id})" title="파일 첨부 (여러 개 선택하거나 여기로 끌어다 놓기)">＋ 파일</button>`}</div>
            <div class="mn-body">${sel.body.trim() ? manualBodyHtml(sel.body) : '<div class="hint">내용이 비어 있어요. 연필 아이콘으로 적어 주세요.</div>'}</div>`

        </div>
      </div>
    </div>`;
}

// ===== 서식 · 법령 =====
// 요청 배경(2026.10.16): "서식 = 내가 쓰는 양식들을 올려서 관리, 업데이트될 수 있어 기존·업데이트 이력 모두 관리 / 법령 = 세법 법령·공문을 첨부해서 올림. 분야관리는 꼭 필요"
// 두 메뉴는 같은 짜임: 분야(관리 창으로 추가·이름 바꾸기·순서·삭제) + 목록. 파일은 링크 첨부와 같이 내 Google 드라이브 'SM_첨부파일' 폴더에 올리고 {id,name,url}만 저장.
// 항목마다 versions[0]이 최신. '새 버전 올리기'(서식) / '개정본 올리기'(법령)를 누르면 파일을 고른 뒤 변경 내용을 적고 새 버전으로 쌓임. 예전 버전 파일은 이력에서 그대로 열 수 있음
const LIB = {
  forms: { sel:'', name:'서식', unit:'서식', verBtn:'새 버전 올리기', fields:[['title','서식명','예: 법인세 신고 체크리스트'], ['memo','메모 (선택)','', 'textarea']] },
  laws:  { sel:'', name:'법령', unit:'자료', verBtn:'개정본 올리기', kinds:['법령','시행령·규칙','예규·해석','공문','기타'],
           fields:[['kind','구분'], ['title','제목','예: 법인세법 시행령 제40조'], ['docDate','시행일·문서일자','예: 2026-01-01'], ['docNo','문서번호 (선택)','예: 기획재정부 법인세제과-123'], ['url','링크 (선택)','예: law.go.kr/...'], ['memo','메모 (선택)','', 'textarea']] },
};
const libItems = k => k === 'forms' ? forms : laws;
const libSetItems = (k, v) => { if(k === 'forms') forms = v; else laws = v; };
const libCatsRaw = k => (k === 'forms' ? formCats : lawCats) || [];
const libSetCats = (k, v) => { if(k === 'forms') formCats = v; else lawCats = v; };
const libNextId = k => k === 'forms' ? nextFormId++ : nextLawId++;
function libCatList(k){
  const cats = libCatsRaw(k).filter(c => c && c !== '기타');
  const extra = [...new Set(libItems(k).map(x => x.cat || '기타'))].filter(g => !cats.includes(g)).sort((a, b) => (a === '기타') - (b === '기타') || a.localeCompare(b, 'ko'));
  return cats.concat(extra);
}
function setLibCat(k, c){ LIB[k].sel = c || ''; if(activeTab !== k) switchTab(k); else renderLib(k); }
function libNow(){ const d = new Date(); return `${todayStr()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
let libSearch = { forms:'', laws:'' };
function libOnSearch(k, v){ libSearch[k] = v; renderLib(k); const el = document.getElementById(k + 'Search'); if(el){ el.focus(); el.setSelectionRange(v.length, v.length); } }
function libFormFields(k, x){
  x = x || {};
  const catOpts = [...new Set([...libCatList(k), '기타'])].concat(['+ 새 분야']);
  const out = [];
  LIB[k].fields.forEach(([f, label, ph, type]) => {
    if(f === 'kind') out.push({ label, options: LIB[k].kinds, value: x.kind || LIB[k].kinds[0] });
    else out.push(type === 'textarea' ? { label, type:'textarea', rows:2, value: x[f] || '', placeholder: ph || '' } : { label, value: x[f] || '', placeholder: ph || '' });
    if(f === 'title') out.push({ label:'분야', options: catOpts, value: x.cat || LIB[k].sel || libCatList(k)[0] || '기타' });
  });
  return out;
}
function libReadForm(k, r){
  const o = {}; let i = 0;
  LIB[k].fields.forEach(([f]) => { o[f] = String(r[i++] || '').trim(); if(f === 'title') o.cat = r[i++]; });
  return o;

async function libPickCat(k, g){

async function libAdd(k){

async function libEdit(k, id){

async function libDelete(k, id){

  if(!(await smConfirm(`'${x.title}'을(를) 삭제할까요?`, files.length ? `모든 버전의 첨부파일 ${files.length}개도 드라이브 휴지통으로 옮겨져요(30일 안에 되살릴 수 있어요).` : '', { tone:'danger', icon:'!', okText:'삭제' }))) return;

async function libEditCats(k){
  const cur = libCatList(k).filter(g => g !== '기타');
  const r = await smCatEditor(`${LIB[k].name} 분야 관리`, cur, { countOf: g => libItems(k).filter(x => (x.cat || '기타') === g).length });
  if(!r) return;
  const next = r.map(x => x.name).filter(x => x !== '기타');
  const ren = Object.create(null); r.forEach(x => { if(x.orig != null && x.orig !== x.name) ren[x.orig] = x.name === '기타' ? '' : x.name; });
  const orphan = libItems(k).filter(x => x.cat && !(x.cat in ren) && !next.includes(x.cat));
  if(orphan.length && !(await smConfirm('없어지는 분야가 있어요', `${LIB[k].unit} ${orphan.length}개는 '기타'로 옮겨져요.`, { okText:'저장' }))) return;
  libItems(k).forEach(x => { if(x.cat && x.cat in ren) x.cat = ren[x.cat]; });
  orphan.forEach(x => { x.cat = ''; });
  if(LIB[k].sel in ren) LIB[k].sel = ren[LIB[k].sel];
  libSetCats(k, next);
  if(LIB[k].sel && !libCatList(k).includes(LIB[k].sel)) LIB[k].sel = '';

}
// 파일 고르기: mode 'add' = 지금 버전에 파일 더하기, 'ver' = 새 버전으로 올리기
let libUpTarget = null;
function libPick(k, id, mode){
  if(!smUploadReady()) return;

async function libUpload(input){
  const t = libUpTarget; const files = Array.from((input && input.files) || []);
  let x = t && libItems(t.k).find(i => i.id === t.id);
  if(!x || !files.length) return;
  const big = files.find(f => f.size > 50 * 1024 * 1024);
  if(big){ smAlert('파일이 너무 커요', `${big.name}: 50MB 이하만 올릴 수 있어요.`); return; }
  let note = '';
  if(t.mode === 'ver'){
    const r = await smForm(`${LIB[t.k].verBtn}`, [{ label:`변경 내용 (선택) · 파일 ${files.length}개: ${files.map(f => f.name).join(', ')}`, type:'textarea', rows:2, placeholder: t.k === 'forms' ? '예: 2026년 개정 서식 반영' : '예: 2026.2.28 개정' }], { okText:'올리기', icon:'↑' });
    if(!r) return;
    note = r[0].trim();
  }
  x._uploading = files.length; renderLib(t.k);
  // [2026.10.21] "서식 파일이 '올리는 중'만 뜨고 안 올라감"(요청) - 파일 고르는 창에서 돌아오면(창 포커스) 시트를 다시 읽어 서식 목록이 새 것으로 바뀌는데,
  //   올린 파일은 바뀌기 전의 옛 항목(x)에 붙여서 화면·저장에서 사라졌음 → 올리는 동안 다시 읽기를 멈추고, 다 올린 뒤 지금 목록에서 항목을 다시 찾아 붙임
  window.smUploadingN = (window.smUploadingN || 0) + 1;
  try{
    const up = [];
    for(const f of files) up.push(await smDriveUpload(f));
    { const cur = libItems(t.k).find(i => i.id === t.id); if(cur && cur !== x){ delete x._uploading; x = cur; } }
    x.versions = x.versions || [];
    if(t.mode === 'ver' || !x.versions.length){
      const v = (x.versions[0] ? x.versions[0].v : 0) + 1;
      x.versions.unshift({ v, at: libNow(), note: note || (v === 1 ? '처음 등록' : ''), files: up });
    }else (x.versions[0].files = x.versions[0].files || []).push(...up);
    x.at = todayStr();
  }catch(e){ console.error(e); smAlert('올리지 못했어요', String(e && e.message || e), { tone:'danger' }); }
  finally{ window.smUploadingN = Math.max(0, (window.smUploadingN || 1) - 1); delete x._uploading; { const cur = libItems(t.k).find(i => i.id === t.id); if(cur) delete cur._uploading; } renderAll(); }
}

.sm-pv-pn{flex:1;min-width:30px;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.sm-pv-z{font-size:12px;font-weight:700;color:var(--pv-muted);min-width:40px;text-align:center;flex:none}
.sm-pv-sc{flex:1;min-height:0;overflow:auto;position:relative}
.sm-pv-sc.hand{cursor:grab;user-select:none}.sm-pv-sc.hand.drag{cursor:grabbing}
.sm-pv-sc.hand .textLayer{pointer-events:none}
.sm-pv-pages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;width:max-content;min-width:100%;box-sizing:border-box}
.sm-pv-page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sm-pv-page canvas{display:block}
.sm-pv-page .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;opacity:1;text-size-adjust:none;forced-color-adjust:none}
.sm-pv-page .textLayer span,.sm-pv-page .textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.sm-pv-page .textLayer ::selection{background:rgba(236,123,166,.35)}
.sm-pv-img{display:block;max-width:none;margin:12px auto;-webkit-user-drag:none}
.sm-pv-text{margin:0;padding:14px 16px;background:#fff;white-space:pre-wrap;word-break:break-all;min-height:100%;box-sizing:border-box;font-size:13px}
.sm-pv-frame{width:100%;height:100%;border:0;background:#fff;display:block}
.sm-pv-msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13.5px;color:var(--pv-muted);line-height:1.6;padding:20px;box-sizing:border-box;word-break:keep-all}
.sm-pv-msg b{font-size:15px;color:var(--pv-text);margin-bottom:6px}
.sm-pv-menu{position:absolute;top:36px;right:0;z-index:5;background:#fff;border:1px solid var(--pv-border);border-radius:12px;box-shadow:0 10px 24px -8px rgba(33,31,61,.25);padding:6px;max-height:320px;overflow:auto;min-width:240px;max-width:380px}
.sm-pv-menu .h{font-size:11.5px;font-weight:700;color:var(--pv-muted);padding:6px 10px 4px}
.sm-pv-menu button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13px;border:none;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--pv-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-pv-menu button:hover{background:var(--pv-soft);color:var(--pv-pri-d)}
.sm-pv-menu .e{font-size:12.5px;color:var(--pv-muted);padding:7px 10px}
body.sm-pv-win{margin:0;height:100vh;padding:14px;box-sizing:border-box;background:#fff;display:flex}

function smPvOpen(files){

  w.minimize = () => { w.min = true; box.style.display = 'none'; smPvTray(); };

    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };

}

// ===== 계정: 개인 아이디·비밀번호 보관함 =====
// 요청 배경(2026.10.06): "내 개인 아이디·비번을 관리할 메뉴(To do 아래 '계정')". 데이터가 Google 시트·이 기기에도 저장되므로
// 평문으로 두지 않고, 보관함 비밀번호(이 기기에도 저장 안 함)로 만든 키로 목록 전체를 AES-GCM 암호화해서 저장함.
// 잠금 해제한 동안에만 메모리에 풀어 두고, 새로고침·잠그기·2시간 동안 손대지 않으면 다시 잠김. 보관함 비밀번호를 잊으면 복구할 수 없음.
const ACC_IDLE_MS = 2 * 60 * 60 * 1000;   // 요청 배경(2026.10.08): 10분은 너무 짧다 → 2시간
function accB64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }

async function accDeriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);   // [2026.10.16] 이 기기에 기억해 두려고 내보낼 수 있게
}
async function accEncryptAndStore(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify({ items: accountItems, nextId: accountNextId, cats: accountCats }));
  const data = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, accountKey, plain);
  accountVault = { v:1, salt: accB64(accountSalt), iv: accB64(iv), data: accB64(data) };
  accountOpenedData = accountVault.data;
}
// [2026.10.16] "잠그기 기능 없는 게 나을 것 같아, 불편해"(요청) - 잠그기 버튼·2시간 자동 잠금을 없애고,
// 이 기기에서 보관함 비밀번호를 한 번 입력하면 키를 이 기기에 기억해 다음부터 바로 열림(Google 시트에는 계속 암호화된 채로 저장).
// 새 기기에서는 처음 한 번만 보관함 비밀번호를 입력
const ACC_KEY_STORE = 'sm_acc_key';
function accTouch(){}
async function accRememberKey(key, salt){
  try{ const raw = await crypto.subtle.exportKey('raw', key); localStorage.setItem(ACC_KEY_STORE, JSON.stringify({ salt: accB64(salt), k: accB64(raw) })); }catch(e){ console.warn('보관함 키 기억 실패', e); }
}
function accApplyPlain(o){
  accountItems = Array.isArray(o.items) ? o.items : [];
  accountNextId = o.nextId || (accountItems.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
  accountCats = Array.isArray(o.cats) ? o.cats : [];
}
// 기억해 둔 키(또는 지금 키)로 보관함을 풂. 열리면 true
async function accAutoOpen(){
  if(!accountVault) return false;
  let key = null, salt = null;
  if(accountKey && accountSalt && accB64(accountSalt) === accountVault.salt){ key = accountKey; salt = accountSalt; }
  else{
    let st = null; try{ st = JSON.parse(localStorage.getItem(ACC_KEY_STORE) || 'null'); }catch(e){}
    if(!st || st.salt !== accountVault.salt) return false;
    try{ key = await crypto.subtle.importKey('raw', accUnB64(st.k), { name:'AES-GCM' }, true, ['encrypt','decrypt']); salt = accUnB64(st.salt); }catch(e){ return false; }
  }
  try{
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: accUnB64(accountVault.iv) }, key, accUnB64(accountVault.data));
    accApplyPlain(JSON.parse(new TextDecoder().decode(plain)));
    accountKey = key; accountSalt = salt; accountOpenedData = accountVault.data;
    return true;
  }catch(e){ return false; }
}
function accLock(silent){
  accountKey = null; accountSalt = null; accountItems = null; accountShown.clear();

}

async function accCreateVault(){
  const p1 = (document.getElementById('accNewPw') || {}).value || '';
  const p2 = (document.getElementById('accNewPw2') || {}).value || '';
  if(p1.length < 6){ smAlert('6자 이상으로 정해 주세요', '보관함 비밀번호는 6자 이상이어야 해요.'); return; }
  if(p1 !== p2){ smAlert('두 비밀번호가 달라요', '한 번 더 입력한 비밀번호가 같은지 확인해 주세요.'); return; }
  accountSalt = crypto.getRandomValues(new Uint8Array(16));

async function accUnlock(){
  const inp = document.getElementById('accPw');
  const pw = inp ? inp.value : '';

  try{
    const salt = accUnB64(accountVault.salt);
    const key = await accDeriveKey(pw, salt);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: accUnB64(accountVault.iv) }, key, accUnB64(accountVault.data));
    accApplyPlain(JSON.parse(new TextDecoder().decode(plain)));

    accRememberKey(key, salt);
    renderAccounts();
  }catch(e){
    if(inp){ inp.value = ''; inp.focus(); }
    smAlert('비밀번호가 맞지 않아요', '보관함 비밀번호를 다시 입력해 주세요.', { tone:'danger' });

// [2026.10.23] "개인웹도 새로 배포되면 새로고침하라고 알림"(요청) - 열 때 이 파일의 지문(ETag·수정시각)을 기억했다가, 5분마다·화면으로 돌아올 때 다시 확인해서
//   바뀌었으면 화면 위에 "새 버전이 올라왔어요" 안내를 띄움(새로고침 / 나중에 - 나중에를 누르면 30분 뒤 다시)
(function(){
  if(location.protocol !== 'https:') return;
  let base = null, shown = false, snoozeUntil = 0;
  const sig = async ()=>{ const r = await fetch(location.pathname + '?_v=' + Date.now(), { method:'HEAD', cache:'no-store' }); if(!r.ok) return null; return r.headers.get('etag') || r.headers.get('last-modified') || null; };
  function banner(){
    if(shown || Date.now() < snoozeUntil) return; shown = true;
    const b = document.createElement('div');
    // [2026.10.23] "새로고침 안내는 왼쪽 위 빈자리에"(요청) - 머리줄(header) 왼쪽 빈 칸 안에 넣음(없으면 화면 왼쪽 위 모서리)
    const slot = document.querySelector('header > span:first-child');
    b.style.cssText = (slot ? 'position:relative; width:max-content;' : 'position:fixed; top:14px; left:16px; z-index:99999;') + ' display:inline-flex; align-items:center; gap:10px; background:var(--primary); color:#fff; border-radius:999px; padding:7px 10px 7px 16px; font-size:13px; font-weight:700; box-shadow:var(--shadow-md); white-space:nowrap;';
    b.innerHTML = '<span>새 버전이 올라왔어요</span><button type="button" data-a="go" style="border:none; border-radius:999px; padding:4px 12px; font-size:12px; font-weight:800; background:#fff; color:var(--primary); cursor:pointer;">새로고침</button><button type="button" data-a="later" style="border:none; background:transparent; color:#fff; opacity:.85; font-size:12px; font-weight:700; cursor:pointer;">나중에</button>';
    b.querySelector('[data-a="go"]').onclick = ()=> location.reload();
    b.querySelector('[data-a="later"]').onclick = ()=>{ b.remove(); shown = false; snoozeUntil = Date.now() + 30*60*1000; };
    (slot || document.body).appendChild(b);
  }
  async function check(){
    try{ const v = await sig(); if(!v) return; if(base === null){ base = v; return; } if(v !== base) banner(); }catch(e){}
  }
  check();
  setInterval(check, 5*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') check(); });
