// ===== 계정: 개인 아이디·비밀번호 보관함 =====
// 요청 배경(2026.10.06): "내 개인 아이디·비번을 관리할 메뉴(To do 아래 '계정')". 데이터가 Google 시트·이 기기에도 저장되므로
// 평문으로 두지 않고, 보관함 비밀번호(이 기기에도 저장 안 함)로 만든 키로 목록 전체를 AES-GCM 암호화해서 저장함.
// 잠금 해제한 동안에만 메모리에 풀어 두고, 새로고침·잠그기·2시간 동안 손대지 않으면 다시 잠김. 보관함 비밀번호를 잊으면 복구할 수 없음.
const ACC_IDLE_MS = 2 * 60 * 60 * 1000;   // 요청 배경(2026.10.08): 10분은 너무 짧다 → 2시간
function accB64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function accUnB64(str){ const b = atob(str); const a = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function accDeriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function accEncryptAndStore(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify({ items: accountItems, nextId: accountNextId }));
  const data = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, accountKey, plain);
  accountVault = { v:1, salt: accB64(accountSalt), iv: accB64(iv), data: accB64(data) };
}
function accTouch(){
  clearTimeout(accountIdleTimer);
  if(accountKey) accountIdleTimer = setTimeout(() => { accLock(); }, ACC_IDLE_MS);
}
function accLock(silent){
  accountKey = null; accountSalt = null; accountItems = null; accountShown.clear();
  clearTimeout(accountIdleTimer);
  if(!silent) renderAccounts();
}
async function accSave(){
  await accEncryptAndStore();
  accTouch();
  renderAccounts();
  scheduleGoogleSave();
}
async function accCreateVault(){
  const p1 = (document.getElementById('accNewPw') || {}).value || '';
  const p2 = (document.getElementById('accNewPw2') || {}).value || '';
  if(p1.length < 6){ smAlert('6자 이상으로 정해 주세요', '보관함 비밀번호는 6자 이상이어야 해요.'); return; }
  if(p1 !== p2){ smAlert('두 비밀번호가 달라요', '한 번 더 입력한 비밀번호가 같은지 확인해 주세요.'); return; }
  accountSalt = crypto.getRandomValues(new Uint8Array(16));
  accountKey = await accDeriveKey(p1, accountSalt);
  accountItems = []; accountNextId = 1;
  await accSave();
}
async function accUnlock(){
  const inp = document.getElementById('accPw');
  const pw = inp ? inp.value : '';
  if(!pw || !accountVault) return;
  try{
    const salt = accUnB64(accountVault.salt);
    const key = await accDeriveKey(pw, salt);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: accUnB64(accountVault.iv) }, key, accUnB64(accountVault.data));
    const o = JSON.parse(new TextDecoder().decode(plain));
    accountKey = key; accountSalt = salt;
    accountItems = Array.isArray(o.items) ? o.items : [];
    accountNextId = o.nextId || (accountItems.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
    accTouch();
    renderAccounts();
  }catch(e){
    if(inp){ inp.value = ''; inp.focus(); }
    smAlert('비밀번호가 맞지 않아요', '보관함 비밀번호를 다시 입력해 주세요.', { tone:'danger' });
  }
}
async function accChangeMaster(){
  const r = await smForm('보관함 비밀번호 바꾸기', [
    { label:'새 비밀번호 (6자 이상)', type:'password', value:'' },
    { label:'새 비밀번호 확인', type:'password', value:'' },
  ], { okText:'바꾸기', icon:'✎' });
  if(!r) return;
  if(r[0].length < 6){ smAlert('6자 이상으로 정해 주세요', '보관함 비밀번호는 6자 이상이어야 해요.'); return; }
  if(r[0] !== r[1]){ smAlert('두 비밀번호가 달라요', '한 번 더 입력한 비밀번호가 같은지 확인해 주세요.'); return; }
  accountSalt = crypto.getRandomValues(new Uint8Array(16));
  accountKey = await accDeriveKey(r[0], accountSalt);
  await accSave();
  smAlert('바꿨어요', '다음부터는 새 비밀번호로 열어 주세요.', { icon:'✓' });
}
function accFields(x){
  x = x || {};
  return [
    { label:'사이트·서비스', value:x.site || '', placeholder:'예: 홈택스' },
    { label:'주소 (선택)', value:x.url || '', placeholder:'예: hometax.go.kr' },
    { label:'아이디', value:x.user || '' },
    { label:'비밀번호', value:x.pw || '' },
    { label:'메모 (선택)', type:'textarea', rows:2, value:x.memo || '', placeholder:'예: 공인인증서 위치, 보안질문 힌트' },
  ];
}
async function accAdd(){
  if(!accountItems) return;
  accTouch();
  const r = await smForm('계정 추가', accFields(), { okText:'추가', icon:'+', wide:true });
  if(!r) return;
  if(!r[0].trim() && !r[2].trim()){ smAlert('사이트나 아이디를 입력해 주세요', ''); return; }
  accountItems.push({ id: accountNextId++, site:r[0].trim(), url:r[1].trim(), user:r[2].trim(), pw:r[3], memo:r[4].trim(), at: todayStr() });
  await accSave();
}
async function accEdit(id){
  const x = (accountItems || []).find(a => a.id === id);
  if(!x) return;
  accTouch();
  const r = await smForm('계정 수정', accFields(x), { okText:'저장', icon:'✎', wide:true });
  if(!r) return;
  Object.assign(x, { site:r[0].trim(), url:r[1].trim(), user:r[2].trim(), pw:r[3], memo:r[4].trim(), at: todayStr() });
  await accSave();
}
async function accDelete(id){
  const x = (accountItems || []).find(a => a.id === id);
  if(!x) return;
  if(!(await smConfirm(`'${x.site || x.user}' 계정을 삭제할까요?`, '보관함에서 지우면 휴지통에 남지 않고 바로 사라져요.', { okText:'삭제', tone:'danger' }))) return;
  accountItems = accountItems.filter(a => a.id !== id);
  await accSave();
}
function accToggle(id){ accountShown.has(id) ? accountShown.delete(id) : accountShown.add(id); accTouch(); renderAccounts(); }
async function accCopy(id, field, btn){
  const x = (accountItems || []).find(a => a.id === id);
  if(!x) return;
  accTouch();
  try{
    await navigator.clipboard.writeText(x[field] || '');
    if(btn){ const t = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = t; }, 1200); }
  }catch(e){ smAlert('복사하지 못했어요', '브라우저가 클립보드 사용을 막았어요.'); }
}
function accOnSearch(v){ accountSearch = v; accTouch(); renderAccounts(); const s = document.getElementById('accSearch'); if(s){ s.focus(); s.setSelectionRange(v.length, v.length); } }
// 요청 배경(2026.10.06): "회사앱(Tax.J) 계정정보도 가져오기 - 엑셀로". Tax.J 엑셀 일괄 다운로드의 '회사정보' 시트
// (구분·대상·항목명·유형·ID/내용·PW·메모·암호화 여부)를 읽어 보관함에 '회사(Tax.J)' 항목으로 넣음. 다시 가져오면 회사 항목만 새로 바뀌고 내 개인 항목은 그대로.
// Tax.J에서 잠금 해제 안 한 채 받은 파일은 값이 "🔒(잠금 상태)"라서 비워 두고 안내함
async function accImportTaxjExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !accountItems) return;
  accTouch();
  try{
    if(typeof XLSX === 'undefined'){
      await new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
    }
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    let rows = null;
    for(const n of wb.SheetNames){
      const r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:false, defval:'' });
      const h = (r[0] || []).map(v => String(v).replace(/\s+/g, ''));
      if(h.includes('구분') && h.includes('항목명') && h.includes('PW')){ rows = r; break; }
    }
    if(!rows){ smAlert('회사정보 시트를 찾지 못했어요', 'Tax.J → 엑셀 일괄 다운로드에서 "회사정보"를 골라 받은 파일을 올려 주세요.'); return; }
    const head = rows[0].map(v => String(v).replace(/\s+/g, ''));
    const c = name => head.indexOf(name);
    const iCat = c('구분'), iTarget = c('대상'), iLabel = c('항목명'), iType = c('유형'), iId = c('ID/내용'), iPw = c('PW'), iMemo = c('메모');
    const LOCK = /잠금\s*상태/;
    let locked = 0;
    const list = rows.slice(1).filter(r => r.some(v => String(v).trim())).map(r => {
      const v = i => (i >= 0 ? String(r[i] ?? '').trim() : '');
      let user = v(iId), pw = v(iPw);
      if(LOCK.test(user) || LOCK.test(pw)){ locked++; user = LOCK.test(user) ? '' : user; pw = LOCK.test(pw) ? '' : pw; }
      return { site: v(iLabel), url:'', user, pw, memo: v(iMemo), group: [v(iCat), v(iTarget)].filter(Boolean).join(' · '), kind: v(iType) || '계정' };
    }).filter(x => x.site || x.user);
    if(!list.length){ smAlert('가져올 항목이 없어요', '회사정보 시트가 비어 있어요.'); return; }
    const had = accountItems.filter(a => a.src === 'taxj').length;
    if(!(await smConfirm(`회사(Tax.J) 계정 ${list.length}건을 가져올까요?`, had ? `지금 있는 회사 항목 ${had}건은 새 파일 내용으로 바뀌어요. 내 개인 항목은 그대로예요.` : '내 개인 항목과 구분해서 보관해요.', { icon:'↓', okText:'가져오기' }))) return;
    const today = todayStr();
    accountItems = accountItems.filter(a => a.src !== 'taxj').concat(list.map(x => Object.assign({ id: accountNextId++, src:'taxj', at: today }, x)));
    settings.taxjAccountsImportedAt = today;
    accountView = 'taxj';
    await accSave();
    if(locked) smAlert(`${locked}건은 ID/PW가 비어 있어요`, 'Tax.J에서 잠금을 해제하지 않고 받은 파일이라 암호화된 값이 빠졌어요. Tax.J에서 잠금 해제 후 다시 받아 올려 주세요.');
  }catch(e){
    console.error('회사 계정 엑셀 가져오기 실패', e);
    smAlert('가져오지 못했어요', String(e && e.message || e), { tone:'danger' });
  }
}
// [2026.10.08] "개인 계정과 회사웹 계정을 한 곳에 모아 보고 싶다"(요청) - 엑셀 없이, Tax.J 메뉴에서 받아 둔 회사 자료(taxjFull)의
// 사내정보(법인공용·팀총괄·팀원·개인)를 Tax.J 관리비밀번호로 풀어서 '회사(Tax.J)' 항목으로 가져옴. 관리비밀번호는 저장하지 않고 이번에만 씀.
// 복호화 방식은 Tax.J와 같음: PBKDF2(관리비밀번호, s__manageSalt, 150000회, SHA-256) → AES-GCM 키, s__manageVerifier로 비밀번호 확인
async function accImportTaxjLive(){
  if(!accountItems) return;
  accTouch();
  const docs = (typeof taxjFull !== 'undefined' && taxjFull && taxjFull.docs) || null;
  if(!docs || !docs.s__companyInfo){
    if(await smConfirm('먼저 Tax.J 자료를 불러와 주세요', 'Tax.J 메뉴에서 "Tax.J에서 불러오기"(또는 새로고침)를 한 번 누르면 회사 계정을 가져올 수 있어요.', { okText:'Tax.J 메뉴로' })) switchTab('taxj');
    return;
  }
  const r = await smForm('Tax.J 관리비밀번호', [{ label:'회사웹 정보조회(관리) 비밀번호', type:'password', value:'' }], { okText:'가져오기', icon:'🔒' });
  if(!r || !r[0]) return;
  try{
    const b64 = v => Uint8Array.from(atob(v), ch => ch.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(r[0]), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: b64(docs.s__manageSalt), iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const dec = async p => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(p.iv) }, key, b64(p.data))));
    let ok = false; try{ ok = docs.s__manageVerifier && (await dec(docs.s__manageVerifier)).check === 'ok'; }catch(e){}
    if(!ok){ smAlert('비밀번호가 맞지 않아요', 'Tax.J 관리비밀번호를 다시 확인해 주세요. 회사웹에서 최근에 바꿨다면 Tax.J 메뉴에서 새로고침한 뒤 다시 해 보세요.', { tone:'danger' }); return; }
    const ci = docs.s__companyInfo || {}, list = [];
    let failed = 0;
    const push = async (cat, target, it) => {
      if(!it) return;
      let v = { idVal: it.idVal || '', pwVal: it.pwVal || '', content: it.content || '' };
      if(it.sensitiveEnc){ try{ v = Object.assign(v, await dec(it.sensitiveEnc)); }catch(e){ failed++; } }
      const isInfo = (it.type || 'account') === 'info';
      list.push({ site: it.label || '', url: it.noteIsLink ? (it.note || '') : '', user: isInfo ? (v.content || '') : (v.idVal || ''), pw: isInfo ? '' : (v.pwVal || ''),
        memo: it.noteIsLink ? '' : (it.note || ''), group: [cat, target].filter(Boolean).join(' · '), kind: isInfo ? '정보' : '계정' });
    };
    for(const it of (ci.corp || [])) await push('법인공용', docs.s__companyName || '', it);
    for(const it of (ci.teamGeneral || [])) await push('팀총괄', '', it);
    for(const person of (ci.team || [])) for(const it of ((person && person.items) || [])) await push('팀원', person.person || '', it);
    for(const it of (ci.personal || [])) await push('개인', it.owner || '', it);
    const items = list.filter(x => x.site || x.user);
    if(!items.length){ smAlert('가져올 항목이 없어요', 'Tax.J 사내정보가 비어 있어요.'); return; }
    const had = accountItems.filter(a => a.src === 'taxj').length;
    if(!(await smConfirm(`회사(Tax.J) 계정 ${items.length}건을 가져올까요?`, had ? `지금 있는 회사 항목 ${had}건은 Tax.J 최신 내용으로 바뀌어요. 내 개인 항목은 그대로예요.` : '내 개인 항목과 구분해서 "회사(Tax.J)"로 보관해요.', { icon:'↓', okText:'가져오기' }))) return;
    const today = todayStr();
    accountItems = accountItems.filter(a => a.src !== 'taxj').concat(items.map(x => Object.assign({ id: accountNextId++, src:'taxj', at: today }, x)));
    settings.taxjAccountsImportedAt = today;
    accountView = 'all';
    await accSave();
    if(failed) smAlert(`${failed}건은 풀지 못했어요`, '그 항목은 ID/PW가 비어 있어요. 회사웹에서 관리비밀번호가 바뀐 뒤 다시 저장되지 않은 항목일 수 있어요.');
  }catch(e){
    console.error('Tax.J 회사 계정 가져오기 실패', e);
    smAlert('가져오지 못했어요', String(e && e.message || e), { tone:'danger' });
  }
}
function accSetView(v){ accountView = v; accTouch(); renderAccounts(); }
function accHref(u){ if(!u) return ''; return /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function renderAccounts(){
  const el = document.getElementById('tab-accounts');
  if(!el) return;
  const lockIc = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if(!accountVault){
    el.innerHTML = `
      <div class="card acc-wrap"><div class="acc-lock">
        <div class="acc-lock-ic">${lockIc}</div>
        <h3 style="margin:0 0 6px;">보관함 비밀번호 만들기</h3>
        <div class="hint" style="margin-bottom:14px;">이 비밀번호로 아이디·비밀번호 목록 전체를 암호화해요. 이 비밀번호는 어디에도 저장되지 않아서, <b>잊으면 보관함을 열 수 없어요.</b></div>
        <input type="password" id="accNewPw" placeholder="보관함 비밀번호 (6자 이상)" autocomplete="new-password">
        <input type="password" id="accNewPw2" placeholder="한 번 더 입력" autocomplete="new-password" onkeydown="if(event.key==='Enter') accCreateVault()">
        <button class="btn primary" onclick="accCreateVault()">보관함 만들기</button>
      </div></div>`;
    return;
  }
  if(!accountItems){
    el.innerHTML = `
      <div class="card acc-wrap"><div class="acc-lock">
        <div class="acc-lock-ic">${lockIc}</div>
        <h3 style="margin:0 0 6px;">보관함이 잠겨 있어요</h3>
        <div class="hint" style="margin-bottom:14px;">보관함 비밀번호를 입력하면 열려요. 2시간 동안 손대지 않거나 새로고침하면 다시 잠겨요.</div>
        <input type="password" id="accPw" placeholder="보관함 비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter') accUnlock()">
        <button class="btn primary" onclick="accUnlock()">열기</button>
      </div></div>`;

  const q = accountSearch.trim().toLowerCase();
  const nMine = accountItems.filter(a => a.src !== 'taxj').length, nTaxj = accountItems.length - nMine;
  const list = accountItems
    .filter(a => accountView === 'all' || (accountView === 'taxj') === (a.src === 'taxj'))
    .filter(a => !q || [a.site, a.url, a.user, a.memo, a.group].some(v => String(v || '').toLowerCase().includes(q)))
    .sort((a, b) => ((a.src === 'taxj') - (b.src === 'taxj')) || String(a.group || '').localeCompare(String(b.group || ''), 'ko') || String(a.site || '').localeCompare(String(b.site || ''), 'ko'));
  el.innerHTML = `
    <div class="card acc-wrap">
      <div class="cl-head">
        <div class="cl-subtabs">
          ${[['all','전체', accountItems.length], ['mine','개인', nMine], ['taxj','회사(Tax.J)', nTaxj]]
            .map(([k, l, n]) => `<button class="cl-subtab ${accountView === k ? 'on' : ''}" onclick="accSetView('${k}')">${l} <span>${n}</span></button>`).join('')}
        </div>
        <div style="text-align:right;">

            <td><span class="acc-cell"><span class="acc-secret">${a.pw ? (accountShown.has(a.id) ? escapeAttr(a.pw) : '••••••••') : '-'}</span>${a.pw ? `<button class="btn xs" onclick="accToggle(${a.id})">${accountShown.has(a.id) ? '숨기기' : '보기'}</button><button class="btn xs" onclick="accCopy(${a.id}, 'pw', this)">복사</button>` : ''}</span></td>
            <td><div class="acc-memo">${escapeAttr(a.memo || '')}</div></td>
            <td style="white-space:nowrap;">${a.at ? shortDate(a.at) : ''}</td>
            <td style="white-space:nowrap;"><span class="row-actions">
              <button class="icon-btn" onclick="accEdit(${a.id})" title="수정" aria-label="수정">${ICON_EDIT}</button>
              <button class="icon-btn danger" onclick="accDelete(${a.id})" title="삭제" aria-label="삭제">${ICON_TRASH}</button>
            </span></td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>` : `<div class="empty">${q ? `"${escapeAttr(accountSearch)}" 검색 결과가 없어요.` : '아직 보관한 계정이 없어요. \'계정 추가\'로 넣어 주세요.'}</div>`}
    </div>`;
}

/* =========================================================
   초기 렌더 (로그인 성공 후에만 실행됨)
   ========================================================= */

function renderAllNoSave(){
  try{ ensurePayMonths(); ensureTaxRows(); generateRecurringTasks(); }catch(e){ console.warn(e); }
  renderHome(); renderWorklist(); renderAccounts(); renderLinks(); renderManuals(); renderVat(); renderClose(); renderPay(); renderCorp(); renderIndiv(); renderClients(); renderSettings();
  if(activeTab === 'review') renderReview();
  if(activeTab === 'taxj') renderTaxjFull();
  if(activeTab === 'attend') renderAttend();
  if(activeTab === 'inner') renderInner();
}
function renderAll(){
  renderAllNoSave();
  scheduleGoogleSave();
}

const GOOGLE_POLL_INTERVAL_MS = 20000;
let googlePollTimer = null;

function isEditingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

async function pollGoogleSheetForUpdates(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  if(saveTimer || savingNow) return;
  if(isEditingNow()) return;
  if(hasUnsavedChanges()){ scheduleGoogleSave(); return; }   // 저장 안 된 변경이 있으면 덮어쓰지 않고 먼저 저장 시도
  try {
    await loadFromGoogleSheet();
    renderAllNoSave();
  } catch(e){
    console.warn('자동 새로고침 실패', e);
    if(isAuthError(e)){
      handleGoogleTokenExpired();
    }
  }
}

function startGooglePolling(){
  clearInterval(googlePollTimer);
  googlePollTimer = setInterval(pollGoogleSheetForUpdates, GOOGLE_POLL_INTERVAL_MS);
}

window.addEventListener('focus', () => { pollGoogleSheetForUpdates(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') pollGoogleSheetForUpdates();
});

function updateConnectBanner(){
  const b = document.getElementById('connectBanner');
  if(b) b.style.display = googleAccessToken ? 'none' : '';
  if(typeof fitWorklistHeight === 'function') fitWorklistHeight();   // 안내 띠가 생기거나 사라지면 To do 높이 다시 맞춤
}
function startAppAfterAuth(){
  document.getElementById('todayPill').textContent = todayStr().replaceAll('-','.');
  setTimeout(updateConnectBanner, 0);
  renderNav();
  try{ ensurePayMonths(); const cm = `${new Date().getMonth() + 1}월`; if(payMonths.includes(cm)) currentPayMonth = cm; }catch(e){}
  let last = 'home';
  try{ last = localStorage.getItem('sm_last_tab') || 'home'; }catch(e){}
  switchTab(TABS.some(t => t.id === last) ? last : 'home');
  setTimeout(() => { taxjLiveAutoReady = true; taxjLiveAutoStart(); }, 1200);   // [2026.10.12] 전에 연결했으면 회사웹 실시간 연결 다시 켜기
}

// gapi/GIS는 게이트 버튼(로그인+Sheets 연동을 한 번에 처리)이 쓸 수 있어야 하므로
// 인증 여부와 상관없이 페이지 로드 시 바로 초기화한다.
if(typeof gapi !== 'undefined'){
  gapiLoaded();
} else {
  console.warn('Google API 스크립트를 불러오지 못했습니다 (네트워크 제한 환경일 수 있음).');
}
if(typeof google !== 'undefined' && google.accounts){
  gisInit();
} else {
  console.warn('Google Identity Services를 불러오지 못했습니다 (네트워크 제한 환경일 수 있음).');
}

initAuthGate();

<script>
// ── 앱 설치(PWA) ──
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.style.display = '';
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('installAppBtn');
  if(btn) btn.style.display = 'none';
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installAppBtn').style.display = 'none';
}
</script>
<script>
/* ===== 공통 팝업 (B안: 가운데 정렬 + 아이콘형) ===== */
function smDialog(opts){
  return new Promise(resolve => {
    const o = Object.assign({ icon:'?', tone:'', title:'', message:'', okText:'확인', cancelText:'취소', fields:null }, opts || {});
    if(o.cancelText === '삭제' && o.closeX === undefined) o.closeX = true;
    const wrap = document.createElement('div');
    wrap.className = 'sm-modal-backdrop';
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    wrap.innerHTML = `
      <div class="sm-modal ${o.tone} ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        ${o.closeX === false ? '' : '<button type="button" class="sm-modal-x" title="닫기" aria-label="닫기">×</button>'}
        <div class="sm-modal-ic">${esc(o.icon)}</div>
        ${o.title ? `<div class="sm-modal-title">${esc(o.title)}</div>` : ''}
        ${o.html ? `<div class="sm-modal-msg sm-modal-html">${o.html}</div>` : (o.message ? `<div class="sm-modal-msg">${esc(o.message).replace(/\n/g,'<br>')}</div>` : '')}
        ${o.fields ? `<div class="sm-modal-fields">${o.fields.map((f,i) => `
          <label class="sm-modal-field"><span>${esc(f.label)}</span>
            ${f.options ? `<select data-i="${i}">${f.options.map(op => `<option ${op === f.value ? 'selected' : ''}>${esc(op)}</option>`).join('')}</select>`
              : f.type === 'textarea' ? `<textarea data-i="${i}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder)}">${esc(f.value)}</textarea>`
              : `<input type="${f.type || 'text'}" data-i="${i}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}">`}</label>`).join('')}</div>` : ''}
        <div class="sm-modal-btns">
          ${o.cancelText ? `<button type="button" class="sm-modal-cancel">${esc(o.cancelText)}</button>` : ''}
          <button type="button" class="sm-modal-ok">${esc(o.okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    const inputs = Array.from(wrap.querySelectorAll('input, select, textarea'));
    const done = ok => {
      document.removeEventListener('keydown', onKey, true);
      wrap.classList.remove('show');
      setTimeout(() => wrap.remove(), 150);
      if(ok === 'x') return resolve(undefined);   // [2026.10.15] closeX 창: X·Esc·바깥 클릭 = 아무것도 안 하고 닫기(undefined)
      if(o.fields) resolve(ok ? inputs.map(x => x.value) : null);
      else resolve(!!ok);
    };
    const onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(o.closeX ? 'x' : false); }
      else if(e.key === 'Enter' && !e.isComposing){
        // 여러 줄 입력칸(메모)에서는 Enter = 줄바꿈, Ctrl/Cmd+Enter = 저장
        if(e.target && e.target.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
        e.preventDefault(); e.stopPropagation(); done(true);
      }
    };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('.sm-modal-ok').onclick = () => done(true);
    const c = wrap.querySelector('.sm-modal-cancel'); if(c) c.onclick = () => done(false);
    // [2026.10.15] "모든 팝업에 닫기 버튼"(요청) - X는 취소와 같음. 단 취소 버튼이 '삭제'인 창(항목 수정)은 X·Esc·바깥 클릭 = 그냥 닫기(undefined)
    const x = wrap.querySelector('.sm-modal-x'); if(x) x.onclick = () => done(o.closeX ? 'x' : false);
    wrap.addEventListener('mousedown', e => { if(e.target === wrap) done(o.closeX ? 'x' : false); });
    setTimeout(() => (inputs[0] || wrap.querySelector('.sm-modal-ok')).focus(), 30);
  });
}
function smConfirm(title, message, opts){ return smDialog(Object.assign({ title, message }, opts || {})); }
function smAlert(title, message, opts){ return smDialog(Object.assign({ title, message, icon:'!', cancelText:null }, opts || {})); }
function smForm(title, fields, opts){ return smDialog(Object.assign({ title, fields, icon:'+' }, opts || {})); }
</script>
