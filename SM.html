async function importWorklistFromMaster(){
  const tabTitles = await findWorkListTabs();
  if(!tabTitles.length){ console.warn('Work List 형식의 탭을 찾지 못했습니다.'); return { taskCount: 0, checklistMonths: 0 }; }

  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const importedTasks = [];
  const newChecklist = {};
  const newSchedule = {};

  for(const title of tabTitles){
    const res = await gapi.client.sheets.spreadsheets.get({
      spreadsheetId: MASTER_SHEET_ID,
      ranges: [`'${title}'!A1:F4000`],
      fields: 'sheets(merges,data.rowData.values.formattedValue)',
    });
    const sheet = (res.result.sheets || [])[0];
    if(!sheet) continue;
    const rowData = (sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
    const merges = sheet.merges || [];
    const cellText = (ri, ci) => {
      const row = rowData[ri];
      if(!row || !row.values || !row.values[ci]) return '';
      return (row.values[ci].formattedValue || '').toString().trim();
    };

    // 상단 고정 체크리스트(4~12행: B열)와 주요 세무일정(4~12행: E열)
    const checklist = [];
    const schedule = [];
    for(let ri = 3; ri <= 11; ri++){
      const b = cellText(ri, 1);
      const e = cellText(ri, 4);
      if(b) checklist.push(b);
      if(e) schedule.push(e);
    }

    const dateHeaders = merges
      .filter(m => m.startColumnIndex === 0 && (m.endColumnIndex - m.startColumnIndex) >= 2)
      .map(m => ({ merge: m, text: cellText(m.startRowIndex, 0) }))
      .filter(h => dateRe.test(h.text))
      .sort((a, b) => a.merge.startRowIndex - b.merge.startRowIndex);

    const dayTasks = [];
    const monthCounts = {};
    dateHeaders.forEach((h, idx) => {
      const m = dateRe.exec(h.text);
      let year = parseInt(m[1], 10);
      if(year < 100) year += 2000;
      const mo = parseInt(m[2], 10);
      const mm = pad2(mo);
      const dd = pad2(parseInt(m[3], 10));
      const dateStr = `${year}-${mm}-${dd}`;
      monthCounts[mo] = (monthCounts[mo] || 0) + 1;

      const startRow = h.merge.endRowIndex;
      const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.startRowIndex : rowData.length;
      for(let ri = startRow; ri < endRow; ri++){
        const check = cellText(ri, 0);
        const text = cellText(ri, 1);
        if(!text) continue;
        if(check !== 'TRUE' && check !== 'FALSE') continue;
        dayTasks.push({ date: dateStr, text, done: check === 'TRUE' });
      }
    });

    // 탭의 실제 월은 A2에 적힌 라벨보다, 날짜 항목 중 가장 많이 나온 월을 더 신뢰한다.
    // (예: 어떤 탭은 A2가 실수로 다른 달로 적혀 있어도 실제 날짜들은 그 탭의 진짜 달인 경우가 있었음)
    let monthLabel = null, bestCount = -1;
    Object.entries(monthCounts).forEach(([mo, cnt]) => {
      if(cnt > bestCount){ bestCount = cnt; monthLabel = `${parseInt(mo, 10)}월`; }
    });
    if(!monthLabel) monthLabel = cellText(1, 0) || title;

    if(checklist.length) newChecklist[monthLabel] = checklist.map(text => ({ text, done: false }));
    if(schedule.length) newSchedule[monthLabel] = schedule;
    dayTasks.forEach(t => importedTasks.push({ id: nextTaskId++, date: t.date, text: t.text, done: t.done, source: 'master' }));
  }

  // 오늘로 넘긴 할 일은 원래 날짜에 다시 생기지 않도록 제외
  const movedKeys = new Set(tasks.filter(t => t.movedFrom).map(t => t.movedFrom + '|' + t.text).concat(settings.hiddenMasterTasks || []));
  tasks = tasks.filter(t => t.source !== 'master').concat(importedTasks.filter(t => !movedKeys.has(t.date + '|' + t.text)));
  // 체크리스트는 달별로 합치기: 체크 상태·이력 유지, 직접 추가한 항목 유지, 지우거나 고친 마스터 항목은 되살리지 않음
  const hiddenCL = new Set(settings.hiddenMasterChecklist || []);
  Object.keys(newChecklist).forEach(mo => {
    const old = worklistChecklist[mo] || [];
    const byText = {}; old.forEach(it => { byText[it.origText || it.text] = it; });
    const fromMaster = newChecklist[mo]
      .filter(it => !hiddenCL.has(mo + '|' + it.text) || byText[it.text])
      .map(it => byText[it.text] || it);
    const kept = old.filter(it => it.source === 'user' || (it.origText && !fromMaster.includes(it)));
    worklistChecklist[mo] = fromMaster.concat(kept.filter(it => !fromMaster.includes(it)));
  });
  worklistSchedule = Object.assign({}, worklistSchedule, newSchedule);

  return { taskCount: importedTasks.length, checklistMonths: Object.keys(newChecklist).length };
}

/* ===== 엑셀 파일에서 체크리스트·할 일 가져오기 =====
   "★Tax_2026" 마스터 시트를 엑셀로 내려받은 파일을 읽어요.
   A1이 "Work List"인 시트(들)에서, B4:B12는 고정 체크리스트, E4:E12는 주요 세무일정,
   A열에 "OO년 O월 O일"로 병합된 칸을 날짜 구간으로 보고 그 아래 A열(체크)·B열(내용)을 할 일로 읽어요. */
function computeWorklistImportFromExcel(wb){
  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const importedTasks = [];
  const newChecklist = {};
  const newSchedule = {};

  const wlSheets = wb.SheetNames.filter(name => {
    const ws = wb.Sheets[name];
    const a1 = ws && ws['A1'] ? String(ws['A1'].v == null ? '' : ws['A1'].v).trim() : '';
    return a1 === 'Work List';
  });
  const targetSheets = wlSheets.length ? wlSheets : wb.SheetNames;

  targetSheets.forEach(title => {
    const ws = wb.Sheets[title];
    if(!ws) return;
    const merges = ws['!merges'] || [];
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
    const cellText = (ri, ci) => {
      const cell = ws[XLSX.utils.encode_cell({ r: ri, c: ci })];
      if(!cell) return '';
      return String(cell.w != null ? cell.w : (cell.v == null ? '' : cell.v)).trim();
    };

    const checklist = [];
    const schedule = [];
    for(let ri = 3; ri <= 11; ri++){
      const b = cellText(ri, 1);
      const e = cellText(ri, 4);
      if(b) checklist.push(b);
      if(e) schedule.push(e);
    }

    const dateHeaders = merges
      .filter(m => m.s.c === 0 && (m.e.c - m.s.c) >= 2)
      .map(m => ({ merge: m, text: cellText(m.s.r, 0) }))
      .filter(h => dateRe.test(h.text))
      .sort((a, b) => a.merge.s.r - b.merge.s.r);

    const dayTasks = [];
    const monthCounts = {};
    dateHeaders.forEach((h, idx) => {
      const m = dateRe.exec(h.text);
      let year = parseInt(m[1], 10);
      if(year < 100) year += 2000;
      const mo = parseInt(m[2], 10);
      const mm = pad2(mo);
      const dd = pad2(parseInt(m[3], 10));
      const dateStr = `${year}-${mm}-${dd}`;
      monthCounts[mo] = (monthCounts[mo] || 0) + 1;

      const startRow = h.merge.e.r + 1;
      const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.s.r : (range.e.r + 1);
      for(let ri = startRow; ri < endRow; ri++){
        const check = cellText(ri, 0);
        const text = cellText(ri, 1);
        if(!text) continue;
        if(check !== 'TRUE' && check !== 'FALSE') continue;
        dayTasks.push({ date: dateStr, text, done: check === 'TRUE' });
      }
    });

    let monthLabel = null, bestCount = -1;
    Object.entries(monthCounts).forEach(([mo, cnt]) => {
      if(cnt > bestCount){ bestCount = cnt; monthLabel = `${parseInt(mo, 10)}월`; }
    });
    if(!monthLabel) monthLabel = cellText(1, 0) || title;

    if(checklist.length) newChecklist[monthLabel] = checklist.map(text => ({ text, done:false }));
    if(schedule.length) newSchedule[monthLabel] = schedule;
    dayTasks.forEach(t => importedTasks.push({ id: nextTaskId++, date: t.date, text: t.text, done: t.done, source:'master' }));
  });

  return { importedTasks, newChecklist, newSchedule };
}

function applyWorklistImport({ importedTasks, newChecklist, newSchedule }){
  const movedKeys = new Set(tasks.filter(t => t.movedFrom).map(t => t.movedFrom + '|' + t.text).concat(settings.hiddenMasterTasks || []));
  tasks = tasks.filter(t => t.source !== 'master').concat(importedTasks.filter(t => !movedKeys.has(t.date + '|' + t.text)));
  const hiddenCL = new Set(settings.hiddenMasterChecklist || []);
  Object.keys(newChecklist).forEach(mo => {
    const old = worklistChecklist[mo] || [];
    const byText = {}; old.forEach(it => { byText[it.origText || it.text] = it; });
    const fromMaster = newChecklist[mo]
      .filter(it => !hiddenCL.has(mo + '|' + it.text) || byText[it.text])
      .map(it => byText[it.text] || it);
    const kept = old.filter(it => it.source === 'user' || (it.origText && !fromMaster.includes(it)));
    worklistChecklist[mo] = fromMaster.concat(kept.filter(it => !fromMaster.includes(it)));
  });
  worklistSchedule = Object.assign({}, worklistSchedule, newSchedule);
}

async function importWorklistExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    if(typeof XLSX === 'undefined'){
      await new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; el.onload = res; el.onerror = () => rej(new Error('엑셀 읽기 도구를 불러오지 못했어요')); document.head.appendChild(el); });
    }
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const parsed = computeWorklistImportFromExcel(wb);
    const checklistMonths = Object.keys(parsed.newChecklist).length;
    if(!parsed.importedTasks.length && !checklistMonths){
      smAlert('가져올 내용을 찾지 못했어요', '"Work List" 형식의 엑셀 파일인지 확인해주세요.', { tone:'danger' });
      return;

function smUtf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function setSmDeployMsg(t){
  smDeployMsgText = t;
  const el = document.getElementById('smDeployMsg');
  if(el) el.textContent = t;
}
async function runSmDeploy(){
  const msgEl = document.getElementById('smDeployMsg');
  const token = (localStorage.getItem(GITHUB_DEPLOY_TOKEN_KEY) || '').trim();
  if(!token || !smDeploySelectedFile) return;
  if(!(await smConfirm('GitHub에 배포할까요?', `${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME} 저장소의 ${GITHUB_DEPLOY_FILE_PATH}에 올려요.`, { okText:'배포하기' }))) return;
  const btn = document.getElementById('smDeployBtn');
  if(btn) btn.disabled = true;
  try {
    setSmDeployMsg('파일 읽는 중...');
    const content = await smDeploySelectedFile.text();
    // [2026.10.08] 다른 파일(회사웹 Tax.J 등)이 SM 저장소에 잘못 올라가지 않게(요청: "이름만이 아니라 안의 내용까지 보고 판단") -
    // 파일 이름과 상관없이 내용으로 판단: works에만 있는 표시가 모두 있어야 하고, Tax.J에만 있는 표시가 하나라도 있으면 배포하지 않음.
    // (표시 글자를 그대로 적으면 이 코드 자체가 그 글자를 품게 되므로 잘라서 이어 붙임)
    {
      const has = t => content.indexOf(t) >= 0;
      const mustHave = [['<ti' + "tle>Sunmin's Works</ti" + 'tle>', 'works 제목'], ["GITHUB_DEPLOY_REPO_NAME = 'S" + "M'", 'works 배포 설정'], ['function render' + 'Worklist', 'To do 화면']];
      const mustNot = [['<ti' + 'tle>Tax.J</ti' + 'tle>', 'Tax.J 제목'], ["FS_COLLECTION = 'ta" + "xj'", 'Tax.J 저장소 설정'], ["GITHUB_DEPLOY_REPO_NAME = 'Ta" + "x.J'", 'Tax.J 배포 설정']];
      const miss = mustHave.filter(([t]) => !has(t)).map(x => x[1]), bad = mustNot.filter(([t]) => has(t)).map(x => x[1]);
      if(miss.length || bad.length) throw new Error(`works 파일이 아니에요(${bad.length ? bad.join('·') + ' 들어 있음' : miss.join('·') + ' 없음'}). SM.html을 골라 주세요. 회사웹 index.html은 Tax.J에서 배포해요.`);
    }
    const apiBase = `https://api.github.com/repos/${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME}/contents/${GITHUB_DEPLOY_FILE_PATH}`;
    const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
    setSmDeployMsg('기존 파일 정보 확인 중...');
    const getRes = await fetch(apiBase, { headers });
    if(!getRes.ok){
      if(getRes.status === 401) throw new Error('토큰이 유효하지 않아요. 저장소 쓰기 권한이 있는 토큰인지 확인해주세요.');
      if(getRes.status === 404) throw new Error('저장소 또는 파일 경로를 찾을 수 없어요.');
      throw new Error(`GitHub 조회 실패 (${getRes.status})`);
    }
    const cur = await getRes.json();
    // 지금 올라가 있는 파일과 크기가 30% 넘게 다르면(통째로 다른 파일일 가능성) 한 번 더 확인
    {
      const newSize = new Blob([content]).size, oldSize = Number(cur.size) || 0;
      if(oldSize && Math.abs(newSize - oldSize) / oldSize > 0.3){
        const kb = n => Math.round(n / 1024).toLocaleString() + 'KB';
        if(!(await smConfirm('크기가 많이 달라요', `지금 올라가 있는 파일과 크기가 많이 달라요 (${kb(oldSize)} → ${kb(newSize)}).\n다른 파일일 수 있어요. 그래도 배포할까요?`, { tone:'danger', icon:'!', okText:'그래도 배포' }))) throw new Error('크기가 많이 달라서 배포를 멈췄어요.');
      }
    }
    setSmDeployMsg('GitHub에 커밋하는 중...');
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `SM 업데이트 (${new Date().toLocaleString('ko-KR')})`,
        content: smUtf8ToBase64(content),
        sha: cur.sha,
      }),
    });
    if(!putRes.ok){
      const errBody = await putRes.json().catch(() => ({}));
      throw new Error(errBody.message || `GitHub 커밋 실패 (${putRes.status})`);
    }
    setSmDeployMsg('배포 완료! 잠시 후 실제 서비스 화면에 반영돼요.');
    // 요청 배경(2026.10.06): 왼쪽 퀵배포로 올리면 설정 화면의 작은 글씨가 안 보여 완료 여부를 몰랐음 → 어느 화면에서든 팝업으로 알림
    smAlert('배포 완료!', '잠시 후 실제 서비스 화면에 반영돼요.', { icon:'✓' });
    smDeploySelectedFile = null;
    const labelText = document.getElementById('smDeployFileLabelText');
    if(labelText) labelText.textContent = 'SM.html 파일 선택';
    const fileInput = document.getElementById('smDeployFile');
    if(fileInput) fileInput.value = '';
  } catch(e){
    console.error('GitHub 배포 실패', e);
    setSmDeployMsg('배포 실패: ' + (e && e.message ? e.message : e));
    smAlert('배포 실패', String(e && e.message ? e.message : e));
  } finally {
    smDeployUpdateBtnState();
  }
}

function taxjLiveClientRows(){

  const isReg = c => ['기장대행','신고대리'].includes(c.taxType);
  const w1 = c => c.entityType === '법인' ? 0 : c.entityType === '개인' ? 1 : 2;
  const w2 = c => c.taxType === '기장대행' ? 0 : c.taxType === '신고대리' ? 1 : 2;
  const sorted = list.map((c, i)=> ({ c, i })).sort((a, b)=> (w1(a.c) - w1(b.c)) || (w2(a.c) - w2(b.c)) || (a.i - b.i)).map(x=> x.c);

    terminationDate: c.terminationDate || '', terminationMonth: c.terminationMonth || '', terminationReason: c.terminationReason || '', taxjId: c.id });
  const reg = sorted.filter(c=> isReg(c) && c.status !== '해지').map(row);

function taxjRowsToFull(rows){

// Tax.J 저장 구조(fsAssembleSnapshot과 같음) → { 문서키: 값 }. 조각(~p1..)은 같은 저장(w)끼리만 이어붙임
function taxjParseSnap(snap){
  const mains = {}, parts = {};
  snap.forEach(d => {
    const id = d.id;
    if(id === '_meta' || id.startsWith('_presence__')) return;
    const m = id.match(/^(.*)~p(\d+)$/);
    if(m) (parts[m[1]] = parts[m[1]] || {})[Number(m[2])] = d.data(); else mains[id] = d.data();
  });
  const docs = {};
  Object.keys(mains).forEach(k => {
    const m = mains[k], n = m.n || 1; let json = m.j || 'null';
    for(let i = 1; i < n; i++){ const p = parts[k] && parts[k][i]; if(!p || p.w !== m.w){ json = null; break; } json += p.j; }
    if(json != null){ try{ docs[k] = JSON.parse(json); }catch(e){} }
    else if(taxjFull && taxjFull.docs && k in taxjFull.docs) docs[k] = taxjFull.docs[k];   // 조각이 덜 모였으면 직전 값 유지
  });

}

  const pk = submitPeriodKey();
  const per = submitMine[pk] = submitMine[pk] || {};
  const r = per[key] = per[key] || { done:'', note:'' };
  r.close = r.close || {};
  if(value) r.close[item] = value; else delete r.close[item];
  updateSubmitMine(key, 'done', r.done);   // 빈 줄 정리 + 다시 그림 + 저장
}
function renderSubmit(){
  const el = document.getElementById('tab-pay');   // [2026.10.13] 제출은 원천세 › 제출로 옮김(요청)
  if(!el) return;
  submitInit();
  if(!taxjFull && !taxjFullRestoreTried) taxjRestoreFull();
  const nowY = new Date().getFullYear(), years = [];
  for(let y = nowY + 1; y >= nowY - 4; y--) years.push(String(y));
  if(!years.includes(submitYear)) years.push(submitYear);
  const period = submitPeriodKey(), mine = submitMine[period] || {};
  const sub = submitMode === '연간' ? '' : submitMode === '반기'
    ? `<select onchange="submitHalf=this.value; renderSubmit();"><option value="H1" ${submitHalf==='H1'?'selected':''}>상반기 귀속</option><option value="H2" ${submitHalf==='H2'?'selected':''}>하반기 귀속</option></select>`
    : `<select onchange="submitMonth=this.value; renderSubmit();">${Array.from({length:12}, (_, i) => `<option value="${i+1}" ${String(i+1)===String(submitMonth)?'selected':''}>${i+1}월 귀속</option>`).join('')}</select>`;
  const items = SUBMIT_ITEMS[submitMode];
  const all = taxjFull ? submitRows() : [];
  const isDone = r => r.cells.every(x => x.st !== 'todo');
  const rows = submitOnlyLeft ? all.filter(r => !isDone(r) || !(mine[r.key] && mine[r.key].done)) : all;
  { let n = 0, prev = null; rows.forEach(r => { if(r.c !== prev){ n++; prev = r.c; } r.seq = n; }); }   // [2026.10.13] 순번은 보이는 거래처 차례대로(예전엔 전체 거래처 순번이라 1·3·5… 처럼 건너뛰었음)
  const doneN = all.filter(isDone).length, mineN = all.filter(r => mine[r.key] && mine[r.key].done).length;
  const pct = all.length ? Math.round(doneN / all.length * 100) : 0;
  const today = todayStr();
  const cellHtml = x => x.st === 'done' ? `<span style="font-weight:700; color:#059669;">${taxjEsc(x.txt)}</span>`
    : x.st === 'todo' ? `<span style="font-weight:700; color:${x.due && x.due < today ? '#e11d48' : '#b45309'};">미제출</span>${x.due ? `<div class="hint" style="margin:0;">~${Number(x.due.slice(5,7))}/${Number(x.due.slice(8,10))}</div>` : ''}`
    : '<span style="color:#d4c6cd;">-</span>';
  el.innerHTML = `
    <div class="card">
      ${taxjLiveBarHtml()}${payViewTabsHtml()}
      <div class="toolbar" style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center;"><!-- [2026.10.15] 귀속 제목 가운데(요청) -->
        <div><div class="sm-seg" id="submitModeSeg">${['월별','반기','연간'].map(m => `<button class="${submitMode === m ? 'on' : ''}" onclick="setSubmitMode('${m}')">${SUBMIT_MODE_LABEL[m]}</button>`).join('')}</div></div>
        <div style="display:flex; align-items:center; gap:10px;"><select onchange="submitYear=this.value; renderSubmit();">${years.map(y => `<option value="${y}" ${y===submitYear?'selected':''}>${y}년${submitMode === '연간' ? ' 귀속' : ''}</option>`).join('')}</select>
        ${sub}</div>
        <label class="hint" style="justify-self:end; margin:0; display:inline-flex; align-items:center; gap:4px; cursor:pointer;"><input type="checkbox" ${submitOnlyLeft ? 'checked' : ''} onchange="submitOnlyLeft=this.checked; renderSubmit();"> 남은 것만</label>
      </div>
      ${!taxjFull ? '<div class="empty">Tax.J에 연결하면 회사웹 제출현황이 여기에 채워져요.</div>' : `
      <div class="summary-row">
        <div class="stat tone-blue"><div class="n">${all.length}</div><div class="label">제출 대상</div></div>
        <div class="stat tone-mint"><div class="n">${doneN}</div><div class="label">회사 제출 완료</div></div>
        <div class="stat"><div class="n">${mineN}</div><div class="label">내 확인</div></div>
      </div>
      <div class="progress-bar"><div class="fill tone-mint" style="width:${pct}%"></div></div>
      ${rows.length ? `<div class="table-scroll" style="margin-top:16px;"><table>
        <thead><tr><th class="tx-seq" rowspan="2">순번</th><th rowspan="2">상호명</th>${submitMode === '월별' ? '<th rowspan="2">지급월</th>' : ''}${items.map(([, l]) => `<th colspan="2">${l}</th>`).join('')}<th rowspan="2">내 확인</th><th rowspan="2">내 메모</th></tr>
        <tr>${items.map(() => '<th>마감</th><th>신고일</th>').join('')}</tr></thead>
        <tbody>${rows.map(r => { const m = mine[r.key] || { done:'', note:'' }; return `<tr>
          <td class="tx-seq">${r.seq}</td>
          <td class="tx-name" title="${taxjEsc(r.memo ? '회사 메모: ' + r.memo : '')}">${taxjEsc(r.c.name)}${r.dual ? ` <span class="hint" style="margin:0; font-weight:700; color:${r.lane === 'sameMonth' ? '#047857' : '#be123c'};">${r.lane === 'sameMonth' ? '당월' : '익월'}</span>` : ''}${r.memo ? ' <span class="hint" style="margin:0;">✎</span>' : ''}</td>
          ${submitMode === '월별' ? `<td>${Number(r.payMonth.slice(5,7))}월</td>` : ''}
          ${r.cells.map((x, ci) => { const it = items[ci][0], cv = ((m.close || {})[it]) || '';
            const closeTd = x.st === 'na' && !cv ? '<td><span style="color:#d4c6cd;">-</span></td>'
              : `<td><input type="date" value="${escapeAttr(cv)}" title="내 마감일" onchange="setSubmitClose('${escapeAttr(r.key)}','${it}',this.value)" style="padding:6px 8px; font-size:12.5px;${cv ? ' color:#059669; font-weight:700;' : ''}"></td>`;
            return closeTd + `<td>${cellHtml(x)}</td>`; }).join('')}
          <td><div class="date-cell"><input type="date" value="${m.done}" onchange="updateSubmitMine('${r.key}','done',this.value)">${m.done ? pill('확인','ok') : `<button class="btn xs" onclick="updateSubmitMine('${r.key}','done','${today}')">오늘</button>`}</div></td>
          <td class="note-cell"><input type="text" value="${escapeAttr(m.note)}" onchange="updateSubmitMine('${r.key}','note',this.value)" style="width:100%"></td>
        </tr>`; }).join('')}</tbody></table></div>`
      : `<div class="empty">${submitOnlyLeft && all.length ? '남은 제출이 없어요.' : '이 기간에 제출 대상이 없어요(회사웹 검토표에 그 소득 금액이 있는 거래처만 나와요).'}</div>`}`}
    </div>`;
}

/* ── [2026.10.12] 근태경비 - 회사웹 개인 메뉴(출퇴근현황·근태현황·경비정산)를 실시간으로 보고 내 확인·메모를 더함(요청: "근태경비") ──
   자료: Tax.J data__<직원id>.attendance {clockLog, leaveUsage, leaveGrants, remoteEntries} / .expense {lunchEntries, dinnerEntries, taxiEntries, otherExpenses, prepaidEntries}
   (필드명은 Tax.J 엑셀 시트 정의 XLS_SHEET_CLOCK·LEAVE·REMOTE·EXPENSE와 같음). 회사 원본은 읽기만, 내 확인·메모는 attendMine(works)에만 저장.
   식대 한도·휴가 잔여처럼 회사 규칙으로 계산하는 값은 여기서 다시 계산하지 않음(틀릴 수 있어서) - 회사웹 기록 그대로 보여줌 */
let attendView = 'clock', attendMonth = '', attendPerson = '';
const ATTEND_VIEWS = [['clock','출퇴근현황'], ['leave','근태현황'], ['expense','경비정산'], ['cal','개인캘린더']];   // [2026.10.13] 개인캘린더 추가(요청)
const ATTEND_EXP_KINDS = [['lunchEntries','점심식대'], ['dinnerEntries','저녁식대'], ['taxiEntries','택시비'], ['otherExpenses','경비'], ['prepaidEntries','차액정산']];
const ATTEND_WEEK = ['일','월','화','수','목','금','토'];
function setAttendView(v){ attendView = v; if(activeTab !== 'attend') switchTab('attend'); else renderAttend(); }
function attendShiftMonth(n){ const [y, m] = attendMonth.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); attendMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; renderAttend(); }
function attendPeople(){ return ((taxjFull && taxjFull.docs && taxjFull.docs.profiles) || []).filter(p => p && p.id); }
function updateAttendMine(key, field, value){
  const r = attendMine[key] = attendMine[key] || { done:'', note:'' };
  r[field] = value;
  if(!r.done && !r.note) delete attendMine[key];
  renderAttend(); scheduleGoogleSave();
}
function attendMin(t){ const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
function attendDur(e){
  const a = attendMin(e.checkIn), b = attendMin(e.checkOut);
  if(a == null || b == null) return '';
  const d = b + (e.checkOutNextDay || b < a ? 1440 : 0) - a;
  return d > 0 ? `${Math.floor(d / 60)}:${pad2(d % 60)}` : '';
}
function attendMineCells(key){
  const m = attendMine[key] || { done:'', note:'' }, k = escapeAttr(key);
  return `<td><input type="checkbox" ${m.done ? 'checked' : ''} title="${m.done ? '확인: ' + m.done : '내 확인'}" onchange="updateAttendMine('${k}','done',this.checked ? '${todayStr()}' : '')"></td>
    <td class="note-cell"><input type="text" value="${escapeAttr(m.note)}" onchange="updateAttendMine('${k}','note',this.value)" style="width:100%"></td>`;
}
function attendDateTd(ds){ const d = new Date(ds + 'T00:00:00'); const w = d.getDay(); return `<td style="white-space:nowrap;${w === 0 ? 'color:#e11d48;' : w === 6 ? 'color:#2563eb;' : ''}">${Number(ds.slice(5,7))}/${Number(ds.slice(8,10))} (${ATTEND_WEEK[w]})</td>`; }
function renderAttend(){
  const el = document.getElementById('tab-attend');
  if(!el) return;
  if(!attendMonth){ const d = new Date(); attendMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
  if(!taxjFull && !taxjFullRestoreTried) taxjRestoreFull();
  const people = attendPeople();
  if(taxjFull && (!attendPerson || !people.some(p => p.id === attendPerson)))
    attendPerson = (people.find(p => String(p.email || '').toLowerCase() === String(taxjFull.email || '').toLowerCase()) || people[0] || {}).id || '';
  const pd = (taxjFull && taxjFull.docs['data__' + attendPerson]) || {};
  const att = pd.attendance || {}, ex = pd.expense || {}, mo = attendMonth;
  const inMonth = e => e && String(e.date || '').startsWith(mo);
  const na = '<span style="color:#d4c6cd;">-</span>';
  const [yy, mm] = mo.split('-').map(Number);
  let body = '', stats = '';
  const emptyRow = cols => `<tr><td colspan="${cols}"><div class="empty" style="padding:18px;">${yy}년 ${mm}월 기록이 없어요.</div></td></tr>`;
  if(attendView === 'clock'){
    const list = (att.clockLog || []).filter(inMonth).sort((a, b) => a.date < b.date ? -1 : 1);
    const remote = list.filter(e => e.status && e.status !== '사무실').length;
    const missOut = list.filter(e => e.checkIn && !e.checkOut).length;
    stats = `<div class="stat tone-blue"><div class="n">${list.filter(e => e.checkIn).length}</div><div class="label">출근 기록</div></div>
      <div class="stat tone-violet"><div class="n">${remote}</div><div class="label">사무실 외 근무</div></div>
      <div class="stat"><div class="n">${missOut}</div><div class="label">퇴근 기록 없음</div></div>`;
    body = `<thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>출퇴근 간격</th><th>근무지</th><th>내 확인</th><th>내 메모</th></tr></thead><tbody>${list.length ? list.map(e => `<tr>
      ${attendDateTd(e.date)}<td>${taxjEsc(e.checkIn) || na}</td><td>${e.checkOut ? taxjEsc(e.checkOut) + (e.checkOutNextDay ? ' <span class="hint" style="margin:0;">다음날</span>' : '') : na}</td>
      <td>${attendDur(e) || na}</td><td>${taxjEsc(e.status || '사무실')}</td>${attendMineCells('clock:' + e.date)}</tr>`).join('') : emptyRow(7)}</tbody>`;
  }else if(attendView === 'leave'){
    const rows = [].concat(
      (att.leaveUsage || []).filter(inMonth).map(e => ({ e, kind:'휴가', txt: [e.type, e.subtype].filter(Boolean).join(' · ') + (e.days ? ` ${e.days}일` : ''), key:'leave:' + (e.id || e.date) })),
      (att.remoteEntries || []).filter(inMonth).map(e => ({ e, kind:'재택', txt: [e.bonus ? '특별' : '정기', e.half ? (e.half === 'am' ? '오전' : e.half === 'pm' ? '오후' : e.half) : '', e.noLunch ? '식대 제외' : ''].filter(Boolean).join(' · '), key:'remote:' + (e.id || e.date) })),
      (att.leaveGrants || []).filter(inMonth).map(e => ({ e, kind:'휴가 부여', txt: `${e.type ? e.type + ' ' : ''}${e.days != null ? e.days + '일' : ''}`, key:'grant:' + (e.id || e.date) }))
    ).sort((a, b) => a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : 0);
    const yearUse = (att.leaveUsage || []).filter(e => String(e.date || '').startsWith(String(yy))).length;
    stats = `<div class="stat tone-rose"><div class="n">${rows.filter(r => r.kind === '휴가').length}</div><div class="label">이번 달 휴가</div></div>
      <div class="stat tone-violet"><div class="n">${rows.filter(r => r.kind === '재택').length}</div><div class="label">이번 달 재택</div></div>
      <div class="stat"><div class="n">${yearUse}</div><div class="label">${yy}년 휴가 기록</div></div>`;
    body = `<thead><tr><th>날짜</th><th>구분</th><th>내용</th><th>회사 메모</th><th>내 확인</th><th>내 메모</th></tr></thead><tbody>${rows.length ? rows.map(r => `<tr>
      ${attendDateTd(r.e.date)}<td><span style="font-weight:700; color:${r.kind === '휴가' ? '#e11d48' : r.kind === '재택' ? '#7c3aed' : 'var(--muted)'};">${r.kind}</span></td>
      <td>${taxjEsc(r.txt) || na}</td><td>${taxjEsc(r.e.memo) || na}</td>${attendMineCells(r.key)}</tr>`).join('') : emptyRow(6)}</tbody>`;
  }else if(attendView === 'cal'){
    // [2026.10.13] 회사웹 개인캘린더 연동(요청: "개인웹 근태경비에서 개인캘린더 회사웹이랑 연동하자") - Tax.J renderCalendar와 같은 자료를 읽기만 함:
    //   data__<직원id>.attendance.leaveUsage(휴가)·remoteEntries(재택), data__<직원id>.schedule.events(일정), s__exclusionDays(공휴일·회식 등), s__specialPeriods·s__workHourExceptions(특별기간)
    //   새 디자인 없이 홈 달력의 칸·표시(cal-grid / tj-att / cal-task)를 그대로 씀
    const map = {}, put = (d, html) => { (map[d] = map[d] || []).push(html); }, hol = {};
    const chip = (cls, label, title) => `<span class="tj-att ${cls}" title="${escapeAttr(title || label)}">${taxjEsc(label)}</span>`;
    const exc = taxjDoc('exclusionDays'), sps = taxjDoc('specialPeriods'), whx = taxjDoc('workHourExceptions');
    (Array.isArray(exc) ? exc : []).filter(x => x && !x.deleted && inMonth(x)).forEach(x => {
      if(x.reason === '공휴일') hol[x.date] = hol[x.date] || x.name || '공휴일';
      else put(x.date, chip('etc', x.name || x.reason || '제외일', [x.reason, x.name].filter(Boolean).join(' · ')));
    });
    const spRows = [].concat(Array.isArray(sps) ? sps : [], (Array.isArray(whx) ? whx : []).filter(e => !e.specialPeriodId || !(Array.isArray(sps) ? sps : []).some(p => p && p.id === e.specialPeriodId)));
    spRows.filter(p => p && !p.deleted && p.startDate && p.endDate && p.startDate <= mo + '-31' && p.endDate >= mo + '-01').forEach(p => {
      const ex2 = (Array.isArray(whx) ? whx : []).find(e => e && e.specialPeriodId && e.specialPeriodId === p.id) || p;
      const times = [ex2.startTime ? ex2.startTime + ' 출근' : '', ex2.endTime ? ex2.endTime + ' 퇴근' : ''].filter(Boolean).join(' · ');
      const label = '특별기간' + ((p.content || p.memo) ? ') ' + (p.content || p.memo) : '');
      for(let d = new Date(p.startDate + 'T00:00:00'); ; d.setDate(d.getDate() + 1)){
        const ds = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        if(ds > p.endDate) break;
        if(ds.startsWith(mo)) put(ds, chip('etc', label, [label, times].filter(Boolean).join(' · ')));
      }
    });
    (att.leaveUsage || []).filter(u => u && !u.deleted && inMonth(u)).forEach(u => put(u.date, chip('leave', [u.type || '휴가', u.subtype].filter(Boolean).join('·'), [u.type, u.subtype, u.days ? u.days + '일' : '', u.memo].filter(Boolean).join(' · '))));
    (att.remoteEntries || []).filter(r => r && !r.deleted && inMonth(r)).forEach(r => put(r.date, chip('remote', r.bonus ? '특별재택' : r.half === 'am' ? '오전재택' : r.half === 'pm' ? '오후재택' : '정기재택', [r.bonus ? '특별재택' : '정기재택', r.memo].filter(Boolean).join(' · '))));
    const evs = ((pd.schedule || {}).events || []).filter(e => e && !e.deleted && inMonth(e));
    evs.forEach(e => {
      const tm = e.startTime ? e.startTime + (e.endTime ? '~' + e.endTime : '') : (e.allDay ? '종일' : '');
      put(e.date, `<div class="cal-task cal-deadline cd-etc" title="${escapeAttr([tm, e.memo || e.title || ''].filter(Boolean).join(' · ') || (e.type || '일정'))}">${taxjEsc(e.type || '일정')}${e.title ? ' ' + taxjEsc(e.title) : ''}</div>`);
    });
    stats = `<div class="stat tone-rose"><div class="n">${(att.leaveUsage || []).filter(inMonth).length}</div><div class="label">이번 달 휴가</div></div>
      <div class="stat tone-violet"><div class="n">${(att.remoteEntries || []).filter(inMonth).length}</div><div class="label">이번 달 재택</div></div>
      <div class="stat"><div class="n">${evs.length}</div><div class="label">이번 달 일정</div></div>`;
    const startDow = new Date(yy, mm - 1, 1).getDay(), days = new Date(yy, mm, 0).getDate(), todayS = todayStr();
    let cells = '';
    for(let i = 0; i < startDow; i++) cells += '<div class="cal-day other"></div>';
    for(let d = 1; d <= days; d++){
      const ds = `${mo}-${pad2(d)}`, it = map[ds] || [];
      const chips = it.filter(h => h.startsWith('<span')), tasks = it.filter(h => !h.startsWith('<span'));
      cells += `<div class="cal-day ${ds === todayS ? 'today' : ''}">
        <div class="cal-daynum ${hol[ds] ? 'tj-hol' : ''}">${d}${hol[ds] ? `<span class="tj-holname">${taxjEsc(hol[ds])}</span>` : ''}</div>
        ${chips.length ? `<div class="tj-atts">${chips.join('')}</div>` : ''}${tasks.length ? `<div class="cal-tasks">${tasks.join('')}</div>` : ''}</div>`;
    }
    for(let i = (startDow + days) % 7; i && i < 7; i++) cells += '<div class="cal-day other"></div>';
    body = `<div class="cal-grid">${ATTEND_WEEK.map(x => `<div class="cal-dow">${x}</div>`).join('')}${cells}</div>`;
  }else{
    const rows = [];
    ATTEND_EXP_KINDS.forEach(([f, label]) => (ex[f] || []).filter(inMonth).forEach(e => rows.push({ e, label, key:'exp:' + f + ':' + (e.id || e.date + '|' + e.amount) })));
    rows.sort((a, b) => a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : 0);
    const sum = l => rows.filter(r => r.label === l).reduce((a, r) => a + (Number(r.e.amount) || 0), 0);
    const total = rows.reduce((a, r) => a + (Number(r.e.amount) || 0), 0);

/* ── [2026.10.13] 원천세 메뉴를 회사웹처럼 나눔(요청: "원천세 메뉴 분리해서 1.총괄 2.신고현황 3.일용직 4.제출") ──

function payIsReg(c){ return ['기장대행','신고대리'].includes(c.taxType) && c.status !== '해지'; }
// Tax.J filingCycleRecordsOf / filingCycleRecordAt / filingCycleRecApplicable와 같은 기준
function payCycleRecs(docs, cid){ return ((docs.s__filingCycles || {})[cid] || []).filter(r => r && r.effectiveFrom).slice().sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom)); }
function payCycleAt(docs, cid, period){ const recs = payCycleRecs(docs, cid); let cur = null; for(const r of recs){ if(r.effectiveFrom <= period) cur = r; else break; } return cur || recs[0] || null; }
function payRecApp(rec){ return !rec || rec.applicable === undefined ? true : !!rec.applicable; }
function payTarget(docs, cid, period){ return ((docs.s__filingTargets || {})[cid] || {})[period] || null; }
function payDualMonth(docs, cid, period){ const t = payTarget(docs, cid, period); return !!(t && t.marked && t.applicable && t.sameMonthPay && t.nextMonthPay); }
function payDualYear(docs, cid, year){ for(let m = 1; m <= 12; m++) if(payDualMonth(docs, cid, `${year}-${pad2(m)}`)) return true; return false; }

// payCustomCols·payCustomVals(내가 만든 항목)는 다른 저장 항목과 함께 위쪽에 선언
const PAY_COL_TYPES = [['date','날짜'], ['check','체크'], ['text','글자']];
// [2026.10.15] "항목 추가하면 위치도 조정 가능? 예: 급여명세서 전달 왼쪽"(요청) - 내 항목마다 pos(어느 칸 앞에 둘지) 저장. 없으면 맨 끝
const PAY_COL_POS = [['end','맨 끝 (메모 뒤)'], ['cycle','신고 앞'], ['payslip','급여명세서 전달 앞'], ['payroll','급여마감 앞'], ['close','신고서 마감 앞'], ['filed','신고일자 앞'], ['bill','납부서 발송 앞'], ['paid','납부마감 앞'], ['memo','메모 앞']];
function payPosKey(label){ return (PAY_COL_POS.find(x => x[1] === label) || PAY_COL_POS[0])[0]; }
function payPosLabel(key){ return (PAY_COL_POS.find(x => x[0] === (key || 'end')) || PAY_COL_POS[0])[1]; }
function payFocusMonth(docs){
  const d = new Date(); if(d.getDate() <= 10) d.setMonth(d.getMonth() - 1);
  const base = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  // [2026.10.15] "아직 마감이 안 끝났으면 날짜 기준이 아니라 신고 안 끝난 최근 월로"(요청) - 회사웹 itFocusPeriodNow(같은 날 수정)와 같게
  //   앞 귀속월에 아직 국세·지방세 신고가 다 안 끝난 대상이 있으면 그 달에 머묾. 회사 자료가 아직 없으면 앞 달
  if(!docs) return base;
  d.setMonth(d.getMonth() - 1);
  const prev = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  try{
    const list = taxjClientIndex(docs).sorted.filter(payIsReg);
    if(!list.length) return prev;
    if(payPendingCount(docs, prev) > 0) return prev;
  }catch(e){}
  return base;
}
// 그 귀속월 마감(다음 달 10일)에 내야 하는 신고 중 국세·지방세가 다 안 끝난 줄 수 - 회사웹 itFocusFiling과 같은 기준:
//   그 달 당월지급 줄 + 앞 달 익월지급 줄. 반기 거래처의 6·12월 외 달은 신고가 없어 뺌
function payPendingCount(docs, p){
  const st = docs.s__itFilingStatus || {}, [y, m] = p.split('-').map(Number);
  const pv = m === 1 ? `${y - 1}-12` : `${y}-${pad2(m - 1)}`;
  const isHalfOff = (cid, per) => { const r = payCycleAt(docs, cid, per), mm = Number(per.slice(5)); return !!r && payRecApp(r) && (r.cycle || '매월') === '반기' && mm !== 6 && mm !== 12; };
  const on = t => t && t.applicable && (t.sameMonthPay || t.nextMonthPay);
  const appAt = (cid, per) => { const recs = payCycleRecs(docs, cid); return !recs.length || (per >= recs[0].effectiveFrom && payRecApp(payCycleAt(docs, cid, per))); };
  const filed = (per, cid, k) => { const v = ((st[per] || {})[cid] || {})[k] || {}; return !!(v.national && v.local); };
  let n = 0;
  taxjClientIndex(docs).sorted.filter(payIsReg).forEach(c => {
    const t = payTarget(docs, c.id, p);
    if(on(t) && t.sameMonthPay && appAt(c.id, p) && !isHalfOff(c.id, p) && !filed(p, c.id, 'sameMonth')) n++;
    const tp = payTarget(docs, c.id, pv);
    if(on(tp) && tp.nextMonthPay && appAt(c.id, pv) && !isHalfOff(c.id, pv) && !filed(pv, c.id, 'nextMonth')) n++;
  });
  return n;
}   // Tax.J itFocusPeriodNow와 같음(10일까지는 지난달 귀속)
function payShiftMonth(n){ const [y, m] = payMonth.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); payMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; payPicked = new Set(); renderPay(); }
async function addPayCustomCol(){

function setPayCustomVal(key, colId, value){

function payDatePop(btn){

// ── 3. 일용직 ── (Tax.J dwInEmploy / dwSuggest와 같은 기준)
function dwYmS(y, m){ return `${y}-${pad2(m)}`; }
function dwPrevYmS(ym, k){ let y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7)) - (k || 1); while(m < 1){ m += 12; y--; } return dwYmS(y, m); }
function dwInEmployS(w, ym){
  const j = (w.joinDate || '').slice(0,7), l = (w.leaveDate || '').slice(0,7);
  if((!j || ym >= j) && (!l || ym <= l)) return true;
  return (w.periods || []).some(pp => { const pj = (pp.join || '').slice(0,7), pl = (pp.leave || '').slice(0,7); return (!pj || ym >= pj) && (!pl || ym <= pl); });
}
function dwSuggestS(w, ym){
  const mo = w.months || {}, st = k => (mo[k] || {}).state || '', earned = k => Number((mo[k] || {}).earned) || 0;
  if(!earned(ym) && st(dwPrevYmS(ym,1)) !== 'skip') return null;
  if(st(dwPrevYmS(ym,1)) === 'filed' && st(dwPrevYmS(ym,2)) === 'filed') return earned(ym) ? { state:'skip' } : null;
  let carry = 0, k = dwPrevYmS(ym,1), n = 0;
  while(n < 12 && st(k) !== 'filed' && dwInEmployS(w, k)){ if(st(k) === 'skip' || (!st(k) && earned(k))) carry += earned(k); k = dwPrevYmS(k,1); n++; }
  const amt = earned(ym) + carry;
  return amt ? { state:'filed', amount: amt, merged: carry > 0 } : null;
}
function payDailyHtml(docs){
  const idx = taxjClientIndex(docs);
  const all = Object.values(docs.s__dailyWorkers || {}).filter(w => w && !w.deleted);
  const nowY = String(new Date().getFullYear());
  const years = new Set([nowY]);
  all.forEach(w => Object.keys(w.months || {}).forEach(ym => years.add(ym.slice(0,4))));
  if(!dwYear) dwYear = nowY;
  years.add(dwYear);
  const year = dwYear;
  const cname = id => (idx.byId[id] || {}).name || (all.find(w => w.clientId === id) || {}).clientName || '(거래처 없음)';
  let list = all.filter(w => Array.from({ length:12 }, (_, i) => dwYmS(year, i + 1)).some(ym => dwInEmployS(w, ym)));
  const ids = [...new Set(list.map(w => w.clientId))].sort((a, b) => cname(a).localeCompare(cname(b), 'ko'));
  if(dwClient && !ids.includes(dwClient)) dwClient = '';
  const ctrl = `<div class="toolbar" style="justify-content:center;">
      <select onchange="dwYear=this.value; renderPay();">${[...years].sort().reverse().map(y => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}년 귀속</option>`).join('')}</select>
      <select onchange="dwClient=this.value; renderPay();" ${ids.length ? '' : 'style="visibility:hidden;"'}><option value="">거래처 선택</option>${ids.map(id => `<option value="${escapeAttr(id)}" ${id === dwClient ? 'selected' : ''}>${taxjEsc(cname(id))}</option>`).join('')}</select>
    </div>`;
  if(!dwClient) return ctrl + `<div class="empty">${list.length ? '위에서 거래처를 선택해 주세요.' : `${year}년에 등록된 일용직이 없어요.`}</div>`;
  list = list.filter(w => w.clientId === dwClient).sort((a, b) => ((a.leaveDate ? 1 : 0) - (b.leaveDate ? 1 : 0)) || (a.leaveDate || '').localeCompare(b.leaveDate || '') || (a.joinDate || '').localeCompare(b.joinDate || '') || (a.name || '').localeCompare(b.name || '', 'ko'));
  const leftN = list.filter(w => w.leaveDate).length;
  if(!dwShowLeft) list = list.filter(w => !w.leaveDate);
  const focus = payFocusMonth(docs);
  const fbg = m => dwYmS(year, m) === focus ? 'background:#fff7e6;' : '';
  const nf = v => (v === null || v === undefined || v === '') ? '' : Number(v).toLocaleString();
  const dup = w => list.some(x => x.id !== w.id && String(x.name || '').trim() === String(w.name || '').trim());
  const rows = list.map(w => {
    const mo = w.months || {}, off = w.leaveDate ? ' style="opacity:.5;"' : '';
    const tip = [['생년월일', w.birth || '-'], ['입사일', w.joinDate || '-'], ['퇴사일', w.leaveDate || '-']].concat((w.periods || []).map((pp, i) => [`이전 근무${w.periods.length > 1 ? ' ' + (i + 1) : ''}`, `${pp.join || '?'} ~ ${pp.leave || '?'}`])).map(([a, b]) => `${a}: ${b}`).join('\n');
    const earned = Array.from({ length:12 }, (_, i) => { const ym = dwYmS(year, i + 1); if(!dwInEmployS(w, ym)) return `<td style="background:#f6f1f4;"></td>`; const e = mo[ym] || {};
      return `<td style="text-align:right;${fbg(i + 1)}${e.state === 'filed' && Number(e.reported) > 0 ? ' color:var(--muted);' : ''}">${nf(e.earned)}</td>`; }).join('');
    const rep = Array.from({ length:12 }, (_, i) => { const ym = dwYmS(year, i + 1); if(!dwInEmployS(w, ym)) return `<td style="background:#f6f1f4;"></td>`; const e = mo[ym] || {};
      let h = '';
      if(e.state === 'skip') h = '<span style="color:#b45309; font-weight:700;">미신고</span>';
      else if(e.state === 'filed') h = `${(mo[dwPrevYmS(ym,1)] || {}).state === 'skip' ? '<span class="hint" style="margin:0; font-weight:700;">합산</span> ' : ''}<b>${nf(e.reported)}</b>`;
      else { const sg = dwSuggestS(w, ym); if(sg) h = `<span style="color:#c9b8c1;" title="제안(아직 확정 안 됨)">${sg.state === 'skip' ? '미신고' : (sg.merged ? '합산 ' : '') + nf(sg.amount)}</span>`; }
      return `<td style="text-align:right;${fbg(i + 1)}">${h}</td>`; }).join('');
    return `<tr${off}><td rowspan="2" style="font-weight:700; white-space:nowrap;" title="${escapeAttr(tip)}">${taxjEsc(w.name || '')}${dup(w) && w.birth ? ` <span class="hint" style="margin:0;">${taxjEsc(w.birth)}</span>` : ''}</td><td class="hint" style="margin:0;">발생</td>${earned}</tr>
      <tr${off}><td class="hint" style="margin:0;">신고</td>${rep}</tr>`;
  }).join('');
  return ctrl + `<div class="table-scroll" style="margin-top:12px;"><table><thead><tr><th>이름</th><th></th>${Array.from({ length:12 }, (_, i) => `<th style="${fbg(i + 1)}">${i + 1}월</th>`).join('')}</tr></thead>
    <tbody>${rows || `<tr><td colspan="14"><div class="empty" style="padding:18px;">재직 중인 일용직이 없어요.</div></td></tr>`}${leftN ? `<tr><td colspan="14" style="text-align:center;"><button class="btn ghost xs" onclick="dwShowLeft=!dwShowLeft; renderPay();">${dwShowLeft ? '퇴사자 접기 ▴' : `퇴사자 ${leftN}명 보기 ▾`}</button></td></tr>` : ''}</tbody></table></div>`;
}

function renderPay(){

const INNER_TAX_ANNUAL = [
  { id:'vat2-final', month:1, day:25, title:'부가가치세 2기 확정신고·납부' }, { id:'exempt-biz-status', month:2, day:10, title:'면세사업자 사업장현황신고' },

  { id:'income-tax-sincere', month:6, day:30, title:'종합소득세 신고(성실신고확인대상자)' }, { id:'vat1-final', month:7, day:25, title:'부가가치세 1기 확정신고·납부' },
  { id:'corp-tax-midterm', month:8, day:31, title:'법인세 중간예납' }, { id:'vat2-prelim', month:10, day:25, title:'부가가치세 2기 예정신고·납부(법인)' },
  { id:'income-tax-midterm', month:11, day:30, title:'종합소득세 중간예납' },
];
const INNER_TAX_MONTHLY = { id:'withholding-monthly', day:10, title:'원천세·4대보험료 신고·납부(전월분)' };
function innerBizDay(docs, ds){
  const hol = new Set((docs.s__exclusionDays || []).filter(x => x && x.reason === '공휴일').map(x => x.date));
  const d = new Date(ds + 'T00:00:00');
  for(let i = 0; i < 10; i++){ const s = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; if(d.getDay() !== 0 && d.getDay() !== 6 && !hol.has(s)) return s; d.setDate(d.getDate() + 1); }
  return ds;
}
function innerTaxMonth(docs, y, m){
  const ov = docs.s__taxScheduleOverrides || {}, mm = pad2(m), key = id => `${id}:${y}-${mm}`, last = new Date(y, m, 0).getDate();
  const out = [INNER_TAX_MONTHLY].concat(INNER_TAX_ANNUAL.filter(r => r.month === m)).map(it => {
    const raw = `${y}-${mm}-${pad2(it.day)}`, o = ov[key(it.id)];
    let title = it.title;
    if(it.id === INNER_TAX_MONTHLY.id){ const ay = m === 1 ? y - 1 : y, am = m === 1 ? 12 : m - 1; title = title.replace('(전월분)', `(${String(ay).slice(2)}년 ${pad2(am)}월 귀속)`); }
    const date = o || innerBizDay(docs, raw);
    return { title, date, shifted: !o && date !== raw, overridden: !!o, custom:false };
  });
  (docs.s__taxScheduleCustomItems || []).forEach(it => {
    let raw = null, shift = false;
    if(it.recurrence === 'once'){ if(it.date && it.date.slice(0,7) === `${y}-${mm}`) raw = it.date; }
    else if(it.recurrence === 'monthly'){ raw = `${y}-${mm}-${pad2(Math.min(it.day, last))}`; shift = true; }
    else if(it.recurrence === 'annual' && it.month === m){ raw = `${y}-${mm}-${pad2(Math.min(it.day, last))}`; shift = true; }
    if(!raw) return;
    const o = ov[key('custom:' + it.id)], date = o || (shift ? innerBizDay(docs, raw) : raw);
    out.push({ title: it.title, date, shifted: !o && shift && date !== raw, overridden: !!o, custom:true });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

}

function setTaxjFullView(v){ taxjFullView = v; if(activeTab !== 'taxj') switchTab('taxj'); else renderTaxjFull(); }

function taxjIsLocked(v){ return v && typeof v === 'object' && !Array.isArray(v) && typeof v.iv === 'string' && typeof v.data === 'string' && Object.keys(v).length <= 3; }
function taxjKo(k){ return TAXJ_KEY_KO[k] ? `${TAXJ_KEY_KO[k]}` : k; }
// 값의 모양에 맞춰 그림: 객체 배열 → 표, 객체 → 펼치는 목록, 나머지 → 글자
function taxjValHtml(v, depth){

  if(Array.isArray(v)){
    if(!v.length) return '<span class="hint" style="margin:0;">(비어 있음)</span>';
    if(v.every(x => x && typeof x === 'object' && !Array.isArray(x) && !taxjIsLocked(x))){
      const cols = []; v.forEach(x => Object.keys(x).forEach(k => { if(!cols.includes(k) && k !== 'history') cols.push(k); }));

      return `<div class="table-scroll"><table><thead><tr>${show.map(c => `<th>${taxjEsc(taxjKo(c))}</th>`).join('')}</tr></thead>

    }
    return `<ul style="margin:0; padding-left:18px;">${v.slice(0, 500).map(x => `<li>${taxjValHtml(x, depth + 1)}</li>`).join('')}</ul>`;
  }
  const keys = Object.keys(v);
  if(!keys.length) return '<span class="hint" style="margin:0;">(비어 있음)</span>';
  if(keys.every(k => v[k] == null || typeof v[k] !== 'object' || taxjIsLocked(v[k])))
    return `<div style="display:grid; grid-template-columns:max-content 1fr; gap:2px 12px; font-size:13px;">${keys.map(k => `<div style="color:var(--muted);">${taxjEsc(taxjKo(k))}</div><div>${taxjValHtml(v[k], depth + 1)}</div>`).join('')}</div>`;
  return keys.map(k => `<details style="margin:4px 0 4px ${depth ? 8 : 0}px;" ${keys.length === 1 ? 'open' : ''}><summary style="cursor:pointer; font-weight:700;">${taxjEsc(taxjKo(k))} <span class="hint" style="margin:0; font-weight:500;">${taxjSizeTxt(v[k])}</span></summary><div style="margin:6px 0 0 12px;">${taxjValHtml(v[k], depth + 1)}</div></details>`).join('');
}
function taxjCellHtml(v, depth){

function taxjSizeTxt(v){
  if(Array.isArray(v)) return `${v.length}건`;

    <div style="margin-top:10px;">${empty ? '<div class="empty">Tax.J에 저장된 내용이 없어요.</div>' : taxjValHtml(value, 0)}</div>

}

// ── [2026.10.08] Tax.J › 신고 진행 현황을 보기 좋게 정리(요청: "보기좋게 정리해도 좋아") ──
// 저장해 둔 Tax.J 자료(taxjFull)를 Tax.J 화면과 같은 기준으로 표로 보여줌. 자료 구조는 Tax.J index.html의 shared* 변수 주석과 같음.
let taxjFilingSub = 'itReview';     // [2026.10.13] 원천세 진행·총괄은 원천세 메뉴로 옮겨서 뺌(요청) · it(원천세 진행) | itReview(원천세 검토) | itOverview(원천세 총괄) | vat(부가세) | pl(손익보고서) | raw(원본 자료)
let taxjFilingMonth = '', taxjFilingYear = '';
const TAXJ_IT_STAGES_FULL = [['payslip','급여명세서 전달'], ['payroll','급여마감'], ['returnClose','원천세 신고서 마감'], ['returnCloseLocal','지방세 신고서 마감'], ['national','원천세 신고'], ['local','지방세 신고']];
const TAXJ_FILING_SUBS = [['itReview','원천세 검토'], ['vat','부가세'], ['pl','손익보고서'], ['raw','원본 자료']];

const TAXJ_REVIEW_SKIP_INCOME = new Set(['근로미제출비과세','중도미제출비과세']);
const TAXJ_REVIEW_SKIP_TAX = new Set(['연말','중도']);
function setTaxjFilingSub(v){ taxjFilingSub = v; renderTaxjFull(); }
function setTaxjFilingMonth(v){ if(v) taxjFilingMonth = v; renderTaxjFull(); }
function setTaxjFilingYear(v){ if(v) taxjFilingYear = String(v); renderTaxjFull(); }
// Tax.J 거래처: id → 거래처, 순서는 Tax.J와 같게(법인 → 개인, 기장대행 → 신고대리 → 그 외, 그다음 등록 순)
function taxjClientIndex(docs){
  const list = ((docs.s__clients || {}).list || []).filter(c => c && c.id);
  const w1 = c => c.entityType === '법인' ? 0 : c.entityType === '개인' ? 1 : 2;
  const w2 = c => c.taxType === '기장대행' ? 0 : c.taxType === '신고대리' ? 1 : 2;
  const sorted = list.map((c, i) => ({ c, i })).sort((a, b) => (w1(a.c) - w1(b.c)) || (w2(a.c) - w2(b.c)) || (a.i - b.i)).map(x => x.c);
  const byId = {}; sorted.forEach((c, i) => { byId[c.id] = Object.assign({ _order: i }, c); });
  return { byId, sorted };
}
function taxjClientName(idx, key){
  const id = String(key).split('@')[0];
  const c = idx.byId[id];
  return (c ? c.name : '(삭제된 거래처)') + (String(key).endsWith('@nextMonth') ? ' <span class="hint" style="margin:0; color:#be123c; font-weight:700;">익월</span>' : '');
}
function taxjOrderKeys(idx, keys){
  return keys.slice().sort((a, b) => { const ca = idx.byId[String(a).split('@')[0]], cb = idx.byId[String(b).split('@')[0]];
    return (ca ? ca._order : 1e9) - (cb ? cb._order : 1e9) || String(a).localeCompare(String(b)); });
}
function taxjMoney(v){ if(v === '' || v == null || isNaN(Number(v))) return '<span style="color:#d4c6cd;">-</span>'; return Number(v).toLocaleString(); }
function taxjMd(v){ return v ? taxjEsc(String(v).slice(5).replace('-', '/')) : '<span style="color:#d4c6cd;">-</span>'; }
// 거래처의 그 달 신고구분(매월/반기): 신고구분 이력에서 그 달 이전 가장 최근 것
function taxjCycleAt(docs, cid, period){
  const hist = ((docs.s__filingCycles || {})[cid] || []).filter(h => h && h.effectiveFrom && h.effectiveFrom <= period).sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
  return hist.length ? hist[hist.length - 1].cycle : '';
}
function taxjYearSelectHtml(years){

}
function taxjTable(head, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="table-scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function taxjFilingHtml(docs){
  const idx = taxjClientIndex(docs);

  const subBar = `<div class="cl-subtabs" style="margin-bottom:12px;">${TAXJ_FILING_SUBS.map(([k, l]) => `<button class="cl-subtab ${taxjFilingSub === k ? 'on' : ''}" onclick="setTaxjFilingSub('${k}')">${l}</button>`).join('')}</div>`;

          <td><span style="font-weight:700; color:${k === 'sameMonth' ? '#047857' : '#be123c'};">${k === 'sameMonth' ? '당월' : '익월'}</span></td>

    const y = taxjFilingYear;

    const rows = keys.map((k, i) => {

    ctrl = `<span class="hint" style="margin:0;">거래처별로 한 번 정해두고 계속 쓰는 원천세 업무 정보 · ${ids.length}곳</span>`;
    body = taxjTable(['순번','상호명','급여종류','신고 지급일','실 급여일','급여소통','급여명세서 전달','납부서 전달','사업장관리번호(일반)','사업장관리번호(특고 등)','EDI','비고'], rows, 'Tax.J 원천세 총괄에 입력된 내용이 없어요.');
  }else if(taxjFilingSub === 'vat'){
    // 부가세: 거래처 × 4기수, 칸마다 신고대상 상태 + 검토표 신고상태·납부세액
    const tg = docs.s__vatFilingTargets || {}, rf = docs.s__vatReviewFigures || {};
    ctrl = taxjYearSelectHtml(Array.from(new Set([tg, rf].flatMap(o => Object.values(o).flatMap(x => Object.keys(x || {})))))) + '<span class="hint" style="margin:0;">칸마다 신고대상 · 신고상태 · 납부세액</span>';
    const y = taxjFilingYear;
    const ids = taxjOrderKeys(idx, Array.from(new Set(Object.keys(tg).filter(c => (tg[c] || {})[y]).concat(Object.keys(rf).filter(c => (rf[c] || {})[y])))));
    const rows = ids.map((cid, i) => {
      const c = idx.byId[cid] || {};
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, cid)}</td><td>${taxjEsc(c.entityType || '')}</td>${TAXJ_VAT_PERIODS.map(per => {
        const e = ((tg[cid] || {})[y] || {})[per] || {};
        const s = per.endsWith('예정') ? (e.status || (e.applicable ? 'filing' : e.expectedNotice ? 'notice' : c.entityType === '개인' ? 'notice' : 'not-target')) : (e.applicable === false ? 'not-target' : 'target');
        const r = ((rf[cid] || {})[y] || {})[per] || {};
        const off = s === 'not-target';
        return `<td style="font-size:12px; line-height:1.5;${off ? ' color:var(--muted);' : ''}"><b>${TAXJ_VAT_LABEL[s] || s}</b>${r.filingStatus ? `<br>${taxjEsc(r.filingStatus)}` : ''}${r.taxPay != null && r.taxPay !== '' ? `<br>${taxjMoney(r.taxPay)}` : ''}${(e.send && (e.send.notice || e.send.bill)) ? `<br><span class="hint" style="margin:0;">발송 ${taxjMd(e.send.notice || e.send.bill)}</span>` : ''}</td>`;
      }).join('')}</tr>`;
    });
    body = taxjTable(['순번','상호명','구분'].concat(TAXJ_VAT_PERIODS), rows, `${y}년 부가세 신고대상·검토 자료가 없어요.`);
  }else if(taxjFilingSub === 'pl'){
    const pl = docs.s__profitLossReports || {};
    ctrl = taxjYearSelectHtml(Array.from(new Set(Object.values(pl).flatMap(o => Object.keys(o || {})))));
    const y = taxjFilingYear;
    const ids = taxjOrderKeys(idx, Object.keys(pl).filter(c => (pl[c] || {})[y]));
    const F = [['revenue','매출액'], ['cogs','매출원가'], ['sga','판관비'], ['otherIncome','영업외수익'], ['otherExpense','영업외비용']];
    const rows = ids.map((cid, i) => { const e = pl[cid][y] || {};
      const profit = ['revenue','otherIncome'].reduce((s, k) => s + (Number(e[k]) || 0), 0) - ['cogs','sga','otherExpense'].reduce((s, k) => s + (Number(e[k]) || 0), 0);
      return `<tr><td class="tx-seq">${i + 1}</td><td class="tx-name">${taxjClientName(idx, cid)}</td><td>${taxjEsc(e.entityKind || '')}</td>${F.map(([k]) => `<td style="text-align:right;">${taxjMoney(e[k])}</td>`).join('')}<td style="text-align:right; font-weight:700;">${profit.toLocaleString()}</td><td style="text-align:left; white-space:pre-wrap;">${taxjEsc(e.memo || '')}</td></tr>`; });
    body = taxjTable(['순번','상호명','세목'].concat(F.map(([, l]) => l)).concat(['당기순이익(계산)','메모']), rows, `${y}년 손익보고서가 없어요.`);
  }else{
    return subBar + TAXJ_FULL_GROUPS[0].keys.map(([k, label]) => taxjSectionHtml(label, docs['s__' + k])).join('');
  }
  return subBar + `<div class="card"><div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">${ctrl}</div>${body}</div>`;

// ── [2026.10.08] 홈·Month 달력에 회사(Tax.J) 공휴일·제외일정과 '내 근태'(휴가·재택) 표시(요청: "둘 다 넣고, 내 근태만") ──
// 저장해 둔 Tax.J 자료(taxjFull)에서 읽음: 공용 제외일(s__exclusionDays: 공휴일/회식 등) + 로그인한 회사 계정과 이메일이 같은 직원의
// attendance.leaveUsage(휴가)·remoteEntries(재택). 회사웹에서 근태를 바꾸면 Tax.J 메뉴에서 '새로고침'해야 달력에도 반영됨
function taxjCalMarks(){
  let full = null;
  try{ full = taxjFull; if(!taxjFullRestoreTried) taxjRestoreFull(); }catch(e){ return null; }   // 첫 화면에서 아직 선언 전이면 건너뜀
  if(!full || !full.docs) return null;
  if(taxjCalMarks.cache && taxjCalMarks.cache.at === full.at) return taxjCalMarks.cache.map;
  const docs = full.docs, map = {};
  const add = (d, k, v) => { if(!d) return; const o = map[d] = map[d] || { hol:'', items:[] }; if(k === 'hol') o.hol = o.hol || v; else o.items.push(v); };
  (Array.isArray(docs.s__exclusionDays) ? docs.s__exclusionDays : []).forEach(x => {
    if(!x || !x.date || x.deleted) return;
    if(x.reason === '공휴일') add(x.date, 'hol', x.name || '공휴일');
    else add(x.date, 'item', { cls:'etc', label: x.name || x.reason || '제외일', title: [x.reason, x.name].filter(Boolean).join(' · ') });
  });
  const me = (docs.profiles || []).find(p => p && String(p.email || '').toLowerCase() === String(full.email || '').toLowerCase());
  const att = me ? ((docs['data__' + me.id] || {}).attendance || {}) : {};
  (att.leaveUsage || []).forEach(u => { if(u && u.date && !u.deleted) add(u.date, 'item', { cls:'leave', label: u.type || '휴가', title: [u.type, u.subtype, u.memo].filter(Boolean).join(' · ') }); });
  (att.remoteEntries || []).forEach(r => { if(r && r.date && !r.deleted) add(r.date, 'item', { cls:'remote', label: r.bonus ? '특별재택' : r.half === 'am' ? '오전재택' : r.half === 'pm' ? '오후재택' : '재택', title: [r.bonus ? '특별재택' : r.half ? '반일재택' : '정기재택', r.memo].filter(Boolean).join(' · ') }); });
  taxjCalMarks.cache = { at: full.at, map };
  return map;
}

function taxjUsageTableHtml(rep){
  const people = ((rep && rep.people) || []).filter(p=> p.status !== '퇴사');
  const notifTxt = { granted:'허용', denied:'차단', default:'안 정함', unsupported:'미지원' };
  const rows = people.map(p=>{
    const online = (p.presence||[]).filter(x=> x.online);
    const last = Math.max(0, ...(p.presence||[]).map(x=> Math.max(x.at||0, x.lastAt||0)));
    const nowTxt = online.length ? `<b style="color:var(--ok, #16a34a);">접속 중</b><div class="hint" style="margin:0;">${online.map(x=> taxjEsc((x.device||'기기') + (x.screen ? ' · ' + x.screen : ''))).join('<br>')}</div>` : `<span class="hint" style="margin:0;">마지막 ${taxjWhen(last)}</span>`;
    const devs = (p.devices||[]).map(d=> `${taxjEsc(d.dev || (d.mob ? '휴대폰' : '기기'))} <span class="hint" style="margin:0;">알림 ${taxjEsc(notifTxt[d.notif] || '-')} · ${taxjWhen(d.at)}</span>`).join('<br>') || '<span class="hint" style="margin:0;">기록 없음</span>';
    const clk = (p.clock||[]).slice(0,7).map(c=> `${c.date.slice(5).replace('-','/')} ${c.checkIn ? (c.checkIn === 'done' ? '출근✓' : c.checkIn === 'leave' ? '휴가' : '출근알림') : ''}${c.checkIn && c.checkOut ? ' · ' : ''}${c.checkOut ? (c.checkOut === 'done' ? '퇴근✓' : c.checkOut === 'leave' ? '휴가' : '퇴근알림') : ''}`).join('<br>') || '-';
    return `<tr><td style="white-space:nowrap;"><b>${taxjEsc(p.name)}</b>${p.position ? `<div class="hint" style="margin:0;">${taxjEsc(p.position)}</div>` : ''}</td><td>${nowTxt}</td><td>${devs}</td><td style="white-space:nowrap;">${p.clockReminder ? '켬' : '끔'}</td><td style="white-space:nowrap; font-size:12px;">${clk}</td></tr>`;
  }).join('');
  return `<div class="hint" style="margin-bottom:6px;">${taxjWhen(rep && rep.at)} 기준</div>
    <div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:12.5px;">
      <thead><tr>${['직원','지금','기기 · 알림','출퇴근 알림','최근 출퇴근 알림(7일)'].map(h=>`<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line, #eee); white-space:nowrap;">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.replace(/<td/g, '<td style="padding:6px 8px; border-bottom:1px solid var(--line, #f1f1f1); vertical-align:top;"').replace(/<td style="padding:6px 8px; border-bottom:1px solid var\(--line, #f1f1f1\); vertical-align:top;" style="/g, '<td style="padding:6px 8px; border-bottom:1px solid var(--line, #f1f1f1); vertical-align:top; ')}</tbody>
    </table></div>`;
}

let manualCat = '', manualSel = null, manualSearch = '';
function setManualCat(c){ manualCat = c || ''; manualSel = null; if(activeTab !== 'manuals') switchTab('manuals'); else renderManuals(); }
function manualBodyHtml(t){
  const inline = x => taxjEsc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null;
  const close = () => { if(list){ out.push(`</${list}>`); list = null; } };
  String(t || '').split('\n').forEach(line => {
    let m;
    if((m = /^\s*#{1,3}\s+(.*)$/.exec(line))){ close(); out.push(`<div class="mn-h">${inline(m[1])}</div>`); }
    else if((m = /^\s*[-•·]\s+(.*)$/.exec(line))){ if(list !== 'ul'){ close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))){ if(list !== 'ol'){ close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if(!line.trim()){ close(); out.push('<div class="mn-gap"></div>'); }
    else { close(); out.push(`<div>${inline(line)}</div>`); }
  });
  close();
  return out.join('');
}
function manualFields(x){
  x = x || {};
  const cats = manualCats.length ? manualCats : ['미분류'];
  return [
    { label:'분야', options: cats, value: x.cat || manualCat || cats[0] },
    { label:'제목', value:x.title || '', placeholder:'예: 원천세 반기 신고 순서' },
    { label:'참고 사이트 (한 줄에 하나 · "이름 | 주소" 또는 주소만)', type:'textarea', value:(x.refs || []).map(r => r.name && r.name !== r.url ? `${r.name} | ${r.url}` : r.url).join('\n'), rows:3, placeholder:'홈택스 | hometax.go.kr\nhttps://www.wehago.com' },
    { label:'내용 (# 제목, - 목록, 1. 순서, **굵게** · Enter 줄바꿈, Ctrl+Enter 저장)', type:'textarea', value:x.body || '', rows:16, placeholder:'# 준비물\n- 급여대장\n- 지급명세서\n\n# 순서\n1. 홈택스 로그인\n2. 원천세 신고 메뉴' },

}
// 참고 사이트 칸: 한 줄에 하나, "이름 | 주소" 또는 주소만
function manualParseRefs(t){
  return String(t || '').split('\n').map(x => x.trim()).filter(Boolean).map(x => {
    const i = x.lastIndexOf('|');
    const name = i >= 0 ? x.slice(0, i).trim() : '', url = (i >= 0 ? x.slice(i + 1) : x).trim();
    return url ? { name: name || url.replace(/^https?:\/\//, '').replace(/\/$/, ''), url } : null;
  }).filter(Boolean);
}
async function manualAdd(){
  const r = await smForm('매뉴얼 추가', manualFields(), { okText:'추가', wide:true });

  manuals.push(m); manualSel = m.id; manualCat = manualCat && manualCat !== m.cat ? m.cat : manualCat;
  renderAll();
}
async function manualEdit(id){
  const m = manuals.find(x => x.id === id);
  if(!m) return;
  const r = await smForm('매뉴얼 수정', manualFields(m), { okText:'저장', icon:'✎', wide:true });

  if(r[0] === m.cat && r[1].trim() === m.title && (r[3] || '') === m.body && JSON.stringify(refs) === JSON.stringify(m.refs || [])) return;
  (m.history = m.history || []).unshift({ at: m.at, cat: m.cat, title: m.title, body: m.body, refs: m.refs || [] });
  if(m.history.length > 20) m.history.length = 20;   // 예전 내용은 최근 20번까지만 보관
  Object.assign(m, { cat: r[0], title: r[1].trim(), refs, body: r[3] || '', at: new Date().toISOString() });

}
async function manualDelete(id){

}
// 분야 관리: 한 줄에 하나씩. 줄 수가 같으면 같은 자리끼리 이름을 바꾼 것으로 보고, 없어진 분야의 매뉴얼은 '미분류'로 옮김
async function manualEditCats(){
  const r = await smForm('분야 관리', [{ label:'분야 (한 줄에 하나 · 위아래 순서대로 메뉴에 나와요)', type:'textarea', value: manualCats.join('\n'), rows:8 }], { okText:'저장', icon:'✎' });
  if(!r) return;
  const next = Array.from(new Set(String(r[0] || '').split('\n').map(x => x.trim()).filter(Boolean)));
  if(!next.length){ smAlert('분야를 하나 이상 남겨 주세요'); return; }
  const old = manualCats.slice();
  if(next.length === old.length) manuals.forEach(m => { const i = old.indexOf(m.cat); if(i >= 0) m.cat = next[i]; });
  const orphan = manuals.filter(m => !next.includes(m.cat));
  if(orphan.length){
    if(!(await smConfirm('없어지는 분야가 있어요', `매뉴얼 ${orphan.length}개는 '미분류'로 옮겨져요.`, { okText:'저장' }))) return;
    orphan.forEach(m => { m.cat = '미분류'; });
    if(!next.includes('미분류')) next.push('미분류');
  }
  if(manualCat && !next.includes(manualCat)) manualCat = '';
  manualCats = next;
  renderAll();
  renderNav();   // 왼쪽 메뉴의 분야 하위메뉴도 바로 바꿈
}

  el.innerHTML = `

            : `<div class="empty">${manuals.length ? (q ? '검색과 맞는 매뉴얼이 없어요.' : '이 분야에는 아직 매뉴얼이 없어요.') : "아직 매뉴얼이 없어요. '매뉴얼 추가'로 정리해 보세요."}</div>`}
        </div>
        <div class="mn-view">
          ${sel ? `
            <div class="mn-view-head">
              <div><div class="mn-view-cat">${taxjEsc(sel.cat)}</div><div class="mn-view-title">${taxjEsc(sel.title)}</div><div class="hint" style="margin:2px 0 0;">마지막 수정 ${when(sel.at)}</div></div>

                <button class="icon-btn" onclick="manualEdit(${sel.id})" title="수정" aria-label="수정">${ICON_EDIT}</button>

            <div class="mn-body">${sel.body.trim() ? manualBodyHtml(sel.body) : '<div class="hint">내용이 비어 있어요. 연필 아이콘으로 적어 주세요.</div>'}</div>`

// ===== 링크: 자주 쓰는 사이트 모음 =====
// 요청 배경(2026.10.08): "대메뉴에 링크 하나 - 자주 쓰는 사이트 주소·사이트명·메모로 관리". 분류(선택)로 묶어 보여주고, 이름을 누르면 새 창으로 열림.
// 저장은 다른 자료와 같이 Google 시트(data 탭의 links)·이 기기. 비밀번호는 넣지 않음(계정 메뉴 보관함 사용)
let linkSearch = '';
// [2026.10.08] 링크마다 첨부파일(요청) - 파일은 내 Google 드라이브의 'SM_첨부파일' 폴더에 올리고, 링크에는 {id, name, url}만 저장(시트가 무거워지지 않게).
// 누르면 드라이브에서 열림. 첨부를 빼면 드라이브 파일은 휴지통으로(30일 안에 되살릴 수 있음)
const SM_ATTACH_FOLDER = 'SM_첨부파일';
let smAttachFolderId = null;
async function smDriveFetch(url, opt){
  if(!googleAccessToken) throw new Error('Google에 연결된 뒤에 할 수 있어요. 위쪽 "Google 연결하고 불러오기"를 먼저 눌러 주세요.');
  const res = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + googleAccessToken }, (opt && opt.headers) || {}) }));
  if(!res.ok){ const t = await res.text().catch(() => ''); throw new Error(`드라이브 응답 ${res.status} ${t.slice(0, 120)}`); }
  return res.status === 204 ? null : res.json();
}
async function smAttachFolder(){
  if(smAttachFolderId) return smAttachFolderId;
  const q = encodeURIComponent(`name='${SM_ATTACH_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await smDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  if(r.files && r.files.length) return (smAttachFolderId = r.files[0].id);
  const c = await smDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ name: SM_ATTACH_FOLDER, mimeType:'application/vnd.google-apps.folder' }) });
  return (smAttachFolderId = c.id);
}
async function smDriveUpload(file){
  const folder = await smAttachFolder();
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify({ name: file.name, parents: [folder] })], { type:'application/json' }));
  fd.append('file', file);
  const r = await smDriveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,size', { method:'POST', body: fd });
  return { id: r.id, name: r.name || file.name, url: r.webViewLink || `https://drive.google.com/file/d/${r.id}/view`, size: Number(r.size) || file.size || 0 };
}
async function smDriveTrash(id){
  try{ await smDriveFetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ trashed:true }) }); }catch(e){ console.warn('첨부 휴지통 이동 실패', e); }
}
let linkUploadTarget = null;
function linkPickFiles(id){ linkUploadTarget = id; const inp = document.getElementById('linkFileInput'); if(inp){ inp.value = ''; inp.click(); } }
async function linkUploadFiles(input){
  const x = links.find(l => l.id === linkUploadTarget);
  const files = Array.from((input && input.files) || []);
  if(!x || !files.length) return;
  const big = files.find(f => f.size > 50 * 1024 * 1024);
  if(big){ smAlert('파일이 너무 커요', `${big.name}: 50MB 이하만 올릴 수 있어요.`); return; }
  x._uploading = files.length; renderLinks();
  try{
    for(const f of files){ (x.files = x.files || []).push(await smDriveUpload(f)); }
    x.at = todayStr();
  }catch(e){ console.error(e); smAlert('첨부하지 못했어요', String(e && e.message || e), { tone:'danger' }); }
  finally{ delete x._uploading; renderAll(); }
}
async function linkRemoveFile(id, fid){
  const x = links.find(l => l.id === id);
  const f = x && (x.files || []).find(a => a.id === fid);
  if(!f || !(await smConfirm('첨부파일을 뺄까요?', `${f.name}\n드라이브에서는 휴지통으로 옮겨져요(30일 안에 되살릴 수 있어요).`, { tone:'danger', icon:'!', okText:'빼기' }))) return;
  x.files = x.files.filter(a => a.id !== fid);
  renderAll();
  smDriveTrash(fid);
}
function smFilesHtml(files, removeJs){
  return (files || []).map(f => `<span class="att-chip"><a href="${escapeAttr(f.url)}" target="_blank" rel="noopener" title="드라이브에서 열기">📎 ${taxjEsc(f.name)}</a>${removeJs ? `<button onclick="${removeJs(f)}" title="첨부 빼기" aria-label="첨부 빼기">×</button>` : ''}</span>`).join('');
}
function linkHref(u){ u = String(u || '').trim(); if(!u) return ''; return /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u; }
function linkFields(x){
  x = x || {};
  return [
    { label:'사이트명', value:x.name || '', placeholder:'예: 홈택스' },
    { label:'주소', value:x.url || '', placeholder:'예: hometax.go.kr' },
    { label:'분류 (선택)', value:x.group || '', placeholder:'예: 세무, 은행, 업무' },
    { label:'메모 (선택)', type:'textarea', value:x.memo || '', rows:2, placeholder:'로그인 방법, 자주 가는 메뉴 등' },
  ];
}
async function linkAdd(){
  const r = await smForm('링크 추가', linkFields(), { okText:'추가', wide:true });
  if(!r) return;
  const [name, url, group, memo] = r.map(v => String(v || '').trim());
  if(!name && !url) return;
  links.push({ id: nextLinkId++, name: name || url, url, group, memo, at: todayStr() });

}
async function linkEdit(id){
  const x = links.find(l => l.id === id);
  if(!x) return;
  const r = await smForm('링크 수정', linkFields(x), { okText:'저장', icon:'✎', wide:true });
  if(!r) return;
  const [name, url, group, memo] = r.map(v => String(v || '').trim());

async function linkDelete(id){
  const x = links.find(l => l.id === id);

function linkOnSearch(v){ linkSearch = v; renderLinks(); const el = document.getElementById('linkSearch'); if(el){ el.focus(); el.setSelectionRange(v.length, v.length); } }
function renderLinks(){

      </div>
      ${!links.length ? `<div class="empty">아직 등록한 링크가 없어요. '링크 추가'로 넣어 주세요.</div>`
        : !list.length ? `<div class="empty">검색과 맞는 링크가 없어요.</div>`
        : names.map(g => `
        ${names.length > 1 || g !== '기타' ? `<div style="font-weight:800; font-size:13px; color:var(--primary-dark); margin:14px 0 4px;">${taxjEsc(g)} <span class="hint" style="margin:0; font-weight:600;">${groups[g].length}</span></div>` : ''}
        <div class="table-scroll"><table>
          <thead><tr><th style="width:20%;">사이트명</th><th style="width:24%;">주소</th><th>메모</th><th style="width:22%;">첨부</th><th style="width:70px;">수정일</th><th style="width:70px;"></th></tr></thead>
          <tbody>${groups[g].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko')).map(l => `

              <td style="text-align:left; color:var(--muted); font-size:12.5px; word-break:break-all;">${taxjEsc(l.url || '')}</td>
              <td style="text-align:left; white-space:pre-wrap; font-size:13px;">${taxjEsc(l.memo || '')}</td>
              <td style="text-align:left;"><div class="att-list">${smFilesHtml(l.files, f => `linkRemoveFile(${l.id}, '${f.id}')`)}${l._uploading ? `<span class="hint" style="margin:0;">올리는 중… (${l._uploading})</span>` : `<button class="att-add" onclick="linkPickFiles(${l.id})" title="파일 첨부">＋ 파일</button>`}</div></td>
              <td style="font-size:12px; color:var(--muted);">${l.at ? taxjEsc(l.at.slice(5).replace('-', '/')) : ''}</td>
              <td><span class="row-actions" style="display:inline-flex; gap:2px;">

        </table></div>`).join('')}
