<style>
  :root{
    --bg:#f1f1fb;
    --card:#ffffff;
    --border:#eceafc;
    --text:#211f3d;
    --muted:#8f8ca8;
    --muted-soft:#b5b2ca;

    --primary:#5b5fef;
    --primary-dark:#4547c9;
    --primary-soft:#edeefd;

    --mint:#10b981;
    --mint-soft:#e6f9f1;
    --blue:#3b82f6;
    --blue-soft:#eaf2ff;
    --rose:#f43f5e;
    --rose-soft:#ffe9ed;
    --violet:#8b5cf6;
    --violet-soft:#f3eefe;
    --amber:#f59e0b;
    --amber-soft:#fff5e6;
    --slate:#475569;
    --slate-soft:#eef1f5;

    --shadow-sm: 0 1px 2px rgba(33,31,61,.05);
    --shadow-md: 0 1px 3px rgba(33,31,61,.05), 0 10px 24px -8px rgba(33,31,61,.12);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 헤더 ===== */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 28px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }
  header .wordmark{
    justify-self:center;
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:21px;
    font-weight:600;
    color:var(--text);
    letter-spacing:.2px;
  }
  header .today-pill{
    justify-self:end;
    font-size:12.5px;
    color:var(--muted);
    background:var(--bg);
    padding:6px 14px;
    border-radius:999px;
  }

  /* ===== 레이아웃: 사이드바 + 본문 ===== */
  .app-shell{ display:flex; align-items:flex-start; }

  aside.sidebar{
    width:96px;
    flex:none;
    padding:24px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
  }
  .nav-item{
    width:68px;
    padding:12px 4px 10px;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    border:none;
    background:var(--card);
    color:var(--muted);
    box-shadow:var(--shadow-sm);
    transition:transform .12s, box-shadow .12s, background .12s, color .12s;
  }
  .nav-item svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item .tiny{
    font-size:10.5px; font-weight:700; white-space:nowrap;
  }
  .nav-item:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .nav-item.active{
    background:var(--primary-soft);
    color:var(--primary-dark);
    box-shadow:var(--shadow-md);
  }

  main{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .page-head{ margin-bottom:22px; }
  .page-head:empty{ margin-bottom:0; }
  .page-head h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:-.3px;
  }
  .underline-bar{
    width:52px; height:5px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--primary));
    margin-bottom:8px;
  }
  .page-head .subtitle{ color:var(--muted); font-size:13px; }

  .tab{ display:none; }
  .tab.active{ display:block; }

  /* ===== 카드 ===== */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{
    font-size:15.5px;
    margin:0 0 4px;
    font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  .card .desc{
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:16px;
  }

  .hero-row{
    display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px;
  }
  .hero-tile{
    flex:1; min-width:180px;
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow-sm);
    position:relative;
    overflow:hidden;
  }
  .hero-tile .n{ font-size:30px; font-weight:800; line-height:1; }
  .hero-tile .label{ font-size:12.5px; font-weight:700; margin-top:8px; opacity:.85; }
  .hero-tile.tone-amber{ background:linear-gradient(135deg,#fff1e0,#ffe3d6); color:#b45309; }
  .hero-tile.tone-indigo{ background:linear-gradient(135deg,#e9eafd,#dfe1fb); color:var(--primary-dark); }
  .hero-tile.tone-mint{ background:linear-gradient(135deg,#e2f9ef,#d3f3e6); color:#047857; }

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  }
  select, input[type=text], input[type=date], input[type=number]{
    font-family:inherit; font-size:13px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--bg);
    color:var(--text);
  }
  select:focus, input:focus{ outline:2px solid var(--primary-soft); border-color:var(--primary); }

  button.btn{
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  button.btn:hover{ background:var(--bg); }
  button.btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:var(--shadow-sm); }
  button.btn.primary:hover{ background:var(--primary-dark); }
  button.btn.ghost{ border-color:transparent; color:var(--muted); background:transparent; }
  button.btn.danger{ color:var(--rose); }
  .spacer{ flex:1; }

  .summary-row{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:110px;
    border-radius:var(--radius-md);
    padding:14px 16px;
    background:var(--bg);
  }
  .stat.tone-mint{ background:var(--mint-soft); }
  .stat.tone-blue{ background:var(--blue-soft); }
  .stat.tone-rose{ background:var(--rose-soft); }
  .stat.tone-violet{ background:var(--violet-soft); }
  .stat .n{ font-size:21px; font-weight:800; }
  .stat .label{ font-size:11.5px; color:var(--muted); margin-top:3px; font-weight:600; }

  .progress-bar{ height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px; }
  .progress-bar .fill{ height:100%; border-radius:999px; transition:width .2s; }
  .fill.tone-mint{ background:linear-gradient(90deg,#34d399,var(--mint)); }
  .fill.tone-blue{ background:linear-gradient(90deg,#60a5fa,var(--blue)); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:10px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ color:var(--muted-soft); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.note-cell{ white-space:normal; min-width:160px; }
  .table-scroll{ overflow-x:auto; }

  .pill{ display:inline-block; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ok{ background:var(--mint-soft); color:#059669; }
  .pill.warn{ background:var(--amber-soft); color:#b45309; }
  .pill.danger{ background:var(--rose-soft); color:#e11d48; }
  .pill.muted{ background:var(--slate-soft); color:var(--muted); }

  .tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; }
  .tag.tag-vat{ background:var(--mint-soft); color:#047857; }
  .tag.tag-pay{ background:var(--blue-soft); color:#1d4ed8; }
  .tag.tag-corp{ background:var(--rose-soft); color:#be123c; }
  .tag.tag-indiv{ background:var(--violet-soft); color:#6d28d9; }
  .tag.tag-corp-type{ background:var(--primary-soft); color:var(--primary-dark); }
  .tag.tag-indiv-type{ background:var(--mint-soft); color:#047857; }

  .due-overdue{ color:var(--rose); font-weight:800; }
  .due-soon{ color:var(--amber); font-weight:800; }

  .steps{ display:flex; gap:5px; flex-wrap:wrap; }
  .step-chip{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:var(--bg); color:var(--muted); cursor:pointer;
    border:1px solid var(--border); white-space:nowrap; transition:all .12s;
  }
  .step-chip.done.tone-corp{ background:var(--rose-soft); color:#be123c; border-color:transparent; }
  .step-chip.done.tone-indiv{ background:var(--violet-soft); color:#6d28d9; border-color:transparent; }

  .small-input{ width:110px; }

  .task-list{ list-style:none; margin:0; padding:0; }
  .task-list li{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .task-list li:last-child{ border-bottom:none; }
  .task-list input[type=checkbox]{
    width:18px; height:18px; accent-color:var(--primary); cursor:pointer;
  }
  .task-list .task-date{ font-size:11.5px; color:var(--muted); min-width:82px; font-weight:700; }
  .task-list .task-text{ flex:1; }
  .task-list li.done .task-text{ text-decoration:line-through; color:var(--muted); }

  .deadline-list{ list-style:none; margin:0; padding:0; }
  .deadline-list li{ display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .deadline-list li:last-child{ border-bottom:none; }
  .deadline-list .left{ display:flex; align-items:center; gap:10px; }

  .empty{ text-align:center; color:var(--muted); padding:30px 0; font-size:13px; }

  .type-tag{ font-size:11px; padding:3px 9px; border-radius:999px; background:var(--bg); color:var(--muted); font-weight:700; }

  .date-cell{ display:flex; align-items:center; gap:6px; }
  .date-cell input[type=date]{ width:132px; padding:6px 8px; font-size:12px; }
  button.btn.xs{ padding:5px 10px; font-size:11px; }
  .step-date{ display:block; font-size:9.5px; font-weight:600; opacity:.75; margin-top:1px; }

  .settings-block{ padding:18px 0; border-bottom:1px solid var(--border); }
  .settings-block:first-child{ padding-top:2px; }
  .settings-block:last-child{ border-bottom:none; }
  .settings-block .row{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .settings-block h3{ font-size:13.5px; font-weight:800; margin-bottom:3px; }
  .settings-block .hint{ font-size:12px; color:var(--muted); line-height:1.5; max-width:420px; }
  .settings-block .ctrl{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .cal-title-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:16px; }
  .cal-title{ justify-self:center; margin:0; }
  .cal-title-row button{ justify-self:end; }
  .cal-head{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px; }
  .cal-head .month-label{ font-size:15px; font-weight:800; min-width:110px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:92px; gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:800; color:var(--muted-soft); padding:2px 0 8px; text-transform:uppercase; }
  .cal-day{
    position:relative; height:92px; overflow:hidden;
    border-radius:12px; background:var(--bg);
    padding:7px 7px 8px; border:1px solid transparent;
  }
  .cal-day.other{ opacity:.4; }
  .cal-day.today{ border-color:var(--primary); background:var(--primary-soft); }
  .cal-daynum{ font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  .cal-day.today .cal-daynum{ color:var(--primary-dark); }
  .cal-tasks{ display:flex; flex-direction:column; gap:3px; overflow:hidden; max-height:60px; }
  .cal-task{
    font-size:10.5px; font-weight:700; background:var(--card); color:var(--text);
    padding:3px 6px; border-radius:6px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:var(--shadow-sm); flex-shrink:0;
  }
  .cal-task.done{ text-decoration:line-through; color:var(--muted); background:var(--bg); box-shadow:none; }
</style>
</head>

function todayStr(){ return new Date().toISOString().slice(0,10); }

function dueClass(dateStr){
  const today = new Date(todayStr());
  const due = new Date(dateStr);
  const diffDays = Math.round((due - today) / 86400000);
  if(diffDays < 0) return 'due-overdue';
  if(diffDays <= settings.soonDays) return 'due-soon';
  return '';
}

function addTask(){
  const dateEl = document.getElementById('newTaskDate');
  const textEl = document.getElementById('newTaskText');
  if(!textEl.value.trim()) return;
  tasks.push({id: nextTaskId++, date: dateEl.value || todayStr(), text: textEl.value.trim(), done:false});
  textEl.value = '';
  renderAll();
}
function toggleTask(id){ const t = tasks.find(x => x.id === id); if(t) t.done = !t.done; renderAll(); }
function deleteTask(id){ tasks = tasks.filter(x => x.id !== id); renderAll(); }

function pad2(n){ return String(n).padStart(2,'0'); }

function calPrev(){ calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } renderHome(); }
function calNext(){ calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } renderHome(); }
function calToday(){
  const t = new Date(todayStr());
  calYear = t.getFullYear(); calMonth = t.getMonth();
  renderHome();
}

function addScheduleQuick(){
  const dateStr = prompt('일정 날짜를 입력하세요 (YYYY-MM-DD)', todayStr());
  if(!dateStr || !dateStr.trim()) return;
  const text = prompt('일정 내용을 입력하세요');
  if(!text || !text.trim()) return;
  tasks.push({id: nextTaskId++, date: dateStr.trim(), text: text.trim(), done:false});
  renderAll();
}

function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayS = todayStr();

  const cells = [];
  for(let i = 0; i < startDow; i++){
    const d = daysInPrevMonth - startDow + 1 + i;
    let y = calYear, m = calMonth - 1;
    if(m < 0){ m = 11; y--; }
    cells.push({ d, dateStr: `${y}-${pad2(m+1)}-${pad2(d)}`, other:true });
  }
  for(let d = 1; d <= daysInMonth; d++){
    cells.push({ d, dateStr: `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`, other:false });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    let y = calYear, m = calMonth + 1;
    if(m > 11){ m = 0; y++; }
    cells.push({ d: nextDay, dateStr: `${y}-${pad2(m+1)}-${pad2(nextDay)}`, other:true });
    nextDay++;
  }

  const dow = ['일','월','화','수','목','금','토'];

  return `
    <div class="cal-head">
      <button class="btn ghost xs" onclick="calPrev()">이전</button>
      <div class="month-label">${calYear}년 ${calMonth+1}월</div>
      <button class="btn ghost xs" onclick="calToday()">오늘</button>
      <button class="btn ghost xs" onclick="calNext()">다음</button>
    </div>
    <div class="cal-grid">
      ${dow.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(c => {
        const dayTasks = tasks.filter(t => t.date === c.dateStr);
        return `
        <div class="cal-day ${c.dateStr===todayS?'today':''} ${c.other?'other':''}">
          <div class="cal-daynum">${c.d}</div>
          <div class="cal-tasks">
            ${dayTasks.map(t => `<div class="cal-task ${t.done?'done':''}" onclick="toggleTask(${t.id})" title="${t.text}">${t.text}</div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

/* =========================================================
   Google Drive / Sheets 연동
   ========================================================= */

function setSyncStatus(text){
  googleSyncStatus = text;
  const el = document.getElementById('syncStatusLine');
  if(el) el.textContent = text;
}

function gapiLoaded(){
  gapi.load('client', async () => {
    try {
      await gapi.client.init({});
      await gapi.client.load('sheets', 'v4');
      await gapi.client.load('drive', 'v3');
      gapiReady = true;
      maybeEnableGoogleSignIn();
    } catch(e){
      console.error('gapi 초기화 실패', e);
    }
  });
}

function gisInit(){
  try {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: '',
    });
    gisReady = true;
    maybeEnableGoogleSignIn();
  } catch(e){
    console.error('Google Identity Services 초기화 실패', e);
  }
}

function maybeEnableGoogleSignIn(){
  const btn = document.getElementById('googleSignInBtn');
  if(btn && gapiReady && gisReady){ btn.disabled = false; }
}

function handleGoogleSignIn(){
  if(!googleTokenClient){
    alert('Google 연동 스크립트를 아직 불러오지 못했습니다. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');
    return;
  }
  googleTokenClient.callback = async (resp) => {
    if(resp.error){
      setSyncStatus('로그인 실패: ' + resp.error);
      renderSettings();
      return;
    }
    googleAccessToken = resp.access_token;
    gapi.client.setToken({ access_token: googleAccessToken });
    await afterGoogleSignIn();
  };
  googleTokenClient.requestAccessToken({ prompt: '' });
}

function handleGoogleSignOut(){
  if(googleAccessToken && typeof google !== 'undefined'){
    google.accounts.oauth2.revoke(googleAccessToken, () => {});
  }
  clearInterval(googlePollTimer);
  googleAccessToken = null;
  googleSpreadsheetId = null;
  settings.sheetsConnected = false;
  setSyncStatus('');
  renderSettings();
}

async function afterGoogleSignIn(){
  setSyncStatus('연결하는 중...');
  renderSettings();
  try {
    const found = await findGoogleDataSheet();
    googleSpreadsheetId = found || await createGoogleDataSheet();
    await loadFromGoogleSheet();
    settings.sheetsConnected = true;
    setSyncStatus('연동됨 · 방금 불러왔습니다');
    startGooglePolling();
  } catch(e){
    console.error(e);
    const msg = (e && e.result && e.result.error && e.result.error.message) || e.message || '알 수 없는 오류';
    setSyncStatus('연동 실패: ' + msg);
  }
  renderAll();
}

async function findGoogleDataSheet(){
  const res = await gapi.client.drive.files.list({
    q: `name='${GOOGLE_SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`,
    fields: 'files(id,name)',
    spaces: 'drive',
  });
  const files = res.result.files || [];
  return files.length ? files[0].id : null;
}

async function createGoogleDataSheet(){
  const res = await gapi.client.sheets.spreadsheets.create({
    properties: { title: GOOGLE_SHEET_NAME },
    sheets: [{ properties: { title: 'data' } }],
  });
  const id = res.result.spreadsheetId;
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: id,
    range: 'data!A1:B1',
    valueInputOption: 'RAW',
    resource: { values: [['key', 'json']] },
  });
  return id;
}

const GOOGLE_DATA_KEYS = [
  'clients','tasks','vatData','payData','corpData','indivData','settings',
  'vatPeriods','payMonths','corpYears','indivYears',
  'vatDue','payDue','corpDue','indivDue',
  'nextClientId','nextTaskId',
];

function collectGoogleSnapshot(){
  return {
    clients, tasks, vatData, payData, corpData, indivData, settings,
    vatPeriods, payMonths, corpYears, indivYears,
    vatDue, payDue, corpDue, indivDue,
    nextClientId, nextTaskId,
  };
}

async function loadFromGoogleSheet(){
  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: googleSpreadsheetId,
    range: 'data!A2:B1000',
  });
  const rows = res.result.values || [];
  const map = {};
  rows.forEach(r => { if(r[0] && r[1]) map[r[0]] = r[1]; });
  if(!Object.keys(map).length) return; // 새로 만든 빈 시트면 현재 목업 데이터를 그대로 유지 (다음 저장 때 반영됨)

  try {
    if(map.clients)     clients     = JSON.parse(map.clients);
    if(map.tasks)        tasks        = JSON.parse(map.tasks);
    if(map.vatData)      vatData      = JSON.parse(map.vatData);
    if(map.payData)      payData      = JSON.parse(map.payData);
    if(map.corpData)     corpData     = JSON.parse(map.corpData);
    if(map.indivData)    indivData    = JSON.parse(map.indivData);
    if(map.settings)     settings     = Object.assign(settings, JSON.parse(map.settings));
    if(map.vatPeriods)   vatPeriods   = JSON.parse(map.vatPeriods);
    if(map.payMonths)    payMonths    = JSON.parse(map.payMonths);
    if(map.corpYears)    corpYears    = JSON.parse(map.corpYears);
    if(map.indivYears)   indivYears   = JSON.parse(map.indivYears);
    if(map.vatDue)        vatDue       = JSON.parse(map.vatDue);
    if(map.payDue)        payDue       = JSON.parse(map.payDue);
    if(map.corpDue)       corpDue      = JSON.parse(map.corpDue);
    if(map.indivDue)      indivDue     = JSON.parse(map.indivDue);
    if(map.nextClientId)  nextClientId = JSON.parse(map.nextClientId);
    if(map.nextTaskId)    nextTaskId   = JSON.parse(map.nextTaskId);
  } catch(e){
    console.error('시트 데이터 파싱 실패', e);
  }
}

async function saveToGoogleSheet(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  const snap = collectGoogleSnapshot();
  const rows = GOOGLE_DATA_KEYS.map(k => [k, JSON.stringify(snap[k])]);
  setSyncStatus('저장 중...');
  try {
    await gapi.client.sheets.spreadsheets.values.clear({
      spreadsheetId: googleSpreadsheetId, range: 'data!A2:B1000',
    });
    await gapi.client.sheets.spreadsheets.values.update({
      spreadsheetId: googleSpreadsheetId, range: 'data!A2',
      valueInputOption: 'RAW',
      resource: { values: rows },
    });
    const t = new Date();
    setSyncStatus(`연동됨 · ${pad2(t.getHours())}:${pad2(t.getMinutes())} 저장됨`);
  } catch(e){
    console.error(e);
    setSyncStatus('저장 실패 (다음 변경 때 다시 시도합니다)');
  }
}

function scheduleGoogleSave(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToGoogleSheet, 900);
}

/* =========================================================
   마스터 시트("★Tax_2026")에서 가져오기 — 읽기 전용
   버튼을 눌렀을 때만 1회성으로 동작. 실제 시트에는 절대 쓰지 않는다.
   가져온 항목은 source:'master' 로 표시해서, 재실행 시 이전에
   가져온 항목만 교체하고(수동으로 추가한 항목은 그대로 둠) 중복 생성을 막는다.
   ========================================================= */

function setMasterSyncStatus(text){
  masterSyncStatus = text;
  const el = document.getElementById('masterSyncStatusLine');
  if(el) el.textContent = text;
}

// 시트의 탭 이름 목록을 가져온다.
async function getMasterSheetTitles(){
  const res = await gapi.client.sheets.spreadsheets.get({
    spreadsheetId: MASTER_SHEET_ID,
    fields: 'sheets.properties.title',
  });
  return (res.result.sheets || []).map(s => s.properties.title);
}

// 헤더 행에 필요한 컬럼명이 모두 들어있는 탭을 찾는다 (탭 이름이 바뀌어도 안전하도록).
async function findTabByHeaders(titles, requiredHeaderGroups){
  for(const title of titles){
    try {
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: MASTER_SHEET_ID,
        range: `'${title}'!A1:Z5`,
      });
      const rows = res.result.values || [];
      // 헤더가 정확히 1행이 아닐 수도 있어 앞 5행 중 컬럼명이 가장 많이 매칭되는 행을 찾는다.
      let best = null;
      rows.forEach((row, ri) => {
        const texts = row.map(c => (c || '').toString().trim());
        const matchCount = requiredHeaderGroups.filter(group =>
          group.some(alias => texts.some(t => t.includes(alias)))
        ).length;
        if(matchCount === requiredHeaderGroups.length){
          if(!best) best = { rowIndex: ri, texts };
        }
      });
      if(best) return { title, headerRowIndex: best.rowIndex, headerTexts: best.texts };
    } catch(e){
      console.warn(`탭 "${title}" 확인 실패`, e);
    }
  }
  return null;
}

function findColIndex(headerTexts, aliases){
  for(let i = 0; i < headerTexts.length; i++){
    if(aliases.some(a => headerTexts[i].includes(a))) return i;
  }
  return -1;
}

// 거래처 기본정보: 상호명 / 사업자등록번호 / 법인등록번호 / 대표자명 (딱 이 4개만, 그 외 민감정보는 가져오지 않음)
async function importClientsFromMaster(){
  const titles = await getMasterSheetTitles();
  const found = await findTabByHeaders(titles, [
    ['상호명', '상호'],
    ['사업자 번호', '사업자등록번호', '사업자번호'],
    ['법인등록번호'],
    ['대표자'],
  ]);
  if(!found){ console.warn('거래처 기본정보 탭을 찾지 못했습니다.'); return 0; }

  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: MASTER_SHEET_ID,
    range: `'${found.title}'!A${found.headerRowIndex + 1}:Z3000`,
  });
  const rows = res.result.values || [];
  const header = rows[0].map(c => (c || '').toString().trim());
  const idxName = findColIndex(header, ['상호명', '상호']);
  const idxBiz  = findColIndex(header, ['사업자 번호', '사업자등록번호', '사업자번호']);
  const idxCorp = findColIndex(header, ['법인등록번호']);
  const idxCeo  = findColIndex(header, ['대표자']);

  const imported = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    if(!r) continue;
    const name = (r[idxName] || '').toString().trim();
    if(!name) continue;
    const biz  = idxBiz  >= 0 ? (r[idxBiz]  || '').toString().trim() : '';
    const corp = idxCorp >= 0 ? (r[idxCorp] || '').toString().trim() : '';
    const ceo  = idxCeo  >= 0 ? (r[idxCeo]  || '').toString().trim() : '';
    const isCorp = !!corp && corp !== '-';
    imported.push({
      id: nextClientId++,
      name, ceo,
      biz: biz && biz !== '-' ? biz : '',
      corpNo: corp && corp !== '-' ? corp : '',
      type: isCorp ? '법인' : '개인',
      source: 'master',
    });
  }
  clients = clients.filter(c => c.source !== 'master').concat(imported);
  return imported.length;
}

// Work List 탭: 날짜별 체크박스+할 일 텍스트만 가져온다 (메모/아이콘 등 부가 열은 제외).
async function importWorklistFromMaster(){
  const titles = await getMasterSheetTitles();
  const title = titles.find(t => t.trim() === 'Work List') || titles.find(t => t.includes('Work List'));
  if(!title){ console.warn('Work List 탭을 찾지 못했습니다.'); return 0; }

  const res = await gapi.client.sheets.spreadsheets.get({
    spreadsheetId: MASTER_SHEET_ID,
    ranges: [`'${title}'!A1:F4000`],
    fields: 'sheets(merges,data.rowData.values.formattedValue)',
  });
  const sheet = (res.result.sheets || [])[0];
  if(!sheet) return 0;
  const rowData = (sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
  const merges = sheet.merges || [];

  const dateRe = /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  const cellText = (ri, ci) => {
    const row = rowData[ri];
    if(!row || !row.values || !row.values[ci]) return '';
    return (row.values[ci].formattedValue || '').toString().trim();
  };

  // A열(또는 B열)에서 시작하고 날짜 패턴을 담은 행 병합(헤더 행)만 날짜 구분선으로 인식
  const dateHeaders = merges
    .filter(m => m.startColumnIndex === 0 && (m.endColumnIndex - m.startColumnIndex) >= 2)
    .map(m => ({ merge: m, text: cellText(m.startRowIndex, 0) }))
    .filter(h => dateRe.test(h.text))
    .sort((a, b) => a.merge.startRowIndex - b.merge.startRowIndex);

  const imported = [];
  dateHeaders.forEach((h, idx) => {
    const m = dateRe.exec(h.text);
    let year = parseInt(m[1], 10);
    if(year < 100) year += 2000;
    const mm = pad2(parseInt(m[2], 10));
    const dd = pad2(parseInt(m[3], 10));
    const dateStr = `${year}-${mm}-${dd}`;

    const startRow = h.merge.endRowIndex;
    const endRow = idx + 1 < dateHeaders.length ? dateHeaders[idx + 1].merge.startRowIndex : rowData.length;
    for(let ri = startRow; ri < endRow; ri++){
      const check = cellText(ri, 0);
      const text = cellText(ri, 1);
      if(!text) continue;
      if(check !== 'TRUE' && check !== 'FALSE') continue; // 체크박스 형태가 아니면(구분선 등) 건너뜀
      imported.push({
        id: nextTaskId++,
        date: dateStr,
        text,
        done: check === 'TRUE',
        source: 'master',
      });
    }
  });

  tasks = tasks.filter(t => t.source !== 'master').concat(imported);
  return imported.length;
}

async function importFromMasterSheet(){
  if(!googleAccessToken){ alert('먼저 Google 로그인을 해주세요.'); return; }
  setMasterSyncStatus('마스터 시트에서 가져오는 중...');
  try {
    const [clientCount, taskCount] = [
      await importClientsFromMaster(),
      await importWorklistFromMaster(),
    ];
    const t = new Date();
    setMasterSyncStatus(`${pad2(t.getHours())}:${pad2(t.getMinutes())} 기준 · 거래처 ${clientCount}건, 할 일 ${taskCount}건 가져옴`);
  } catch(e){
    console.error(e);
    const msg = (e && e.result && e.result.error && e.result.error.message) || e.message || '알 수 없는 오류';
    setMasterSyncStatus('가져오기 실패: ' + msg);
  }
  renderAll();
}

/* =========================================================
   GitHub 배포 (Tax.J와 동일한 방식) — 수정된 SM.html 파일을 고르면
   GitHub(sm-sarah/SM) 저장소의 SM.html에 바로 커밋함. 성공하면 GitHub
   Pages에 몇 초~몇 분 안에 반영됨. Google Sheets 연동과는 전혀 무관한
   별개 기능이고, 토큰은 이 기기의 브라우저(localStorage)에만 저장됨.
   ========================================================= */
const GITHUB_DEPLOY_REPO_OWNER = 'sm-sarah';
const GITHUB_DEPLOY_REPO_NAME = 'SM';
const GITHUB_DEPLOY_FILE_PATH = 'SM.html';
const GITHUB_DEPLOY_TOKEN_KEY = 'sm_worklog_github_pat'; // Tax.J와 저장 키를 다르게 둬서 서로 섞이지 않게 함
let smDeploySelectedFile = null;

function smDeployTokenStatusText(){
  const saved = (localStorage.getItem(GITHUB_DEPLOY_TOKEN_KEY) || '').trim();
  return saved ? `토큰 저장됨 (이 기기에만) · 끝 4자리 ...${saved.slice(-4)}` : '아직 저장된 토큰이 없어요.';
}
function smDeployUpdateBtnState(){
  const btn = document.getElementById('smDeployBtn');
  if(!btn) return;
  const hasToken = !!(localStorage.getItem(GITHUB_DEPLOY_TOKEN_KEY) || '').trim();
  btn.disabled = !(hasToken && smDeploySelectedFile);
}
function saveSmDeployToken(){
  const input = document.getElementById('smDeployToken');
  const val = (input.value || '').trim();
  if(!val){ alert('토큰을 입력해주세요.'); return; }
  localStorage.setItem(GITHUB_DEPLOY_TOKEN_KEY, val);
  input.value = '';
  const statusEl = document.getElementById('smDeployTokenStatus');
  if(statusEl) statusEl.textContent = smDeployTokenStatusText();
  smDeployUpdateBtnState();
}
function handleSmDeployFileChange(input){
  smDeploySelectedFile = input.files && input.files[0] ? input.files[0] : null;
  const labelText = document.getElementById('smDeployFileLabelText');
  if(labelText) labelText.textContent = smDeploySelectedFile ? smDeploySelectedFile.name : 'SM.html 파일 선택';
  const msgEl = document.getElementById('smDeployMsg');
  if(msgEl) msgEl.textContent = smDeploySelectedFile ? `업로드 완료: ${smDeploySelectedFile.name} (아직 배포 전이에요)` : '';
  smDeployUpdateBtnState();
}
function smUtf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
async function runSmDeploy(){
  const msgEl = document.getElementById('smDeployMsg');
  const token = (localStorage.getItem(GITHUB_DEPLOY_TOKEN_KEY) || '').trim();
  if(!token || !smDeploySelectedFile) return;
  if(!confirm(`GitHub(${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME})의 ${GITHUB_DEPLOY_FILE_PATH}에 커밋할까요?`)) return;
  const btn = document.getElementById('smDeployBtn');
  if(btn) btn.disabled = true;
  try {
    if(msgEl) msgEl.textContent = '파일 읽는 중...';
    const content = await smDeploySelectedFile.text();
    const apiBase = `https://api.github.com/repos/${GITHUB_DEPLOY_REPO_OWNER}/${GITHUB_DEPLOY_REPO_NAME}/contents/${GITHUB_DEPLOY_FILE_PATH}`;
    const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
    if(msgEl) msgEl.textContent = '기존 파일 정보 확인 중...';
    const getRes = await fetch(apiBase, { headers });
    if(!getRes.ok){
      if(getRes.status === 401) throw new Error('토큰이 유효하지 않아요. 저장소 쓰기 권한이 있는 토큰인지 확인해주세요.');
      if(getRes.status === 404) throw new Error('저장소 또는 파일 경로를 찾을 수 없어요.');
      throw new Error(`GitHub 조회 실패 (${getRes.status})`);
    }
    const cur = await getRes.json();
    if(msgEl) msgEl.textContent = 'GitHub에 커밋하는 중...';
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `SM 업데이트 (${new Date().toLocaleString('ko-KR')})`,
        content: smUtf8ToBase64(content),
        sha: cur.sha,
      }),
    });
    if(!putRes.ok){
      const errBody = await putRes.json().catch(() => ({}));
      throw new Error(errBody.message || `GitHub 커밋 실패 (${putRes.status})`);
    }
    if(msgEl) msgEl.textContent = '배포 완료! 잠시 후 실제 서비스 화면에 반영돼요.';
    smDeploySelectedFile = null;
    const labelText = document.getElementById('smDeployFileLabelText');
    if(labelText) labelText.textContent = 'SM.html 파일 선택';
    const fileInput = document.getElementById('smDeployFile');
    if(fileInput) fileInput.value = '';
  } catch(e){
    console.error('GitHub 배포 실패', e);
    if(msgEl) msgEl.textContent = '배포 실패: ' + (e && e.message ? e.message : e);
  } finally {
    smDeployUpdateBtnState();
  }
}

/* =========================================================
   다른 기기에서 저장한 내용 자동으로 받아오기
   Google Sheets처럼 실시간은 아니지만, 이 창이 열려있는 동안
   주기적으로 + 창에 다시 포커스할 때 최신 데이터를 다시 불러와서
   "거의 항상 동기화된" 느낌을 준다. 입력 중(포커스된 input 등)이거나
   방금 로컬에서 바꿔서 저장 대기 중이면(= saveTimer 있음) 건너뛴다 —
   그 순간에 덮어쓰면 방금 한 입력이 날아가 보일 수 있어서.
   ========================================================= */
const GOOGLE_POLL_INTERVAL_MS = 20000;
let googlePollTimer = null;

function isEditingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

async function pollGoogleSheetForUpdates(){
  if(!googleAccessToken || !googleSpreadsheetId) return;
  if(saveTimer) return; // 방금 로컬에서 바꿔서 곧 저장될 예정 — 이번 폴링은 건너뜀
  if(isEditingNow()) return; // 뭔가 입력 중이면 화면을 갈아치우지 않음
  try {
    await loadFromGoogleSheet();
    renderAllNoSave();
  } catch(e){
    console.warn('자동 새로고침 실패', e);
  }
}

function startGooglePolling(){
  clearInterval(googlePollTimer);
  googlePollTimer = setInterval(pollGoogleSheetForUpdates, GOOGLE_POLL_INTERVAL_MS);
}

window.addEventListener('focus', () => { pollGoogleSheetForUpdates(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') pollGoogleSheetForUpdates();
});

document.getElementById('todayPill').textContent = todayStr().replaceAll('-','.');

}
