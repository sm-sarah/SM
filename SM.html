async function editEvent(id){
  const ev = events.find(x => x.id === id);
  if(!ev) return;
  const r = await smForm('일정 수정', [{ label:'날짜', type:'date', value:ev.date }, { label:'내용', value:ev.text }], { okText:'저장', icon:'✎', wide:true });

  pushHist(ev, '수정', changes);
  renderAll();

// 달력에 표시할 신고기한: 각 신고 탭의 기한 + To do '주요 세무일정' 중 날짜(예: 7/10)가 적힌 항목
function calendarDeadlines(){
  const list = [];
  const seen = new Set();
  const push = (date, domain, label) => {
    if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const key = date + '|' + label;
    if(seen.has(key)) return;
    seen.add(key);
    list.push({date, domain, label});
  };
  Object.entries(vatDue || {}).forEach(([k, d]) => push(d, '부가가치세', `${k} 부가세 신고기한`));
  Object.entries(payDue || {}).forEach(([k, d]) => {
    // "8월" + 기한 2026-09-10 → 2026년 8월 귀속 (12월분처럼 기한이 다음 해면 한 해 앞)
    const mo = parseInt(k, 10);
    let yr = d ? parseInt(d.slice(0, 4), 10) : new Date().getFullYear();
    if(d && !isNaN(mo) && mo > parseInt(d.slice(5, 7), 10)) yr -= 1;
    push(d, '원천세·급여', isNaN(mo) ? `${k} 원천세 신고기한` : `${yr}년 ${mo}월 귀속 원천세 신고기한`);
  });
  Object.entries(corpDue || {}).forEach(([k, d]) => push(d, '법인세', `${k}년 귀속 법인세 신고기한`));
  Object.entries(indivDue || {}).forEach(([k, d]) => push(d, '종합소득세', `${k}년 귀속 종소세 신고기한`));
  // 주요 세무일정: "7/27 부가가치세 확정신고" 처럼 앞에 월/일이 있는 것만
  const baseYear = calYear;
  Object.values(worklistSchedule || {}).forEach(arr => (arr || []).forEach(txt => {
    const m = /^\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*(.*)$/.exec(txt);
    if(!m) return;
    const mo = parseInt(m[1], 10), da = parseInt(m[2], 10);
    if(mo < 1 || mo > 12 || da < 1 || da > 31) return;
    push(`${baseYear}-${pad2(mo)}-${pad2(da)}`, '세무일정', (m[3] || '').trim() || txt);
  }));
  return list;
}

const CAL_DEADLINE_CLASS = {
  '부가가치세':'cd-vat', '원천세·급여':'cd-pay', '법인세':'cd-corp', '종합소득세':'cd-indiv', '세무일정':'cd-etc',
};
function renderCalendar(){
  const tjMarks = taxjCalMarks();   // 회사 공휴일·제외일정·내 근태(요청 2026.10.08)
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayS = todayStr();

  const cells = [];
  for(let i = 0; i < startDow; i++){
    const d = daysInPrevMonth - startDow + 1 + i;
    let y = calYear, m = calMonth - 1;
    if(m < 0){ m = 11; y--; }
    cells.push({ d, dateStr: `${y}-${pad2(m+1)}-${pad2(d)}`, other:true });
  }
  for(let d = 1; d <= daysInMonth; d++){
    cells.push({ d, dateStr: `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`, other:false });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    let y = calYear, m = calMonth + 1;
    if(m > 11){ m = 0; y++; }
    cells.push({ d: nextDay, dateStr: `${y}-${pad2(m+1)}-${pad2(nextDay)}`, other:true });
    nextDay++;
  }

  const dow = ['일','월','화','수','목','금','토'];
  const deadlinesAll = calendarDeadlines();

  return `
    <div class="cal-head">
      <button class="wl-navbtn" onclick="calPrev()" title="이전 달" aria-label="이전 달">‹</button>
      <div class="cal-ym-wrap">
        <button class="cal-ym" onclick="toggleCalPicker(event)" title="눌러서 연·월 선택">${calYear}년 ${calMonth+1}월</button>
        ${calPickerOpen ? `
        <div class="cal-picker" onclick="event.stopPropagation()">
          <div class="cal-picker-year">
            <button class="wl-navbtn" onclick="calPickerYear += -1; renderHome();" aria-label="이전 해">‹</button>
            <span>${calPickerYear}년</span>
            <button class="wl-navbtn" onclick="calPickerYear += 1; renderHome();" aria-label="다음 해">›</button>
          </div>
          <div class="cal-picker-months">
            ${Array.from({length:12}, (_, i) => {
              const isSel = calPickerYear === calYear && i === calMonth;
              const t = new Date();
              const isNow = calPickerYear === t.getFullYear() && i === t.getMonth();
              return `<button class="cal-pm ${isSel ? 'on' : ''} ${isNow ? 'now' : ''}" onclick="calPickMonth(${i})">${i+1}월</button>`;
            }).join('')}
          </div>
        </div>` : ''}
      </div>
      <button class="wl-navbtn" onclick="calNext()" title="다음 달" aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(c => {
        const dayDeadlines = deadlinesAll.filter(x => x.date === c.dateStr);
        const dayEvents = events.filter(x => x.date === c.dateStr);
        const mk = (tjMarks || {})[c.dateStr];
        return `
        <div class="cal-day ${c.dateStr===todayS?'today':''} ${c.other?'other':''}">
          <div class="cal-daynum ${mk && mk.hol ? 'tj-hol' : ''}">${c.d}${mk && mk.hol ? `<span class="tj-holname">${taxjEsc(mk.hol)}</span>` : ''}</div>
          ${taxjCalItemsHtml(mk)}
          <div class="cal-tasks">
            ${dayDeadlines.map(x => `<div class="cal-task cal-deadline ${CAL_DEADLINE_CLASS[x.domain] || ''}" title="${x.label}">${x.label}</div>`).join('')}
            ${dayEvents.map(ev => `<div class="cal-task cal-event" onclick="openEvent(${ev.id})" title="${ev.text} (눌러서 수정·이력·삭제)">★ ${ev.text}</div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// 반복 할 일: settings.recurring = [{id, day, text}] → 이번 달·다음 달 해당 날짜에 할 일을 자동 생성
function generateRecurringTasks(){
  const rules = settings.recurring || [];
  if(!rules.length || !sheetLoadedOnce) return;
  const made = new Set(settings.recurringMade || []);
  const now = new Date();
  let added = false;
  [0, 1].forEach(off => {
    const y = now.getFullYear(), m = now.getMonth() + off;
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate();
    const ym = `${first.getFullYear()}-${pad2(first.getMonth() + 1)}`;
    rules.forEach(r => {
      const key = `${r.id}|${ym}`;
      if(made.has(key)) return;
      const date = `${ym}-${pad2(Math.min(r.day, last))}`;
      if(date < todayStr() && !(r.since && r.since <= date)){ made.add(key); return; }   // 등록하기 전에 지나간 날짜는 만들지 않음
      const t = { id: nextTaskId++, date, text: r.text, done:false, recurring: r.id };
      pushHist(t, '반복 할 일로 자동 추가');
      tasks.push(t); made.add(key); added = true;
    });
  });
  if(added){ settings.recurringMade = [...made]; scheduleGoogleSave(); }
}
async function addRecurringRule(){
  const r = await smForm('반복 할 일 추가', [
    { label:'매월 며칠', type:'number', value:'10', placeholder:'1~31' },
    { label:'할 일', placeholder:'예: 원천세 신고' },
  ], { okText:'추가', icon:'↻', wide:true });
  if(!r) return;
  const day = Math.max(1, Math.min(31, parseInt(r[0], 10) || 1)), text = (r[1] || '').trim();
  if(!text) return;
  settings.recurring = (settings.recurring || []).concat([{ id: Date.now(), day, text, since: todayStr() }]);
  renderAll();
}
async function deleteRecurringRule(id){
  const rule = (settings.recurring || []).find(x => x.id === id);
  if(!rule || !(await smConfirm('반복 할 일을 삭제할까요?', `매월 ${rule.day}일 · ${rule.text}\n이미 만들어진 할 일은 그대로 남아요.`, { tone:'danger', icon:'!', okText:'삭제' }))) return;
  settings.recurring = settings.recurring.filter(x => x.id !== id);
  renderAll();
}
async function editRecurringRule(id){
  const rule = (settings.recurring || []).find(x => x.id === id);
  if(!rule) return;
  const r = await smForm('반복 할 일 수정', [
    { label:'매월 며칠', type:'number', value:String(rule.day) }, { label:'할 일', value:rule.text },
  ], { okText:'저장', icon:'✎', wide:true });

  rule.day = Math.max(1, Math.min(31, parseInt(r[0], 10) || rule.day));
  rule.text = (r[1] || '').trim() || rule.text;
  renderAll();
}

function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function renderHomeSummary(){
  const T = todayStr();
  const weekEnd = addDaysStr(T, 6 - new Date().getDay());          // 이번 주 토요일까지
  const todayTasks = tasks.filter(t => t.date === T);
  const todayLeft = todayTasks.filter(t => !t.done).length;
  const weekLeft = tasks.filter(t => !t.done && t.date > T && t.date <= weekEnd).length;
  const overdue = carryCandidates().length;
  const upcoming = calendarDeadlines().filter(d => d.date >= T).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const evSoon = events.filter(e => e.date >= T && e.date <= addDaysStr(T, 7)).sort((a, b) => a.date.localeCompare(b.date));
  const dd = d => { const n = daysBetween(T, d); return n === 0 ? 'D-DAY' : `D-${n}`; };
  return `
    <div class="home-summary">
      <div class="hs-tile" onclick="switchTab('worklist')">
        <div class="hs-n">${todayLeft}<span>/${todayTasks.length}</span></div><div class="hs-l">오늘 남은 할 일</div>
      </div>
      <div class="hs-tile" onclick="switchTab('worklist')">
        <div class="hs-n">${weekLeft}</div><div class="hs-l">이번 주 남은 할 일</div>
      </div>
      <div class="hs-tile ${overdue ? 'warn' : ''}" onclick="switchTab('worklist')">
        <div class="hs-n">${overdue}</div><div class="hs-l">지난 2주 못한 일</div>
      </div>
      <div class="hs-tile hs-wide">
        <div class="hs-l" style="margin-bottom:6px;">다가오는 신고기한 · 일정</div>
        ${upcoming.concat(evSoon.map(e => ({ date:e.date, label:'★ ' + e.text }))).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4)
          .map(d => `<div class="hs-dl"><b class="${daysBetween(T, d.date) <= (settings.soonDays || 7) ? 'soon' : ''}">${dd(d.date)}</b><span>${d.label}</span><em>${shortDate(d.date)}</em></div>`).join('')
          || '<div class="hs-dl"><span>예정된 기한이 없어요</span></div>'}
      </div>
    </div>`;
}

  if(!(await smConfirm('이 항목을 삭제할까요?', item.text, { tone:'danger', icon:'!', okText:'삭제' }))) return;

  worklistChecklist[month].splice(idx, 1);
  renderAll();

// [2026.10.19] "체크리스트에서도 다음달 이월기능"(요청) - 이 달에 완료하지 않은 항목을 다음 달 체크리스트로 옮김.
// 옮긴 항목은 다음 달 목록 끝에 붙고(중요 표시·이력 유지, 이력에 '다음 달로 이월' 기록), 이 달 목록에서는 빠짐.
// 마스터 시트에서 온 항목은 다시 불러와도 원래 달에 되살아나지 않도록 숨김 처리하고, 다음 달에서는 직접 추가한 항목처럼 유지.
// 다음 달에 같은 내용이 이미 있으면 중복으로 넣지 않고 이 달에서만 뺌. 체크리스트는 연도 없이 '1월~12월'로만 저장돼서 12월은 이월하지 않음.
async function carryChecklistToNextMonth(month){
  const n = parseInt(month, 10);
  if(isNaN(n) || n >= 12) return;
  const next = `${n + 1}월`;
  const src = worklistChecklist[month] || [];
  const left = src.filter(x => !x.done);
  if(!left.length) return;
  if(!(await smConfirm(`남은 ${left.length}건을 ${next}로 이월할까요?`, `${month}에 완료하지 않은 항목이 ${next} 체크리스트로 옮겨지고, ${month} 목록에서는 빠져요.`, { icon:'→', okText:'이월' }))) return;
  const dst = (worklistChecklist[next] = worklistChecklist[next] || []);
  const have = new Set(dst.map(x => (x.text || '').trim()));
  left.forEach(item => {
    if(item.source !== 'user') hideMasterKey('hiddenMasterChecklist', month + '|' + (item.origText || item.text));
    if(have.has((item.text || '').trim())) return;
    const moved = Object.assign({}, item, { source:'user', movedFrom: item.movedFrom || month });
    delete moved.origText;
    pushHist(moved, '다음 달로 이월', [{ label:'월', from:month, to:next }]);
    dst.push(moved);
    have.add((item.text || '').trim());
  });
  worklistChecklist[month] = src.filter(x => x.done);
  worklistSelMonth = next;
  renderAll();
}
// 요청 배경(2026.10.08): 체크리스트도 줄바꿈된 목록을 붙여넣으면 한 줄씩 건별로 등록되게 함.
async function addChecklistItem(month){
  const r = await smForm(`${month} 체크리스트 추가`, [{ label:'항목 (여러 줄이면 한 줄씩 따로 등록)', type:'textarea', placeholder:'예: 부가세 안내문 발송\n목록을 붙여넣어도 돼요', rows:4 }], { okText:'추가', wide:true });
  if(!r) return;
  const lines = splitPastedLines(r[0]);
  if(!lines.length) return;
  const list = (worklistChecklist[month] = worklistChecklist[month] || []);
  lines.forEach(text => {
    const item = { text, done:false, source:'user' };
    pushHist(item, '추가');
    list.push(item);
  });
  renderAll();
}

  return tasks.filter(t => !t.done && t.date < todayS && t.date >= from)
              .sort((a, b) => b.date.localeCompare(a.date))
              .filter(t => { const k = (t.text || '').trim(); if(ahead.has(k) || seen.has(k)) return false; seen.add(k); return true; })
              .sort((a, b) => a.date.localeCompare(b.date));
}
// 못한 일을 오늘로 옮김. 원래 날짜는 movedFrom 에 남겨 '9/23에서 넘어옴' 으로 표시.
function carryTaskToToday(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  if(!t.movedFrom) t.movedFrom = t.date;
  if(t.source === 'master') t.source = 'moved';   // 마스터 시트 다시 불러와도 지워지지 않도록
  pushHist(t, '오늘로 넘김', [{ label:'날짜', from:t.date, to:todayStr() }]);
  t.date = todayStr();
  renderAll();
}
async function carryAllToToday(){
  const list = carryCandidates();
  if(!list.length) return;
  if(!(await smConfirm(`못한 일 ${list.length}건을 오늘로 넘길까요?`, `최근 ${WL_CARRY_DAYS}일 동안 끝내지 못한 일이에요.`, { icon:'→', okText:'넘기기' }))) return;
  const todayS = todayStr();
  list.forEach(t => {
    if(!t.movedFrom) t.movedFrom = t.date;
    if(t.source === 'master') t.source = 'moved';
    pushHist(t, '오늘로 넘김', [{ label:'날짜', from:t.date, to:todayS }]);

  });

}
// 요청 배경: '못한 일 가져오기'(지난 일 → 오늘)와 별개로, 오늘(또는 앞으로) 적어 둔 일을 다음 날로 미루는 기능.
// 원래 날짜는 postponedFrom 에 남겨 분홍 점으로 표시(넘어온 일의 노란 점과 구분). 마스터 시트 항목은 다시 불러와도
// 원래 날짜에 되살아나지 않도록 수정한 항목과 같은 방식으로 처리.
const ICON_POSTPONE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M10 15h6"/><path d="M14 12.5l2.5 2.5-2.5 2.5"/></svg>';
function postponeOne(t){
  const to = addDaysStr(t.date, 1);
  if(!t.postponedFrom) t.postponedFrom = t.date;
  if(t.source === 'master'){ t.origKey = t.date + '|' + t.text; t.source = 'edited'; hideMasterKey('hiddenMasterTasks', t.origKey); }
  pushHist(t, '다음 날로 미룸', [{ label:'날짜', from:t.date, to }]);
  t.date = to;
}
function postponeTask(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  postponeOne(t);
  renderAll();
}
async function postponeDayLeft(date){
  const list = tasks.filter(t => t.date === date && !t.done);
  if(!list.length) return;
  const to = addDaysStr(date, 1);
  if(!(await smConfirm(`남은 일 ${list.length}건을 ${shortDate(to)}로 미룰까요?`, `${shortDate(date)}에 끝내지 못한 일이에요.`, { icon:'→', okText:'미루기' }))) return;
  list.forEach(postponeOne);

}
function toggleCarryList(){ worklistCarryOpen = !worklistCarryOpen; carryPicked.clear(); renderWorklistBody(); }
// 요청 배경: '골라서 넘기기' 목록의 체크를 누르면 완료 처리돼 목록에서 사라졌음. 여러 건을 골라 한 번에 넘기고 싶어서,
// 이 목록에서만 체크박스를 '넘길 일 고르기'로 쓰고, 고른 게 있으면 '모두 오늘로' 버튼이 '선택 N건 오늘로'로 바뀜.
const carryPicked = new Set();
function toggleCarryPick(id){ carryPicked.has(id) ? carryPicked.delete(id) : carryPicked.add(id); renderWorklistBody(); }
async function carrySelectedToToday(){
  const list = carryCandidates().filter(t => carryPicked.has(t.id));

  const todayS = todayStr();
  list.forEach(t => {
    if(!t.movedFrom) t.movedFrom = t.date;
    if(t.source === 'master') t.source = 'moved';
    pushHist(t, '오늘로 넘김', [{ label:'날짜', from:t.date, to:todayS }]);

function wlTaskItem(t, opts = {}){
  const todayS = todayStr();

  return `
    <li class="${t.done ? 'done' : ''}">
      ${opts.carryPick ? `<input type="checkbox" class="carry-pick" ${carryPicked.has(t.id) ? 'checked' : ''} onchange="toggleCarryPick(${t.id})" title="넘길 일로 고르기">` : `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">`}

      ${actionIcons(`editTask(${t.id})`, `showTaskHistory(${t.id})`, `deleteTask(${t.id})`).replace('<span class="row-actions">', '<span class="row-actions">' + ((!t.done && t.date >= todayS) ? `<button class="icon-btn" onclick="postponeTask(${t.id})" title="다음 날로 미루기" aria-label="다음 날로 미루기">${ICON_POSTPONE}</button>` : ''))}

// 할 일 월 달력(요청): 날짜마다 할 일 몇 건인지 + 앞의 2건까지 제목, 넘치면 '+N'. 날짜를 누르면 아래 Today 목록이 그 날로 바뀜
let wlCalYM = null;   // 'YYYY-MM'
function shiftWlCal(n){
  const [y, m] = (wlCalYM || (worklistViewDate || todayStr()).slice(0,7)).split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  wlCalYM = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  renderWlMonthCal();
}
function renderWlMonthCal(){
  const el = document.getElementById('wlMonthCal');
  if(!el) return;
  if(!wlCalYM) wlCalYM = (worklistViewDate || todayStr()).slice(0,7);
  const [y, m] = wlCalYM.split('-').map(Number);
  const first = new Date(y, m - 1, 1), startDow = first.getDay();
  const todayS = todayStr(), sel = wlHistDate || defaultWlHistDate();
  const cells = [];
  const startDate = addDaysStr(`${y}-${pad2(m)}-01`, -startDow);
  const lastDate = new Date(y, m, 0).getDate();
  const total = Math.ceil((startDow + lastDate) / 7) * 7;
  for(let i = 0; i < total; i++) cells.push(addDaysStr(startDate, i));
  const byDate = {};
  tasks.forEach(t => { if(t.date >= cells[0] && t.date <= cells[cells.length-1]) (byDate[t.date] = byDate[t.date] || []).push(t); });
  const dow = ['일','월','화','수','목','금','토'];
  const tjMarks = taxjCalMarks();   // 회사 공휴일·제외일정·내 근태(요청 2026.10.08)
  el.innerHTML = `
    <div class="notice-top"><span></span><div class="today-title">Month</div><span></span></div>
    <div class="wl-daynav">
      <button class="wl-navbtn" onclick="shiftWlCal(-1)" title="이전 달" aria-label="이전 달">‹</button>
      <div class="wl-daynav-label">${y}년 ${m}월</div>
      <button class="wl-navbtn" onclick="shiftWlCal(1)" title="다음 달" aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid wl-mcal-grid">
      ${dow.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(ds => {
        const list = (byDate[ds] || []).slice().sort((a, b) => (a.done - b.done));
        const left = list.filter(t => !t.done).length;
        const shown = list.slice(0, 2);   // 칸을 낮게(3단 배치) - 제목 2건까지
        const mk = (tjMarks || {})[ds];
        return `
        <div class="cal-day ${ds === todayS ? 'today' : ''} ${ds.slice(0,7) !== wlCalYM ? 'other' : ''} ${ds === sel ? 'wl-sel' : ''}" onclick="setWlHistDay('${ds}', true)" title="${list.length ? `${list.length}건 · 남은 일 ${left}건` : ''}">
          <div class="wl-mcal-top"><div class="cal-daynum ${mk && mk.hol ? 'tj-hol' : ''}">${parseInt(ds.slice(8), 10)}${mk && mk.hol ? `<span class="tj-holname">${taxjEsc(mk.hol)}</span>` : ''}</div>${list.length ? `<span class="wl-mcal-cnt ${left ? '' : 'all-done'}">${list.length}</span>` : ''}</div>
          ${taxjCalItemsHtml(mk)}
          <div class="cal-tasks" style="max-height:none;">
            ${shown.map(t => `<div class="wl-ct ${t.done ? 'done' : ''}">${escapeAttr(t.text)}</div>`).join('')}
            ${list.length > 2 ? `<div class="wl-mcal-more">+${list.length - 2}건 더</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// 요청 배경(2026.10.06): 달력은 '지난 할 일 돌아보기'용. 날짜를 누르면 Today는 오늘 그대로 두고,
// 달력 아래 'History' 카드에 그날 할 일 전체(완료·못한 일·메모)를 보여줌. 처음엔 오늘 이전에 할 일이 있었던 가장 최근 날.
let wlHistDate = null;
function defaultWlHistDate(){
  const todayS = todayStr();
  const past = tasks.filter(t => t.date < todayS).map(t => t.date).sort();
  return past.length ? past[past.length - 1] : addDaysStr(todayS, -1);
}
// 요청 배경(2026.10.08): History 카드 오른쪽 위 + 아이콘을 누르면 할 일 등록 팝업. 날짜는 보고 있는 날로 채워둠.
// 내용에 여러 줄을 적거나 붙여넣으면 한 줄씩 건별로 등록(메모는 한 건일 때만 붙임).
const ICON_BULK = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 15l2.3 2.3 4.7-4.6"/></svg>';   // [2026.10.16] 날짜 일괄 입력
const ICON_PLUS = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
async function addTaskPopup(dateStr){
  const r = await smForm('할 일 추가', [
    { label:'날짜', type:'date', value:dateStr || todayStr() },
    { label:'할 일 (여러 줄이면 한 줄씩 따로 등록)', type:'textarea', placeholder:'할 일을 입력하거나 목록을 붙여넣으세요', rows:4 },
    { label:'메모 · 비고 (선택)', type:'textarea', placeholder:'진행 상황, 연락처, 참고할 내용 등', rows:2 },
  ], { okText:'추가', wide:true });
  if(!r) return;
  const date = r[0] || dateStr || todayStr();
  const lines = splitPastedLines(r[1]);
  if(!lines.length) return;
  const note = (r[2] || '').trim();

// [2026.10.15] "홈에 메모장 - 급하게 메모, 목록도 기록되고 검색도"(요청) - 적으면 날짜·시간과 함께 목록에 쌓이고(최신 위), 검색·수정·삭제
let wlMemoSearch = '', wlMemoOpen = false;   // [2026.10.16] 평소엔 접힘(요청)
function wlMemoNow(){ const d = new Date(); return `${todayStr()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

async function wlMemoEdit(id){

async function wlMemoDelete(id){

function wlMemoOnSearch(v){ wlMemoSearch = v; renderWlMemo(); const s = document.getElementById('wlMemoSearch'); if(s){ s.focus(); s.setSelectionRange(v.length, v.length); } }

}
// [2026.10.15] "메모도 등록일자별로 목록형, 수정 버튼은 위에"(요청) - 등록한 날짜별로 묶어(최신 날짜 위) 날짜 제목 아래 시간·수정·삭제 줄, 그 아래 내용
function wlMemoGroups(list){
  const g = {};
  list.forEach(m => { const d = String(m.at).slice(0,10); (g[d] = g[d] || []).push(m); });
  return Object.keys(g).sort().reverse().map(d => [d, g[d]]);
}
// 세 칸 높이를 화면 맨 아래(24px 위)까지 맞춤. 너무 작은 창에서는 최소 560px
function fitWorklistHeight(){
  const lay = document.querySelector('#tab-worklist .wl-layout');
  if(!lay) return;
  const top = lay.getBoundingClientRect().top + window.scrollY;

let wlSwipeBound = false;
function bindWorklistSwipe(){
  const el = document.getElementById('worklistAgenda');
  if(!el) return;
  let sx = null, sy = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if(sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && !worklistSearch.trim()) shiftWorklistDay(dx < 0 ? 1 : -1);
  }, {passive:true});
  if(!wlSwipeBound){
    wlSwipeBound = true;
    document.addEventListener('keydown', e => {
      if(typeof activeTab === 'undefined' || activeTab !== 'home') return;   // [2026.10.15] To do 화면은 홈에서 보임
      const tag = (e.target.tagName || '').toLowerCase();
      if(tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      if(e.key === 'ArrowLeft'){ shiftWorklistDay(-1); e.preventDefault(); }
      if(e.key === 'ArrowRight'){ shiftWorklistDay(1); e.preventDefault(); }
    });
  }
}

function ensureTaxRows(){
  const def = {
    vat: () => ({target:true, office:'', sales:0, purchase:0, filedDate:'', paidDate:'', note:''}),
    pay: () => ({salaryType:'근로', payday:'', closed:false, filedDate:'', paidSlipDate:'', note:''}),
    corp: () => ({steps:Object.fromEntries(corpSteps.map(s=>[s,''])), note:''}),
    indiv: () => ({honest:false, steps:Object.fromEntries(indivSteps.map(s=>[s,''])), note:''}),
  };
  const fill = (store, key, list, mk) => { store[key] = store[key] || {}; list.forEach(c => { if(!store[key][c.id]) store[key][c.id] = mk(); }); };
  // 한 번만: 예전 예시 데이터(없어진 거래처 번호) 정리
  if(sheetLoadedOnce && clients.length && !settings.taxCleanV1){
    const ids = new Set(clients.map(c => String(c.id)));
    [vatData, payData, corpData, indivData].forEach(store => Object.values(store).forEach(per => {
      Object.keys(per || {}).forEach(id => { if(!ids.has(String(id))) delete per[id]; });
    }));
    settings.taxCleanV1 = true;
  }
  if(currentVatPeriod) fill(vatData, currentVatPeriod, clients, def.vat);
  if(currentPayMonth) fill(payData, currentPayMonth, clients, def.pay);
  if(typeof currentCorpYear !== 'undefined' && currentCorpYear) fill(corpData, currentCorpYear, corpClients(), def.corp);

}
// 원천세: 이번 달·다음 달이 목록에 없으면 자동 추가 (신고기한 = 다음 달 10일)
function ensurePayMonths(){
  const now = new Date();
  [0, -1].forEach(off => {
    const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
    const key = `${d.getMonth() + 1}월`;
    if(!payMonths.includes(key)){
      payMonths.push(key);
      const due = new Date(d.getFullYear(), d.getMonth() + 1, 10);
      payDue[key] = `${due.getFullYear()}-${pad2(due.getMonth()+1)}-${pad2(due.getDate())}`;
    }
  });
}

const VAT_T_PERIODS = ['1기예정','1기확정','2기예정','2기확정'];   // Tax.J VAT_TARGET_PERIODS

let vatYear = '', vatHalf = '1', vatKind = 'pre', vatQuery = '', vatSeg = 'all', vatProgSeg = 'all';
function vatTEntry(docs, cid, year, period){ return (((docs.s__vatFilingTargets || {})[cid] || {})[year] || {})[period] || null; }
// Tax.J vatEntryStatus와 같음: 확정 = target/not-target, 예정 = filing/notice/notice-excluded/not-target(개인 기본 예정고지, 법인 기본 미대상)
function vatTStatus(en, period, entityType){
  en = en || {};
  if(!period.endsWith('예정')) return en.applicable === false ? 'not-target' : 'target';
  if(en.status) return en.status;
  if(en.applicable) return 'filing';
  if(en.expectedNotice) return 'notice';
  return entityType === '개인' ? 'notice' : 'not-target';
}
function vatTFiling(docs, cid, year, period){ return (((docs.s__filingStatus || {})['부가세'] || {})[`${year}-${VAT_T_Q[period]}`] || {})[cid] || null; }
function vatTDue(year, period){ const [m, d] = VAT_T_DUE[period]; return new Date(Number(year) + (period === '2기확정' ? 1 : 0), m - 1, d); }
// Tax.J vatFocusFiling과 같음: 신고기한이 오늘 이후인 가장 가까운 기수
function vatTFocus(docs){
  const t = new Date(todayStr() + 'T00:00:00'), y = t.getFullYear(), cands = [];
  [y - 1, y].forEach(yy => VAT_T_PERIODS.forEach(p => cands.push({ year: String(yy), period: p, due: vatTDue(yy, p) })));
  cands.sort((a, b) => a.due - b.due);
  const f = cands.find(c => c.due >= t) || cands[cands.length - 1];
  let total = 0, done = 0;
  if(docs) taxjClientIndex(docs).sorted.filter(payIsReg).forEach(c => {

    total++; if((vatTFiling(docs, c.id, f.year, f.period) || {}).status === '신고완료') done++;

function vatTPeriod(){ return `${vatHalf}기${vatKind === 'pre' ? '예정' : '확정'}`; }

function vatTComb(docs, cid, year, period, entityType){ if(!/확정$/.test(period || '')) return false; const pre = period.replace(/확정$/, '예정'); return vatTStatus(vatTEntry(docs, cid, year, pre), pre, entityType) !== 'filing'; }
function vatTMemoNum(t){ const lines = String(t || '').split('\n').map(x => x.replace(/\s+$/, '')).filter(x => x.trim()); if(lines.length < 2) return (lines[0] || '').replace(/^\s*\d+\)\s*/, ''); let n = 0; return lines.map(x => /^\s{2,}/.test(x) ? x : `${++n}) ${x.replace(/^\s*\d+\)\s*/, '')}`).join('\n'); }

function vatTHelp(docs, cid){ const v = ((docs.s__vatFilingTargets || {})[cid] || {}).__help; return !v ? {} : typeof v === 'string' ? { memo: v } : v; }
function vatTHelpRows(h, year, period, comb){

  const RG = { '1기예정':['01-01','03-31'], '1기확정':['04-01','06-30'], '2기예정':['07-01','09-30'], '2기확정':['10-01','12-31'] }[period] || ['',''];

//   메모(목록) = 한 줄이 한 항목('\n'으로 이어 저장 - 예전 글자 값도 그대로 읽힘). 칸에는 아이콘 + 개수, 마우스를 올리면 번호 목록, 누르면 목록 창(추가·삭제)
function closeMemoLines(v){ return String(v == null ? '' : v).split('\n').map(x => x.trim()).filter(Boolean); }
function closeMemoBtn(cid, colId, v){
  const L = closeMemoLines(v);
  return `<button type="button" class="cl-dt vp-dt vp-memo${L.length ? ' has' : ''}" data-cid="${cid}" data-col="${colId}" title="${escapeAttr(L.length ? L.map((x, i) => `${i + 1}) ${x}`).join('\n') : '메모 입력')}" aria-label="메모" onclick="closeMemoPop(this)">${ICON_MEMO_DOC}${L.length ? `<span class="vt-ic-n">${L.length}</span>` : ''}</button>`;
}
function closeMemoPop(btn){
  closeDatePopClose();
  const { cid, col } = btn.dataset;
  let items = closeMemoLines(closeGet(cid, col));
  const pop = document.createElement('div');
  pop.id = 'closeDatePop'; pop.className = 'cl-pop'; pop.style.width = '320px';
  const draw = () => {
    pop.innerHTML = `<div style="font-weight:800; font-size:12.5px;">메모 ${items.length ? `<span class="hint" style="margin:0; display:inline;">${items.length}개</span>` : ''}</div>
      <div style="max-height:260px; overflow:auto; display:flex; flex-direction:column; gap:4px;">${items.length ? items.map((x, i) => `<div style="display:flex; gap:6px; align-items:flex-start; font-size:12.5px; line-height:1.45;"><span style="color:var(--muted); font-weight:700; min-width:18px;">${i + 1})</span><span style="flex:1; white-space:pre-wrap; word-break:break-all;">${taxjEsc(x)}</span><button type="button" data-del="${i}" title="이 줄 지우기" style="border:none; background:none; color:var(--muted-soft); cursor:pointer; padding:0 2px;">✕</button></div>`).join('') : '<div class="hint" style="margin:0;">아직 메모가 없어요.</div>'}</div>
      <input type="text" class="cl-pop-text cl-memo-add" placeholder="새 메모 입력 후 Enter (추가)" style="font:inherit; font-size:12.5px; border:1px solid var(--border); border-radius:8px; padding:6px 8px;">`;
    pop.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); items.splice(Number(b.dataset.del), 1); save(); draw(); });
    const inp = pop.querySelector('.cl-memo-add');
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); const t = inp.value.trim(); if(t){ items.push(t); save(); draw(); pop.querySelector('.cl-memo-add').focus(); } } if(e.key === 'Escape') closeDatePopClose(); });
    inp.focus();
  };
  const save = () => {
    closeSetVal(cid, col, items.join('\n'));
    btn.classList.toggle('has', items.length > 0);
    btn.title = items.length ? items.map((x, i) => `${i + 1}) ${x}`).join('\n') : '메모 입력';
    btn.innerHTML = ICON_MEMO_DOC + (items.length ? `<span class="vt-ic-n">${items.length}</span>` : '');
  };
  draw();
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.right - pw)) + 'px';
  pop.style.top = (r.bottom + ph + 8 > window.innerHeight ? Math.max(8, r.top - ph - 4) : r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('mousedown', closeDatePopOutside, true), 0);
}
// 한 번만: '비고'와 '메모' 두 항목이 따로 있으면 '비고' 하나(메모(목록))로 합침 - 회차마다 비고 줄 + 메모 줄을 이어 붙임(메모 값은 지우지 않고 남겨 둠)
function closeMergeMemoCols(){
  const bi = closeCols.find(c => String(c.label).trim() === '비고'), me = closeCols.find(c => String(c.label).trim() === '메모');
  if(!bi || !me || bi === me) return false;
  Object.values(closeData).forEach(d => Object.values((d && d.v) || {}).forEach(r => {
    const L = closeMemoLines(r[bi.id]).concat(closeMemoLines(r[me.id]).filter(x => !closeMemoLines(r[bi.id]).includes(x)));
    if(L.length) r[bi.id] = L.join('\n');
  }));
  bi.type = 'memo';
  closeCols = closeCols.filter(c => c !== me);
  scheduleGoogleSave();
  return true;
}
function renderClose(){
  try{ closeMergeMemoCols(); }catch(e){ console.warn('결산 비고·메모 합치기', e); }
  const el = document.getElementById('tab-close');
  if(!el) return;
  const a = document.activeElement;
  if(a && el.contains(a) && a.classList && a.classList.contains('vp-in')){
    if(!a._closeDefer){ a._closeDefer = true; a.addEventListener('blur', () => setTimeout(renderClose, 0), { once:true }); }
    return;
  }
  if(!taxjFull && !taxjFullRestoreTried) taxjRestoreFull();
  const docs = taxjFull && taxjFull.docs;
  if(!closeYear){ const lk = closeLatestKey(); closeYear = lk ? lk.split('-')[0] : String(new Date().getFullYear()); }
  const rounds = closeRounds(closeYear);
  if(!rounds.includes(closeRound)) closeRound = rounds[rounds.length - 1] || '';
  const key = closeKey(), d = closeData[key];
  const nowY = new Date().getFullYear(), years = new Set([closeYear]);
  Object.keys(closeData).forEach(k => years.add(k.split('-')[0]));
  for(let y = nowY + 1; y >= nowY - 2; y--) years.add(String(y));
  const sig = `${closeYear}|${closeRound}`;
  const keep = el._closeSig === sig ? [...el.querySelectorAll('.table-scroll')].map(x => [x.scrollLeft, x.scrollTop]) : [];
  el.innerHTML = `<div class="card">${taxjLiveBarHtml()}
    <div class="toolbar" style="justify-content:center;">
      <select onchange="closeYear=this.value; closeRound=''; closePicked=new Set(); renderClose();">${[...years].sort((a, b) => b - a).map(y => `<option value="${y}" ${y === closeYear ? 'selected' : ''}>${y}년</option>`).join('')}</select>
      ${rounds.length ? `<select onchange="closeRound=this.value; closePicked=new Set(); renderClose();">${rounds.map(r => `<option value="${r}" ${r === closeRound ? 'selected' : ''}>${r}차</option>`).join('')}</select>` : ''}
      ${d ? `<label class="cl-date-lab">결산일 <input type="date" value="${escapeAttr(d.date || '')}" onchange="closeSetDate(this.value)"></label>` : ''}
      <input type="text" placeholder="거래처 검색" value="${escapeAttr(closeQuery)}" oninput="closeQuery=this.value; clearTimeout(window._closeQT); window._closeQT=setTimeout(()=>{ renderClose(); const s=document.querySelector('#tab-close input[placeholder=&quot;거래처 검색&quot;]'); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250);">
    </div>
    <div class="toolbar"><div class="spacer"></div>
      <button class="btn primary xs" onclick="closeNewRound()">+ 새 회차</button>
      ${d ? `<button class="sm-tool-ic" onclick="closeBulk()" title="날짜 일괄 입력 - 왼쪽 체크박스로 고른 거래처(없으면 보이는 전체)에 오늘 또는 고른 날짜를 넣어요" aria-label="날짜 일괄 입력">${ICON_BULK}</button>` : ''}
      <button class="sm-tool-ic" onclick="closeAddCol()" title="항목 추가" aria-label="항목 추가">${ICON_PLUS}</button>
      <button class="btn ghost xs" onclick="document.getElementById('closeXlsx').click()" title="1행 = 항목 이름인 결산 엑셀을 고른 회차(없으면 새 회차)에 넣어요">엑셀 올리기</button><input type="file" id="closeXlsx" accept=".xlsx,.xls" style="display:none;" onchange="closeImport(this)">
      ${d ? '<button class="btn ghost xs danger" onclick="closeDeleteRound()">회차 삭제</button>' : ''}
    </div>
    ${d ? closeTableHtml(docs) : `<div class="empty">${closeYear}년 결산 회차가 아직 없어요.<br>'+ 새 회차'를 누르면 그날 수임 중인 거래처로 만들어요. 엑셀이 있으면 '엑셀 올리기'로 바로 넣어도 돼요.</div>`}
  </div>`;
  el._closeSig = sig; el.classList.toggle('vat-wide', !!d);
  if(keep.length) [...el.querySelectorAll('.table-scroll')].forEach((x, i) => { if(keep[i]){ x.scrollLeft = keep[i][0]; x.scrollTop = keep[i][1]; } });
}

// 할 일 내용에서 거래처 찾기용 짧은 이름 ("주식회사 나우이엔지" → "나우이엔지", "나우")
function clientKeywords(c){
  const base = String(c.name || '').replace(/주식회사|\(주\)|주\)|㈜|유한회사|협동조합|사무소|\s+/g, '').trim();
  const words = new Set([base]);
  if(base.length >= 4) words.add(base.slice(0, 2));
  return [...words].filter(w => w.length >= 2);
}
// [2026.10.14] "회사웹처럼 상세정보가 뜨면 좋겠다, 할 일 관련 정보는 필요 없다"(요청) - 회사웹(Tax.J) 거래처 상세정보와 같은 구획
// (기본정보·대표자 정보·실무자 정보·수임정보)을 회사웹 실시간 자료로 보여주고, 신고 현황은 그대로, 남은 할 일·최근 끝낸 일은 뺌.
// 회사웹 거래처는 사업자번호(없으면 상호)로 찾고, 못 찾으면(연결 전 등) 이 앱에 가져와 둔 값으로 보여줌
function openClientDetail(id){
  const c = clients.find(x => x.id === id);
  if(!c) return;
  const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const v = (vatData[currentVatPeriod] || {})[c.id], p = (payData[currentPayMonth] || {})[c.id];
  const co = (corpData[currentCorpYear] || {})[c.id], iv = (indivData[currentIndivYear] || {})[c.id];
  const stepText = (st, steps) => { if(!st) return '-'; const last = steps.filter(x => st.steps && st.steps[x]).pop(); return last ? `${last} 완료` : '시작 전'; };
  const docs = taxjFull && taxjFull.docs, digits = x => String(x || '').replace(/[^0-9]/g, '');
  const list = docs ? ((docs.s__clients || {}).list || []) : [];
  const t = list.find(x => digits(c.biz) && digits(x.bizNo) === digits(c.biz)) || list.find(x => taxjNormName(x.name) === taxjNormName(c.name)) || null;
  const row = (label, val) => `<div><span>${esc(label)}</span><b>${val == null || val === '' ? '-' : esc(val)}</b></div>`;
  const sec = (title, rows) => `<div class="cd-sec">${title}</div><div class="cd-grid">${rows}</div>`;
  let info;
  if(t){
    const subTags = Array.isArray(t.subTags) ? t.subTags.map(x => (x && x.key) || x).filter(Boolean).join(', ') : '';
    info = sec('기본정보', row('구분', t.entityType) + row('상세구분', subTags) + row('사업자번호', innerBizNo(t.bizNo || '')) + (t.entityType === '법인' ? row('법인등록번호', t.corpRegNo) : '')
      + row('사업장 주소', t.bizAddress) + row('개업일', t.openDate) + (t.entityType !== '개인' ? row('설립일', t.foundingDate) : '') + row('업종코드', t.bizTypeCode) + row('업태', t.bizType));
    info += sec('대표자 정보', row('대표자', t.repName) + row('주민번호', t.repSsn) + row('연락처', t.repPhone) + row('이메일', t.repEmail));
    const contacts = (t.contacts && t.contacts.length) ? t.contacts : (t.contact || t.phone || t.email) ? [{ name: t.contact, phone: t.phone, email: t.email }] : [];
    info += sec('실무자 정보', t.contactSameAsRep ? row('실무자', '대표자와 동일') : !contacts.length ? row('등록 인원', '없음')
      : contacts.map((x, k) => { const n = contacts.length > 1 ? k + 1 : ''; return row(`실무자${n} 이름`, x.name) + row(`실무자${n} 연락처`, x.phone) + row(`실무자${n} 이메일`, x.email); }).join(''));
    const taxTypeDisp = ['기타','용역대행','단건신고'].includes(t.taxType) && t.taxTypeEtc ? `${t.taxType} (${t.taxTypeEtc})` : t.taxType;
    const prog = t.program === '기타' ? (t.programEtc || '기타') : (t.program && t.program !== '없음' ? t.program : '');
    let hire = row('수임구분', taxTypeDisp) + row('수임료', t.fee ? Number(t.fee).toLocaleString() + '원' : '') + row('계약일', t.contractDate) + row('수임시작일', t.start)
      + row('프로그램', prog) + row('회사코드', t.companyCode) + row('진행상황', t.status);
    if(t.status === '해지') hire += row('해지사유', t.terminationReason === '기타' && t.terminationReasonEtc ? `기타 (${t.terminationReasonEtc})` : t.terminationReason) + row('해지일', t.terminationDate) + row('종료월', t.terminationMonth);
    info += sec('수임정보', hire);
  }else{
    info = `<div class="hint" style="margin:0 0 6px;">${docs ? '회사웹에서 이 거래처를 찾지 못해서' : 'Tax.J에 연결하기 전이라'} 가져와 둔 값만 보여요.</div>`
      + sec('기본정보', row('구분', c.type) + row('대표자', c.ceo) + row('사업자번호', c.biz) + row('법인등록번호', c.corpNo) + row('개업일', c.openDate) + row('수임료', c.fee));
  }
  const html = `${info.replace('<div class="cd-sec">', '<div class="cd-sec" style="margin-top:0; border-top:none; padding-top:0;">')}
    <div class="cd-sec">신고 현황</div>
    <div class="cd-tax">
      <div><span>부가세 ${esc(currentVatPeriod)}</span><b>${v ? (v.target ? (v.filedDate ? '신고 완료' : '미신고') : '대상 아님') : '-'}</b></div>
      <div><span>원천세 ${esc(currentPayMonth)}</span><b>${p ? (p.filedDate ? '신고 완료' : '미신고') : '-'}</b></div>
      ${c.type === '법인' ? `<div><span>법인세 ${esc(currentCorpYear)}</span><b>${stepText(co, corpSteps)}</b></div>` : `<div><span>종소세 ${esc(currentIndivYear)}</span><b>${stepText(iv, indivSteps)}</b></div>`}
    </div>
    <div class="ev-actions" style="margin-top:14px;">
      <button class="btn" onclick="document.querySelector('.sm-modal-ok').click(); setTimeout(() => editClient(${c.id}), 180);">${ICON_EDIT} 수정</button>
      <button class="btn" onclick="document.querySelector('.sm-modal-ok').click(); setTimeout(() => showClientHistory(${c.id}), 180);">${ICON_HISTORY} 이력</button>
    </div>`;
  smDialog({ title: c.name, html, icon:'🏢', cancelText:null, okText:'닫기', wide:true });
}

/* ===== Tax.J "엑셀 일괄 다운로드" 파일에서 기장거래처 가져오기 =====
   Tax.J 엑셀의 "기장거래처" 시트(없으면 첫 시트에서 구분="기장"인 줄)를 읽어 이 앱 거래처 목록을 Tax.J와 같게 맞춤.
   개인정보 칸(주민번호·연락처 등)은 읽지 않음. */
async function importTaxjExcel(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    if(typeof XLSX === 'undefined'){
      await new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; el.onload = res; el.onerror = () => rej(new Error('엑셀 읽기 도구를 불러오지 못했어요')); document.head.appendChild(el); });
    }
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const sheetName = wb.SheetNames.find(n => n.includes('기장거래처')) || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:false, defval:'' });
    const head = (rows[0] || []).map(v => String(v).replace(/\s+/g, ''));
    const col = (...names) => head.findIndex(h => names.includes(h));
    const iSeq = col('#','순번'), iName = col('상호명','상호'), iGroup = col('구분'), iEntity = col('사업자유형','사업자구분'),
          iTax = col('세목','수임구분'), iStatus = col('상태'), iBiz = col('사업자등록번호','사업자번호'), iCorp = col('법인등록번호'),
          iOpen = col('개업일'), iCeo = col('대표자명','대표자');
    // 수임료·계약일·수임시작일·해지 정보: 제목으로 찾고, 없으면 Tax.J 엑셀의 칸 위치(21~26번째)로
    const byPos = (names, pos) => { const i = col(...names); return i >= 0 ? i : (head.length > pos ? pos : -1); };
    const iFee = byPos(['수임료'], 20), iContract = byPos(['계약일'], 21), iStart = byPos(['수임시작일','시작일'], 22),
          iTermReason = byPos(['해지사유'], 23), iTermDate = byPos(['해지일'], 24), iTermMonth = byPos(['종료월'], 25);
    if(iName < 0) throw new Error(`"${sheetName}" 시트에서 "상호명" 제목을 찾지 못했어요. Tax.J 엑셀 일괄 다운로드 파일인지 확인해주세요.`);
    const g = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '';
    const body = rows.slice(1).filter(r => g(r, iName));
    const regular = body.filter(r => {
      if(iGroup >= 0 && g(r, iGroup)) return g(r, iGroup) === '기장';
      const t = g(r, iTax); return (t === '기장대행' || t === '신고대리') && g(r, iStatus) !== '해지';
    });
    if(!regular.length) throw new Error('기장거래처를 한 건도 찾지 못했어요.');
    const incomingList = regular.map((r, idx) => {
      const feeRaw = g(r, iFee).replace(/[^0-9]/g, '');
      return {
        seq: g(r, iSeq) || String(idx + 1), taxType: g(r, iTax).replace(/^기타\((.*)\)$/, '$1'),
        type: g(r, iEntity).startsWith('법인') ? '법인' : '개인', name: g(r, iName), biz: g(r, iBiz), corpNo: g(r, iCorp),
        ceo: g(r, iCeo), fee: feeRaw ? Number(feeRaw).toLocaleString() : '', contractDate: g(r, iContract), start: g(r, iStart), openDate: g(r, iOpen),
      };
    });
    const allName = wb.SheetNames.find(n => n.includes('전체거래처'));
    const allRows = allName ? XLSX.utils.sheet_to_json(wb.Sheets[allName], { header:1, raw:false, defval:'' }).slice(1) : body;
    const plain = (r, i) => {
      const feeRaw = g(r, iFee).replace(/[^0-9]/g, '');
      return { seq: String(i + 1), taxType: g(r, iTax).replace(/^기타\((.*)\)$/, '$1'), type: g(r, iEntity).startsWith('법인') ? '법인' : '개인',
        name: g(r, iName), biz: g(r, iBiz), corpNo: g(r, iCorp), ceo: g(r, iCeo), fee: feeRaw ? Number(feeRaw).toLocaleString() : '',
        contractDate: g(r, iContract), start: g(r, iStart), terminationDate: g(r, iTermDate), terminationMonth: g(r, iTermMonth), terminationReason: g(r, iTermReason) };
    };
    const groupOf = r => g(r, iGroup) || (g(r, iStatus) === '해지' ? '해지' : (['기장대행','신고대리'].includes(g(r, iTax)) ? '기장' : '기타'));
    await taxjApplyClients(incomingList,
      allRows.filter(r => g(r, iName) && groupOf(r) === '기타').map(plain),
      allRows.filter(r => g(r, iName) && groupOf(r) === '해지').map(plain),
      `"${sheetName}" 시트에서 읽었어요.`, 'Tax.J 엑셀에서 가져옴');
  }catch(e){
    console.error(e);
    smAlert('엑셀을 가져오지 못했어요', e.message || String(e), { tone:'danger' });
  }
}
// [2026.10.06] 엑셀 가져오기와 Tax.J 실시간 불러오기가 같이 쓰는 '맞추기' - 사업자번호(없으면 상호명)로 같은 거래처를 찾아
// 여기서 직접 수정한 칸(overrides)은 그대로 두고 나머지만 Tax.J 값으로 바꿈. 바뀐 칸은 이력에 남김
async function taxjApplyClients(incomingList, otherList, termList, fromDesc, addKind){
  {
    const digits = v => String(v || '').replace(/\D/g, '');
    const byBiz = {}, byName = {};
    clients.forEach(c => { if(digits(c.biz)) byBiz[digits(c.biz)] = c; byName[c.name] = c; });
    const LABEL = { seq:'순번', taxType:'수임구분', type:'사업자구분', name:'상호명', biz:'사업자번호', corpNo:'법인등록번호', ceo:'대표자', fee:'수임료', contractDate:'계약일', start:'수임시작일', openDate:'개업일' };
    const nowIso = new Date().toISOString(), used = new Set();
    // 요청 배경(2026.10.08): 가져올 때 '업데이트된 내용만'(직접 고친 칸 유지, 기본) / '원데이터'(직접 고친 칸 모두 지우고 Tax.J 값으로)를 고를 수 있게 함.
    // 원데이터는 위험해서 확인창의 '고급 기능'을 펼쳐야 고를 수 있고, 고르면 한 번 더 확인받음.
    const editedClients = clients.filter(c => Object.keys(c.overrides || {}).length);
    let rawMode = false;
    const buildMerged = () => { used.clear(); return incomingList.map((incoming) => {
      const old = byBiz[digits(incoming.biz)] || byName[incoming.name];
      if(old) used.add(old);
      const base = old ? { ...old } : { id: nextClientId++, history: [{ at: nowIso, kind: addKind, changes: [] }] };
      base.source = 'taxj';
      if(rawMode && old && Object.keys(base.overrides || {}).length){ base.overrides = {}; base.history = (base.history || []).concat([{ at: nowIso, kind:'원데이터로 가져옴 (직접 수정 해제)', changes: [] }]); }
      const ov = base.overrides || {}, changes = [];
      Object.keys(incoming).forEach(k => {
        if(ov[k]) return;
        const from = old ? (old[k] || '') : '';
        if(old && from !== incoming[k] && k !== 'seq') changes.push({ label: LABEL[k], from, to: incoming[k] });
        base[k] = incoming[k];
      });
      if(old && changes.length) base.history = (base.history || []).concat([{ at: nowIso, kind:'Tax.J 반영', changes }]);
      return base;
    }); };
    buildMerged();
    const dropped = clients.filter(c => !used.has(c) && c.source);          // Tax.J 기장거래처에 없는 예전 가져온 거래처
    const keepManual = clients.filter(c => !used.has(c) && !c.source && !(typeof c.id === 'number' && c.id <= 8 && /^(110-81|220-11)-\d{5}$/.test(c.biz || '')));
    const hEsc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    window._taxjRawMode = false;
    const ok = await smDialog({ title:`기장거래처 ${incomingList.length}건으로 맞출까요?`, icon:'↓', okText:'가져오기', html: `
      <div>${hEsc(fromDesc)}${dropped.length ? `<br>Tax.J 기장거래처에 없는 ${dropped.length}건은 목록에서 빠져요.` : ''}<br>여기서 직접 수정한 칸은 그대로 남아요.</div>
      <details style="margin-top:12px; text-align:left;">
        <summary style="cursor:pointer; font-weight:700;">고급 기능</summary>
        <label style="display:flex; gap:6px; align-items:flex-start; margin-top:8px;"><input type="radio" name="taxjMode" checked onchange="window._taxjRawMode=false"><span><b>업데이트된 내용만 가져오기</b> (기본, 직접 고친 칸 유지)</span></label>
        <label style="display:flex; gap:6px; align-items:flex-start; margin-top:6px; color:#e2445c;"><input type="radio" name="taxjMode" onchange="window._taxjRawMode=true"><span><b>원데이터 가져오기</b> (직접 고친 칸을 모두 지우고 Tax.J 값으로 바꿔요${editedClients.length ? ` · 고친 거래처 ${editedClients.length}곳` : ''})</span></label>
      </details>` });
    if(!ok) return;
    if(window._taxjRawMode){
      if(!(await smConfirm('원데이터로 가져올까요?', editedClients.length
        ? `직접 고친 칸이 있는 거래처 ${editedClients.length}곳(${editedClients.slice(0,5).map(c => c.name).join(', ')}${editedClients.length > 5 ? ' 등' : ''})의 수정 내용이 모두 Tax.J 값으로 바뀌어요.\n되돌릴 수 없어요.`
        : '직접 고친 칸이 없어서 업데이트만 가져오는 것과 결과가 같아요.', { tone:'danger', icon:'!', okText:'원데이터로 가져오기' }))) return;
      rawMode = true;
    }
    const merged = buildMerged();
    clients = merged.concat(keepManual);
    clientsOther = otherList;
    clientsTerminated = termList;
    const d = new Date();
    settings.taxjImportedAt = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    renderAll();
    smAlert('Tax.J 거래처를 가져왔어요', `기장 ${merged.length}건 · 기타 ${clientsOther.length}건 · 해지 ${clientsTerminated.length}건\nTax.J와 같은 순서(법인 → 개인, 기장대행 → 신고대리)예요.`, { icon:'✓' });
  }
}

function sortedClients(){
  const n = v => { const x = parseInt(String(v || '').replace(/\D/g, ''), 10); return isNaN(x) ? Infinity : x; };
  return [...clients].sort((a, b) => n(a.seq) - n(b.seq) || String(a.name).localeCompare(String(b.name), 'ko'));
}

async function editClient(id){
  const c = clients.find(x => x.id === id);
  if(!c) return;
  const fields = [
    { key:'seq', label:'순번' },
    { key:'taxType', label:'수임구분', options:['기장대행','신고대리','기타'] },
    { key:'type', label:'사업자구분', options:['법인','개인'] },
    { key:'name', label:'상호명' },
    { key:'biz', label:'사업자번호', placeholder:'000-00-00000' },
    { key:'corpNo', label:'법인등록번호', placeholder:'000000-0000000' },
    { key:'ceo', label:'대표자' },
    { key:'fee', label:'수임료' },
    { key:'contractDate', label:'계약일', type:'date' },
    { key:'start', label:'수임시작일', type:'date' },
  ];
  const r = await smForm(`${c.name} 수정`, fields.map(f => ({ ...f, value: c[f.key] || '' })), { okText:'저장', icon:'✎', wide:true });
  if(!r) return;
  const changes = [];
  fields.forEach((f, i) => {
    const to = (r[i] || '').trim(), from = c[f.key] || '';
    if(to !== from){ changes.push({ field:f.key, label:f.label, from, to }); c[f.key] = to; }
  });
  if(!changes.length) return;
  if(!c.name) c.name = changes.find(x => x.field === 'name')?.from || '(이름 없음)';
  c.overrides = Object.assign({}, c.overrides || {}, Object.fromEntries(changes.map(x => [x.field, true])));
  c.history = (c.history || []).concat([{ at: new Date().toISOString(), kind:'직접 수정', changes }]);
  renderAll();
}

function showClientHistory(id){
  const c = clients.find(x => x.id === id);
  if(!c) return;
  const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const fmt = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const hist = (c.history || []).slice().reverse();
  const edited = Object.keys(c.overrides || {});
  const html = `
    <div class="cl-hist">
      <div class="cl-hist-meta">출처: ${c.source === 'master' ? '마스터 시트(★Tax_2026)' : '직접 추가'}${edited.length ? ` · 직접 수정한 칸은 마스터를 다시 가져와도 유지돼요` : ''}</div>
      ${hist.length ? hist.map(h => `
        <div class="cl-hist-item">

/* ── [2026.10.14] 거래처 › 계정정보(요청: "거래처별 통장비번·홈택스 ID/PW·공인인증서 pw·여신 ID/PW + 판매대행 항목을 한 화면에 조회") ──
   회사웹 거래처 개인정보(s__personalInfo.list[].sensitiveEnc → etcAccounts)를 Tax.J 관리비밀번호로 풀어서 기장거래처별 한 줄로 보여줌.
   복호화는 accImportTaxjLive와 같은 방식(PBKDF2 150000회 → AES-GCM, s__manageVerifier로 비밀번호 확인).
   관리비밀번호·풀린 값은 저장하지 않고 이 창 메모리에만 둠(새로고침·잠그기 하면 다시 잠김). 회사웹 값은 조회만 */
let clAccKey = null, clAccData = null, clAccQuery = '', clAccBusy = false;
const CL_ACC_PLATFORM_RE = /배민|배달의민족|쿠팡|요기요|땡겨요|위메프|티몬|스마트스토어|네이버|11번가|지마켓|G마켓|옥션|카카오|페이코|토스|에이블리|지그재그|무신사|오늘의집|아이디어스|마켓컬리|컬리|당근|핫시즌너/;   // Tax.J CL_PI_PLATFORM_RE
function clAccB64(v){ return Uint8Array.from(atob(v), ch => ch.charCodeAt(0)); }
async function clAccDecryptAll(docs){
  const dec = async p => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: clAccB64(p.iv) }, clAccKey, clAccB64(p.data))));
  const src = docs.s__personalInfo, list = (src && src.list) || [], out = {};
  let failed = 0;
  for(const c of taxjClientIndex(docs).sorted.filter(payIsReg)){
    const p = list.find(x => x && x.clientId === c.id) || list.find(x => x && !x.clientId && taxjNormName(x.name) === taxjNormName(c.name));
    if(!p || !p.sensitiveEnc){ out[c.id] = []; continue; }
    try{ out[c.id] = ((await dec(p.sensitiveEnc)).etcAccounts || []).filter(a => a && a.label !== '대표자 주민번호'); }catch(e){ out[c.id] = null; failed++; }
  }
  clAccData = { src, byId: out, failed };
}
async function clAccUnlock(){
  const docs = taxjFull && taxjFull.docs;
  if(!docs || !docs.s__manageSalt) return smAlert('회사웹 연결이 필요해요', '먼저 Tax.J에 연결해 주세요. 거래처 개인정보는 회사웹에 암호화돼 있어요.');
  const r = await smForm('Tax.J 관리비밀번호', [{ label:'회사웹 정보조회(관리) 비밀번호', type:'password', value:'' }], { okText:'열기', icon:'🔒' });
  if(!r || !r[0]) return;
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(r[0]), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: clAccB64(docs.s__manageSalt), iterations:150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    let ok = false;
    try{ ok = docs.s__manageVerifier && JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: clAccB64(docs.s__manageVerifier.iv) }, key, clAccB64(docs.s__manageVerifier.data)))).check === 'ok'; }catch(e){}
    if(!ok) return smAlert('비밀번호가 맞지 않아요', 'Tax.J 관리비밀번호를 다시 확인해 주세요.', { tone:'danger' });
    clAccKey = key; clAccBusy = true; renderClients();
    await clAccDecryptAll(docs);
  }catch(e){
    console.error('거래처 계정정보 열기 실패', e);
    smAlert('열지 못했어요', String(e && e.message || e), { tone:'danger' });
  }
  clAccBusy = false; renderClients();
}

function clientAccountsHtml(){

  if(clAccBusy || !clAccData) return '<div class="empty">푸는 중…</div>';
  // 회사웹 자료가 실시간으로 바뀌었으면 다시 풀기

  const q = clAccQuery.trim().toLowerCase();
  const rows = taxjClientIndex(docs).sorted.filter(payIsReg).filter(c => !q || String(c.name || '').toLowerCase().includes(q)).map((c, n) => {
    const items = clAccData.byId[c.id];

    return `<tr><td class="tx-seq">${n + 1}</td><td class="vp-sticky" style="font-weight:800; color:${color};">${taxjEsc(c.name)}</td>

    <div class="table-scroll vat-prog cl-acc"><table><thead><tr><th class="tx-seq">순번</th><th class="vp-sticky">상호명</th><th>통장비번</th><th>홈택스 ID</th><th>홈택스 PW</th><th>공인인증서 PW</th><th>여신 ID</th><th>여신 PW</th><th>판매대행</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="9"><div class="empty" style="padding:18px;">${q ? '검색 결과가 없어요.' : '거래처가 없어요.'}</div></td></tr>`}</tbody></table></div>`;
}

  const { st, at } = vpSaveState, hms = at ? `${pad2(at.getHours())}:${pad2(at.getMinutes())}:${pad2(at.getSeconds())}` : '';
  return st === 'pending' || st === 'saving' ? '저장 중…' : st === 'saved' ? `저장됨 ${hms}` : st === 'fail' ? '저장 실패 · 다음 변경 때 다시 시도' : st === 'reload' ? '다른 곳의 최신 내용을 불러왔어요 · 방금 입력을 확인해 주세요' : st === 'local' ? `이 기기에만 보관 ${hms} (Google 연결 안 됨)` : '';
}
function vpSaveBadgeHtml(){ return `<span id="vpSaveBadge" class="vp-save ${vpSaveState.st}" title="입력하면 자동으로 저장돼요">${vpSaveBadgeText()}</span>`; }
function vpSaveSet(st){
  vpSaveState = { st, at: new Date() };
  const el = document.getElementById('vpSaveBadge');
  if(el){ el.className = 'vp-save ' + st; el.textContent = vpSaveBadgeText(); }
}
function setSyncStatus(text){
  if(/저장 중/.test(text)) vpSaveSet('saving'); else if(/저장됨/.test(text)) vpSaveSet('saved'); else if(/저장 실패/.test(text)) vpSaveSet('fail'); else if(vpSaveState.st && /불러왔어요/.test(text)) vpSaveSet('reload');
  googleSyncStatus = text;
  const el = document.getElementById('syncStatusLine');
  if(el) el.textContent = text;
}

function handleGoogleSignIn(){
  if(!googleTokenClient){
    smAlert('Google에 연결할 수 없어요', '인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');
    return;
  }
  googleTokenClient.callback = async (resp) => {
    if(resp.error){
      setSyncStatus('로그인 실패: ' + resp.error);
      renderSettings();
      if(connectDoneHook){ connectDoneHook(); connectDoneHook = null; }
      return;
    }
    googleAccessToken = resp.access_token;
    gapi.client.setToken({ access_token: googleAccessToken });
    saveGoogleToken(resp);
    await afterGoogleSignIn();
  };
  let hintEmail2 = '';
  try{ hintEmail2 = localStorage.getItem(AUTH_STORAGE_KEY) || ''; }catch(e){}
  googleTokenClient.requestAccessToken(hintEmail2 ? { prompt: '', hint: hintEmail2 } : { prompt: '' });
}

function handleGoogleSignOut(){
  clearGoogleToken();
  if(googleAccessToken && typeof google !== 'undefined'){
    google.accounts.oauth2.revoke(googleAccessToken, () => {});
  }
  clearInterval(googlePollTimer);
  googleAccessToken = null;
  googleSpreadsheetId = null;
  settings.sheetsConnected = false;
  setSyncStatus('');
  clearSyncWarningBadge();
  renderSettings();
  updateConnectBanner();
}

async function afterGoogleSignIn(){
  clearSyncWarningBadge();
  updateConnectBanner();
  setSyncStatus('연결하는 중...');
  renderSettings();
  try {
    const found = await findGoogleDataSheet();
    googleSpreadsheetId = found || await createGoogleDataSheet();
    await loadFromGoogleSheet();
    sheetLoadedOnce = true;
    resolvePendingAfterLoad();
    settings.sheetsConnected = true;
    setSyncStatus('연동됨 · 방금 불러왔습니다');
    startGooglePolling();
  } catch(e){
    console.error(e);
    const msg = (e && e.result && e.result.error && e.result.error.message) || e.message || '알 수 없는 오류';
    setSyncStatus('연동 실패: ' + msg);
  }
  renderAll();
  smLoadingCover(false);   // [2026.10.20] 불러오기가 끝나면(실패해도) 가림막 걷음
  if(connectDoneHook){ connectDoneHook(); connectDoneHook = null; }
}
function smLoadingCover(on){
  const h = document.documentElement;
  if(on){ h.classList.add('sm-loading'); clearTimeout(window._smLoadT); window._smLoadT = setTimeout(() => h.classList.remove('sm-loading'), 15000); }
  else { clearTimeout(window._smLoadT); h.classList.remove('sm-loading'); }
}

async function findGoogleDataSheet(){
  const res = await gapi.client.drive.files.list({
    q: `name='${GOOGLE_SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`,
    fields: 'files(id,name)',
    spaces: 'drive',
  });
  const files = res.result.files || [];
  return files.length ? files[0].id : null;
}

async function createGoogleDataSheet(){
  const res = await gapi.client.sheets.spreadsheets.create({
    properties: { title: GOOGLE_SHEET_NAME },
    sheets: [{ properties: { title: 'data' } }],
  });
  const id = res.result.spreadsheetId;
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: id,
    range: 'data!A1:B1',
    valueInputOption: 'RAW',
    resource: { values: [['key', 'json']] },
  });
  return id;
}

let needsResaveAfterLoad = false;
let sheetLoadedOnce = false;
async function loadFromGoogleSheet(){
  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: googleSpreadsheetId,
    range: 'data!A2:B1000',
  });
  const rows = res.result.values || [];
  const map = {};
  // 셀 하나에 5만 자까지만 들어가서, 긴 값은 "tasks", "tasks__2", "tasks__3"… 여러 줄로 나눠 저장함 → 다시 이어붙임
  const parts = {};
  rows.forEach(r => {
    if(!r[0] || r[1] == null) return;
    const m = /^(.*)__(\d+)$/.exec(r[0]);
    if(m){ (parts[m[1]] = parts[m[1]] || [])[+m[2]] = r[1]; }
    else map[r[0]] = r[1];
  });
  Object.keys(parts).forEach(k => { if(map[k] != null) map[k] += parts[k].slice(2).join(''); });
  if(!Object.keys(map).length) return;
  lastSyncedVersion = map.__version || null;

  // 보호장치: 시트의 할 일이 비어 있는데(예전 저장 실패 등) 이 파일에 할 일이 들어 있으면 지우지 않고 유지 후 다시 저장
  try {
    const sheetTasks = map.tasks ? JSON.parse(map.tasks) : null;
    const sheetNext = map.nextTaskId ? JSON.parse(map.nextTaskId) : 0;
    if(Array.isArray(sheetTasks) && sheetTasks.length === 0 && tasks.length > 0 && sheetNext < nextTaskId){
      delete map.tasks; delete map.nextTaskId;
      needsResaveAfterLoad = true;
    }
  } catch(e){}

  try {
    if(map.clients)     clients     = JSON.parse(map.clients);
    if(map.tasks)        tasks        = JSON.parse(map.tasks);
    if(map.vatData)      vatData      = JSON.parse(map.vatData);
    if(map.payData)      payData      = JSON.parse(map.payData);
    if(map.corpData)     corpData     = JSON.parse(map.corpData);
    if(map.indivData)    indivData    = JSON.parse(map.indivData);
    if(map.settings)     settings     = Object.assign(settings, JSON.parse(map.settings));
    try{ if(settings.displayName) localStorage.setItem('sm_display_name', settings.displayName); }catch(e){}
    if(map.vatPeriods)   vatPeriods   = JSON.parse(map.vatPeriods);
    if(map.payMonths)    payMonths    = JSON.parse(map.payMonths);
    if(map.corpYears)    corpYears    = JSON.parse(map.corpYears);
    if(map.indivYears)   indivYears   = JSON.parse(map.indivYears);
    if(map.vatDue)        vatDue       = JSON.parse(map.vatDue);
    if(map.payDue)        payDue       = JSON.parse(map.payDue);
    if(map.corpDue)       corpDue      = JSON.parse(map.corpDue);
    if(map.indivDue)      indivDue     = JSON.parse(map.indivDue);
    if(map.nextClientId)  nextClientId = JSON.parse(map.nextClientId);
    if(map.nextTaskId)    nextTaskId   = JSON.parse(map.nextTaskId);
    if(map.worklistChecklist) worklistChecklist = JSON.parse(map.worklistChecklist);
    if(map.worklistSchedule)  worklistSchedule  = JSON.parse(map.worklistSchedule);
    if(map.events)        events       = JSON.parse(map.events);
    if(map.clientsOther)  clientsOther = JSON.parse(map.clientsOther);
    if(map.clientsTerminated) clientsTerminated = JSON.parse(map.clientsTerminated);
    if(map.nextEventId)   nextEventId  = JSON.parse(map.nextEventId);
    if(map.accountVault)  accountVault = JSON.parse(map.accountVault);
    if(map.submitMine)    submitMine   = JSON.parse(map.submitMine);
    if(map.attendMine)    attendMine   = JSON.parse(map.attendMine);
    if(map.payCustomCols) payCustomCols = JSON.parse(map.payCustomCols);
    if(map.payCustomVals) payCustomVals = JSON.parse(map.payCustomVals);
    if(map.quickMemos) quickMemos = JSON.parse(map.quickMemos);
    if(map.nextMemoId) nextMemoId = JSON.parse(map.nextMemoId);
    if(map.vatCustomCols) vatCustomCols = JSON.parse(map.vatCustomCols);
    if(map.vatCustomVals) vatCustomVals = JSON.parse(map.vatCustomVals);
    if(map.vatProgCols) vatProgCols = JSON.parse(map.vatProgCols);
    if(map.vatProg) vatProg = JSON.parse(map.vatProg);
    if(map.vatProgView) vatProgView = JSON.parse(map.vatProgView);
    if(map.closeCols) closeCols = JSON.parse(map.closeCols);
    if(map.closeData) closeData = JSON.parse(map.closeData);
    if(map.links)         links        = JSON.parse(map.links);
    if(map.nextLinkId)    nextLinkId   = JSON.parse(map.nextLinkId);
    if(map.linkCats)      linkCats     = JSON.parse(map.linkCats);
    ['forms','nextFormId','formCats','laws','nextLawId','lawCats'].forEach(k => { if(map[k]) try{ libSetVar(k, JSON.parse(map[k])); }catch(e){} });
    if(map.formCats || map.lawCats) try{ renderNav(); }catch(e){}
    if(map.manuals)       manuals      = JSON.parse(map.manuals);
    if(map.nextManualId)  nextManualId = JSON.parse(map.nextManualId);
    if(map.manualCats)    manualCats   = JSON.parse(map.manualCats);
    if(map.manualCats)    try{ renderNav(); }catch(e){}   // 매뉴얼 분야 하위메뉴 갱신
  } catch(e){
    console.error('시트 데이터 파싱 실패', e);
  }
  // 불러온 그대로의 상태를 기억 → 아무것도 안 바꿨으면 저장하지 않음(다른 창 덮어쓰기 방지)
  lastSyncedContent = needsResaveAfterLoad ? null : JSON.stringify(collectGoogleSnapshot());
  writeLocalCache();
  needsResaveAfterLoad = false;
}

// 로그인 만료(access token 만료/취소)를 감지해서 사용자가 알아챌 수 있게 만드는 부분.
// 예전에는 저장/자동새로고침이 조용히 실패만 하고, 설정 탭을 직접 열어봐야만 알 수 있었음.
// 이제는 401(권한 없음) 오류가 나면 즉시 연동을 끊긴 상태로 표시하고, 어느 탭에 있든
// 헤더에 "연동 끊김" 배지가 떠서 바로 알 수 있게 함.
function isAuthError(e){
  const code = (e && e.status) || (e && e.result && e.result.error && e.result.error.code);
  return code === 401 || code === 403;
}

let lastSyncedVersion = null;
let lastSyncedContent = null;
let savingNow = false;
async function readRemoteVersion(){
  const res = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: googleSpreadsheetId, range: 'data!A2:A1000' });
  const col = (res.result.values || []).map(r => r[0]);
  const idx = col.indexOf('__version');
  if(idx < 0) return null;
  const v = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: googleSpreadsheetId, range: `data!B${idx + 2}` });
  return ((v.result.values || [])[0] || [])[0] || null;
}
// ── 자동 백업: 하루 한 번, SM_data 안에 "backup_YYYY-MM-DD" 탭으로 저장 (최근 14개만 유지)
const BACKUP_KEEP = 14;
let backupDoneToday = null;
async function listBackupSheets(){
  const res = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: googleSpreadsheetId, fields: 'sheets.properties(sheetId,title)' });
  return (res.result.sheets || []).map(s => s.properties).filter(p => /^backup_\d{4}-\d{2}-\d{2}$/.test(p.title)).sort((a, b) => a.title.localeCompare(b.title));
}
async function dailyBackupIfNeeded(rows){
  const T = todayStr();
  if(backupDoneToday === T) return;
  const list = await listBackupSheets();
  const title = 'backup_' + T;
  backupDoneToday = T;
  if(list.some(p => p.title === title)) return;
  await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: googleSpreadsheetId, resource: { requests: [{ addSheet: { properties: { title } } }] } });
  await gapi.client.sheets.spreadsheets.values.update({ spreadsheetId: googleSpreadsheetId, range: `'${title}'!A1`, valueInputOption: 'RAW', resource: { values: [['key','json']].concat(rows) } });
  const old = list.slice(0, Math.max(0, list.length + 1 - BACKUP_KEEP));
  if(old.length) await gapi.client.sheets.spreadsheets.batchUpdate({ spreadsheetId: googleSpreadsheetId, resource: { requests: old.map(p => ({ deleteSheet: { sheetId: p.sheetId } })) } });
}
function rowsToSnapshot(rows){
  const map = {}, parts = {};
  rows.forEach(r => {
    if(!r[0] || r[1] == null || r[0] === 'key') return;
    const m = /^(.*)__(\d+)$/.exec(r[0]);
    if(m){ (parts[m[1]] = parts[m[1]] || [])[+m[2]] = r[1]; } else map[r[0]] = r[1];
  });
  Object.keys(parts).forEach(k => { if(map[k] != null) map[k] += parts[k].slice(2).join(''); });
  const o = {};
  Object.keys(map).forEach(k => { if(k !== '__version'){ try{ o[k] = JSON.parse(map[k]); }catch(e){} } });
  return o;
}
// [2026.10.15] 날짜별 백업 파일(요청: "데이터 보존이 걱정 - 날짜별 그거는 해야겠다") - 위 시트 안 백업(backup_날짜 탭, 14일)은 같은 스프레드시트에 있어서
//   시트를 지우거나 망가지면 같이 사라짐 → 하루 한 번 내 Google 드라이브 'SM_백업' 폴더에 'SM_백업_YYYY-MM-DD.json' 파일을 따로 남김.
//   내용: works 데이터 전체 + 그날 받아 둔 회사웹(Tax.J) 자료 전체. 실시간 연동과 달리 덮어쓰지 않아서, 어느 쪽이 망가져도 그 날짜 상태가 남음
//   (같은 날 안에서는 회사 자료가 나중에 생기면 그 날 파일만 한 번 더 채움). 보관: 최근 60일 + 매달 1일 파일은 계속. 지울 땐 휴지통으로(30일 안에 되살림)
const SM_BACKUP_FOLDER = 'SM_백업', SM_BACKUP_KEEP_DAYS = 60;
let smBackupFolderId = null, smDriveBackupBusy = false;
async function smBackupFolder(){
  if(smBackupFolderId) return smBackupFolderId;
  const q = encodeURIComponent(`name='${SM_BACKUP_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await smDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  if(r.files && r.files.length) return (smBackupFolderId = r.files[0].id);
  const c = await smDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ name: SM_BACKUP_FOLDER, mimeType:'application/vnd.google-apps.folder' }) });
  return (smBackupFolderId = c.id);
}
async function smDriveDailyBackup(){
  if(!googleAccessToken || smDriveBackupBusy) return;
  const T = todayStr(), hasT = !!(taxjFull && taxjFull.docs);
  let st = {}; try{ st = JSON.parse(localStorage.getItem('sm_drive_backup') || '{}') || {}; }catch(e){}
  if(st.day === T && (st.taxj || !hasT)) return;
  smDriveBackupBusy = true;
  try{
    const folder = await smBackupFolder();
    const name = `SM_백업_${T}.json`;
    const q = encodeURIComponent(`name='${name}' and '${folder}' in parents and trashed=false`);
    const ex = await smDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,description)&spaces=drive`);
    const exFile = ex.files && ex.files[0];
    if(exFile && (exFile.description === 'taxj' || !hasT)){ try{ localStorage.setItem('sm_drive_backup', JSON.stringify({ day:T, taxj: exFile.description === 'taxj' })); }catch(e){} return; }   // 다른 기기에서 이미 만듦
    const body = JSON.stringify({ savedAt: new Date().toISOString(), note: 'Sunmin\'s Works 날짜별 백업(덮어쓰지 않음)', works: collectGoogleSnapshot(), taxj: hasT ? { at: taxjFull.at, docs: taxjFull.docs } : null });
    const blob = new Blob([body], { type:'application/json' });
    if(exFile){
      await smDriveFetch(`https://www.googleapis.com/upload/drive/v3/files/${exFile.id}?uploadType=media&fields=id`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: blob });
      await smDriveFetch(`https://www.googleapis.com/drive/v3/files/${exFile.id}?fields=id`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ description: 'taxj' }) });
    }else{
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify({ name, parents: [folder], description: hasT ? 'taxj' : '' })], { type:'application/json' }));
      fd.append('file', blob);
      await smDriveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', body: fd });
    }
    try{ localStorage.setItem('sm_drive_backup', JSON.stringify({ day:T, taxj: hasT })); }catch(e){}
    // 오래된 파일 정리: 최근 60일 + 매달 1일 파일은 남김
    const lq = encodeURIComponent(`'${folder}' in parents and trashed=false and name contains 'SM_백업_'`);
    const all = await smDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${lq}&fields=files(id,name)&pageSize=1000&spaces=drive`);
    const cut = new Date(Date.now() - SM_BACKUP_KEEP_DAYS * 86400000).toISOString().slice(0, 10);
    for(const f of (all.files || [])){ const d = (/SM_백업_(\d{4}-\d{2}-\d{2})\.json$/.exec(f.name) || [])[1]; if(d && d < cut && !d.endsWith('-01')) await smDriveTrash(f.id); }
  }catch(e){ console.warn('드라이브 날짜별 백업 실패', e); }
  finally{ smDriveBackupBusy = false; }
}

async function saveToGoogleSheet(){
  saveTimer = null;
  if(!googleAccessToken || !googleSpreadsheetId || !sheetLoadedOnce) return;
  if(savingNow){ scheduleGoogleSave(); return; }
  savingNow = true;
  try {
    const remote = await readRemoteVersion();
    if(remote && remote !== lastSyncedVersion){
      // 다른 창/기기에서 먼저 저장함 → 덮어쓰지 않고 최신 내용을 불러옴
      await loadFromGoogleSheet();
      renderAllNoSave();
      setSyncStatus('다른 곳에서 바뀐 내용을 불러왔어요');
      smAlert('최신 내용을 불러왔어요', '다른 창이나 기기에서 먼저 저장된 내용이 있어서, 덮어쓰지 않고 새로 불러왔어요. 방금 바꾼 내용이 안 보이면 한 번 더 해주세요.');
      savingNow = false;
      return;
    }
  } catch(e){
    console.error(e);
    savingNow = false;
    if(isAuthError(e)) handleGoogleTokenExpired();
    else setSyncStatus('저장 실패 (다음 변경 때 다시 시도합니다)');
    return;
  }
  const snap = collectGoogleSnapshot();
  const snapStr = JSON.stringify(snap);
  if(snapStr === lastSyncedContent){ savingNow = false; if(vpSaveState.st === 'pending' || vpSaveState.st === 'saving') vpSaveSet('saved'); return; }   // 바뀐 게 없으면 저장 안 함
  const CHUNK = 45000;
  const rows = [];
  GOOGLE_DATA_KEYS.forEach(k => {
    const str = JSON.stringify(snap[k]);
    rows.push([k, str.slice(0, CHUNK)]);
    for(let i = CHUNK, n = 2; i < str.length; i += CHUNK, n++) rows.push([`${k}__${n}`, str.slice(i, i + CHUNK)]);
  });
  const newVersion = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  rows.push(['__version', newVersion]);
  setSyncStatus('저장 중...');
  try {
    // 먼저 새 내용으로 덮어쓰고(실패하면 기존 데이터가 그대로 남음), 성공한 뒤에 남는 아래쪽 줄만 지움
    await gapi.client.sheets.spreadsheets.values.update({
      spreadsheetId: googleSpreadsheetId, range: 'data!A2',
      valueInputOption: 'RAW',
      resource: { values: rows },
    });
    await gapi.client.sheets.spreadsheets.values.clear({
      spreadsheetId: googleSpreadsheetId, range: `data!A${rows.length + 2}:B1000`,
    });
    lastSyncedVersion = newVersion;
    lastSyncedContent = snapStr;
    writeLocalCache();
    dailyBackupIfNeeded(rows).catch(e => console.warn('백업 실패', e));
    smDriveDailyBackup();   // [2026.10.15] 드라이브 날짜별 파일도
    // 저장하는 동안 또 바뀐 게 없으면 보관본 삭제
    if(JSON.stringify(collectGoogleSnapshot()) === snapStr) clearPendingChanges();
    const t = new Date();
    clearSyncWarningBadge();
    setSyncStatus(`연동됨 · ${pad2(t.getHours())}:${pad2(t.getMinutes())} 저장됨`);
  } catch(e){
    console.error(e);
    if(isAuthError(e)){
      handleGoogleTokenExpired();
    } else {
      setSyncStatus('저장 실패 (다음 변경 때 다시 시도합니다)');
    }
  }
  savingNow = false;
}

// 아직 시트에 저장되지 않은 변경을 이 기기에 잠깐 보관 → 연결이 끊기거나 새로고침해도 사라지지 않게.
// 다시 연결됐을 때, 그 사이 다른 기기에서 저장한 게 없으면 이 변경을 올리고,
// 다른 기기에서 더 나중에 저장한 게 있으면(=그쪽이 최신 저장본) 그걸 따름.
const PENDING_KEY = 'sm_pending_changes';
function recordPendingChanges(){
  if(!sheetLoadedOnce || lastSyncedContent == null) return;
  const snapStr = JSON.stringify(collectGoogleSnapshot());
  try{
    if(snapStr === lastSyncedContent) localStorage.removeItem(PENDING_KEY);
    else localStorage.setItem(PENDING_KEY, JSON.stringify({ base: lastSyncedVersion, at: Date.now(), snap: snapStr }));
  }catch(e){}
}
function clearPendingChanges(){ try{ localStorage.removeItem(PENDING_KEY); }catch(e){} }
function hasUnsavedChanges(){
  if(!sheetLoadedOnce || lastSyncedContent == null) return false;
  return JSON.stringify(collectGoogleSnapshot()) !== lastSyncedContent;
}

// 로그인·재연결 직후(시트를 불러온 다음) 호출
function resolvePendingAfterLoad(){
  let pending = null;
  try{ pending = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); }catch(e){}
  if(!pending || !pending.snap) return;
  clearPendingChanges();
  if(pending.snap === lastSyncedContent) return;             // 이미 반영돼 있음
  if((pending.base || null) === (lastSyncedVersion || null)){
    // 그 사이 다른 기기 저장 없음 → 이 기기의 저장 안 된 변경이 최신이므로 올림
    try{ applySnapshot(JSON.parse(pending.snap)); }catch(e){ return; }
    renderAllNoSave();
    scheduleGoogleSave();
    setSyncStatus('저장 안 됐던 변경을 이어서 저장하는 중...');
  } else {
    const t = new Date(pending.at);
    smAlert('다른 기기의 최신 저장본을 불러왔어요',
      `이 기기에서 ${pad2(t.getMonth()+1)}/${pad2(t.getDate())} ${pad2(t.getHours())}:${pad2(t.getMinutes())}에 바꾼 내용은 저장되지 못했고, 그 뒤에 다른 기기에서 저장한 내용이 있어서 그쪽을 불러왔어요.`);
  }
}

function scheduleGoogleSave(){
  recordPendingChanges();
  if(!googleAccessToken || !googleSpreadsheetId || !sheetLoadedOnce){ vpSaveSet('local'); return; }
  vpSaveSet('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToGoogleSheet, 900);
}
