<script>
/* ===== 공통 팝업 (B안: 가운데 정렬 + 아이콘형) ===== */
function smDialog(opts){
  return new Promise(resolve => {
    const o = Object.assign({ icon:'?', tone:'', title:'', message:'', okText:'확인', cancelText:'취소', fields:null }, opts || {});
    if(o.cancelText === '삭제' && o.closeX === undefined) o.closeX = true;
    const wrap = document.createElement('div');
    wrap.className = 'sm-modal-backdrop';
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    wrap.innerHTML = `
      <div class="sm-modal ${o.tone} ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        ${o.closeX === false ? '' : '<button type="button" class="sm-modal-x" title="닫기" aria-label="닫기">×</button>'}
        <div class="sm-modal-ic">${esc(o.icon)}</div>
        ${o.title ? `<div class="sm-modal-title">${esc(o.title)}</div>` : ''}
        ${o.html ? `<div class="sm-modal-msg sm-modal-html">${o.html}</div>` : (o.message ? `<div class="sm-modal-msg">${esc(o.message).replace(/\n/g,'<br>')}</div>` : '')}
        ${o.fields ? `<div class="sm-modal-fields">${o.fields.map((f,i) => `
          <label class="sm-modal-field"><span>${esc(f.label)}</span>
            ${f.options ? `<select data-i="${i}">${f.options.map(op => `<option ${op === f.value ? 'selected' : ''}>${esc(op)}</option>`).join('')}</select>`
              : f.type === 'textarea' ? `<textarea data-i="${i}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder)}">${esc(f.value)}</textarea>`
              : `<input type="${f.type || 'text'}" data-i="${i}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}">`}</label>`).join('')}</div>` : ''}
        <div class="sm-modal-btns">
          ${o.cancelText ? `<button type="button" class="sm-modal-cancel">${esc(o.cancelText)}</button>` : ''}
          <button type="button" class="sm-modal-ok">${esc(o.okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    const inputs = Array.from(wrap.querySelectorAll('input, select, textarea'));
    const done = ok => {
      document.removeEventListener('keydown', onKey, true);
      wrap.classList.remove('show');
      setTimeout(() => wrap.remove(), 150);
      if(ok === 'x') return resolve(undefined);   // [2026.10.15] closeX 창: X·Esc·바깥 클릭 = 아무것도 안 하고 닫기(undefined)
      if(o.fields) resolve(ok ? inputs.map(x => x.value) : null);
      else resolve(!!ok);
    };
    const onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(o.closeX ? 'x' : false); }
      else if(e.key === 'Enter' && !e.isComposing){
        // 여러 줄 입력칸(메모)에서는 Enter = 줄바꿈, Ctrl/Cmd+Enter = 저장
        if(e.target && e.target.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
        e.preventDefault(); e.stopPropagation(); done(true);
      }
    };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('.sm-modal-ok').onclick = () => done(true);
    const c = wrap.querySelector('.sm-modal-cancel'); if(c) c.onclick = () => done(false);
    // [2026.10.15] "모든 팝업에 닫기 버튼"(요청) - X는 취소와 같음. 단 취소 버튼이 '삭제'인 창(항목 수정)은 X·Esc·바깥 클릭 = 그냥 닫기(undefined)
    const x = wrap.querySelector('.sm-modal-x'); if(x) x.onclick = () => done(o.closeX ? 'x' : false);
    wrap.addEventListener('mousedown', e => { if(e.target === wrap) done(o.closeX ? 'x' : false); });
    setTimeout(() => (inputs[0] || wrap.querySelector('.sm-modal-ok')).focus(), 30);
  });
}
// [2026.10.16] 분야 관리 창(요청: "엔터로 줄 나눠 적는 방식은 헷갈림 - 입력하고 등록하는 식으로")
// 입력칸에 이름 적고 '추가' → 목록에 생김. 목록 줄마다 이름 바꾸기(연필)·위/아래 순서·삭제.
// 결과: [{orig, name}] (orig = 원래 이름, 새로 추가한 것은 null) 또는 취소면 null
function smCatEditor(title, cats, opts){
  return new Promise(resolve => {
    const o = Object.assign({ countOf: null, placeholder:'새 분야 이름' }, opts || {});
    let items = (cats || []).map(c => ({ orig: c, name: c }));
    let editing = -1;
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const wrap = document.createElement('div');
    wrap.className = 'sm-modal-backdrop';
    wrap.innerHTML = `
      <div class="sm-modal wide" role="dialog" aria-modal="true">
        <button type="button" class="sm-modal-x" title="닫기" aria-label="닫기">×</button>
        <div class="sm-modal-ic">✎</div>
        <div class="sm-modal-title">${esc(title)}</div>
        <div class="sm-cat-add"><input type="text" placeholder="${esc(o.placeholder)}" maxlength="30"><button type="button" class="add">추가</button></div>
        <div class="sm-cat-list"></div>
        <div class="sm-modal-btns">
          <button type="button" class="sm-modal-cancel">취소</button>
          <button type="button" class="sm-modal-ok">저장</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    const addIn = wrap.querySelector('.sm-cat-add input');
    const listEl = wrap.querySelector('.sm-cat-list');
    const dup = (nm, skip) => items.some((it, i) => i !== skip && it.name === nm);
    const draw = () => {
      listEl.innerHTML = !items.length ? '<div class="sm-cat-empty">분야가 없어요. 위에서 추가해 주세요.</div>' : items.map((it, i) => `
        <div class="sm-cat-row" data-i="${i}">
          ${editing === i ? `<input type="text" value="${esc(it.name)}" maxlength="30">
            <button type="button" data-act="ok" title="확인" aria-label="확인">✓</button>`
          : `<span class="nm" title="${esc(it.name)}">${esc(it.name)}</span>
            ${o.countOf && it.orig != null ? `<span class="cnt">${o.countOf(it.orig)}개</span>` : ''}
            <button type="button" data-act="edit" title="이름 바꾸기" aria-label="이름 바꾸기">${typeof ICON_EDIT !== 'undefined' ? ICON_EDIT : '✎'}</button>
            <button type="button" data-act="up" title="위로" aria-label="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button type="button" data-act="down" title="아래로" aria-label="아래로" ${i === items.length - 1 ? 'disabled' : ''}>▼</button>
            <button type="button" class="del" data-act="del" title="삭제" aria-label="삭제">${typeof ICON_TRASH !== 'undefined' ? ICON_TRASH : '×'}</button>`}
        </div>`).join('');
      const ed = listEl.querySelector('.sm-cat-row input');
      if(ed){ ed.focus(); ed.select(); }
    };
    const add = () => {
      const nm = addIn.value.trim();
      if(!nm) { addIn.focus(); return; }
      if(dup(nm, -1)){ addIn.select(); addIn.title = '이미 있는 분야예요'; return; }
      items.push({ orig: null, name: nm }); addIn.value = ''; editing = -1; draw();
      listEl.scrollTop = listEl.scrollHeight; addIn.focus();
    };
    const commitEdit = () => {
      if(editing < 0) return true;
      const ed = listEl.querySelector('.sm-cat-row input');
      const nm = ed ? ed.value.trim() : '';
      if(!nm || dup(nm, editing)){ if(ed){ ed.focus(); ed.select(); } return false; }
      items[editing].name = nm; editing = -1; draw(); return true;
    };
    listEl.addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if(!b) return;
      const i = Number(b.closest('.sm-cat-row').dataset.i); const act = b.dataset.act;
      if(act === 'ok'){ commitEdit(); return; }
      if(!commitEdit()) return;
      if(act === 'edit'){ editing = i; draw(); }
      else if(act === 'up' && i > 0){ [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); }
      else if(act === 'down' && i < items.length - 1){ [items[i + 1], items[i]] = [items[i], items[i + 1]]; draw(); }
      else if(act === 'del'){ items.splice(i, 1); draw(); }
    });
    wrap.querySelector('.sm-cat-add .add').onclick = add;
    const done = ok => {
      if(ok && !commitEdit()) return;
      document.removeEventListener('keydown', onKey, true);
      wrap.classList.remove('show');
      setTimeout(() => wrap.remove(), 150);
      resolve(ok ? items.map(it => ({ orig: it.orig, name: it.name })) : null);
    };
    const onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); if(editing >= 0){ editing = -1; draw(); } else done(false); }
      else if(e.key === 'Enter' && !e.isComposing){
        e.preventDefault(); e.stopPropagation();
        if(e.target === addIn) add();
        else if(editing >= 0) commitEdit();
      }
    };
    document.addEventListener('keydown', onKey, true);
    wrap.querySelector('.sm-modal-ok').onclick = () => done(true);
    wrap.querySelector('.sm-modal-cancel').onclick = () => done(false);
    wrap.querySelector('.sm-modal-x').onclick = () => done(false);
    wrap.addEventListener('mousedown', e => { if(e.target === wrap) done(false); });
    draw();
    setTimeout(() => addIn.focus(), 30);
  });
}
// [2026.10.16] 검색칸 → 돋보기 아이콘, 도구줄 안내 문구 → 도움말(?) 아이콘. 화면을 다시 그릴 때마다 자동으로 바꿈
const SM_ICON_SEARCH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function smEnhanceUi(root){
  (root || document).querySelectorAll('input[placeholder*="검색"]:not([data-sx])').forEach(inp => {
    if(inp.closest('.sm-modal')) return;
    inp.setAttribute('data-sx', '1');
    inp.classList.add('sm-sx');
    if(inp.value || document.activeElement === inp) inp.classList.add('open');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sm-sx-btn' + (/^1/.test(inp.style.flex || '') ? ' grow' : '') + (inp.value ? ' on' : '');
    b.title = inp.placeholder || '검색'; b.setAttribute('aria-label', '검색'); b.innerHTML = SM_ICON_SEARCH;
    b.onclick = () => { if(inp.classList.contains('open') && !inp.value){ inp.classList.remove('open'); return; } inp.classList.add('open'); inp.focus(); };
    inp.parentNode.insertBefore(b, inp);
    inp.addEventListener('blur', () => { setTimeout(() => { if(!inp.value && document.activeElement !== inp) inp.classList.remove('open'); }, 150); });
    inp.addEventListener('input', () => b.classList.toggle('on', !!inp.value));
    inp.addEventListener('keydown', e => { if(e.key === 'Escape' && !inp.value) inp.blur(); });
  });
  (root || document).querySelectorAll('.toolbar').forEach(tb => {
    const hs = [...tb.querySelectorAll(':scope > .hint:not(.sm-hx)')].filter(h => h.textContent.trim());
    if(!hs.length) return;
    hs.forEach(h => h.classList.add('sm-hx'));
    let btn = tb.querySelector(':scope > .sm-help-btn');
    if(!btn){
      btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'sm-help-btn'; btn.textContent = '?'; btn.title = '도움말'; btn.setAttribute('aria-label', '도움말');
      btn.onclick = () => {
        const txt = [...tb.querySelectorAll(':scope > .hint.sm-hx')].map(h => h.textContent.trim()).filter(Boolean);
        const head = document.querySelector('#pageHead h1'), sub = document.querySelector('#pageHead .page-sub');
        smDialog({ title: [head && head.textContent, sub && sub.textContent].filter(Boolean).join(' › ') || '도움말', message: txt.join('\n'), icon:'?', okText:'확인', cancelText:null });
      };
      tb.appendChild(btn);
    }
  });
}
// [2026.10.22] "검색하면 타자가 이상하게(ㄱㅏㅁ) 쳐져"(요청) - 한 글자마다 화면을 다시 그려 한글 조합이 끊겼음 →
//   검색칸에서 한글 조합 중에는 다시 그리기를 미루고, 조합이 끝나면 한 번 그림
document.addEventListener('input', e => { const t = e.target; if(e.isComposing && t && t.matches && t.matches('input[placeholder*="검색"]')) e.stopPropagation(); }, true);
document.addEventListener('compositionend', e => { const t = e.target; if(t && t.matches && t.matches('input[placeholder*="검색"]')) t.dispatchEvent(new Event('input', { bubbles:true })); }, true);
try{
  // [2026.10.16] 깜빡임(요청) - 예전엔 화면을 그린 '다음'(setTimeout)에 검색칸·설명을 아이콘으로 바꿔서, 다시 그릴 때마다 원래 모양이 잠깐 보였다 바뀜 → 그리기 전(변화 감지 직후)에 바로 바꿈
  new MutationObserver(() => { try{ smEnhanceUi(); }catch(e){} }).observe(document.body, { childList:true, subtree:true });
  smEnhanceUi();
}catch(e){ console.warn(e); }
// [2026.10.16] "가로 스크롤을 잡고 옮기다 표 밖으로 나가면 스크롤이 멈춘다"(요청) - 끄는 동안 회사웹 실시간 반영·시트 동기화로
// 표를 다시 그리면 잡고 있던 스크롤바가 새 표로 바뀌어 끌기가 끊겼음. 표 안(스크롤바 포함)을 누르고 있는 동안에는 다시 그리기를 미뤘다가 손을 떼면 그림
let smHoldScroll = false; const smPendingRender = new Map();
document.addEventListener('pointerdown', e => { smHoldScroll = !!(e.target && e.target.closest && e.target.closest('.table-scroll')); }, true);
const smFlushRender = () => { if(!smHoldScroll) return; smHoldScroll = false; const fns = [...smPendingRender.values()]; smPendingRender.clear(); setTimeout(() => fns.forEach(f => { try{ f(); }catch(e){ console.warn(e); } }), 0); };
['pointerup','pointercancel','dragend'].forEach(t => window.addEventListener(t, smFlushRender, true));
window.addEventListener('blur', smFlushRender);
['renderVat','renderClose','renderPay','renderClients','renderAttend','renderInner','renderTaxjFull','renderLinks','renderLib','renderAccounts'].forEach(n => {
  const f = window[n]; if(typeof f !== 'function') return;
  window[n] = function(){ if(smHoldScroll){ const args = arguments; smPendingRender.set(n + JSON.stringify([...args]), () => f.apply(this, args)); return; } return f.apply(this, arguments); };
});
// 하위메뉴를 바꾸면 소제목도 바로 바뀌게
['setPayView','setVatView','setInnerView','setAttendView','setClientsView','setTaxjFullView','setManualCat','setLibCat'].forEach(n => {
  const f = window[n]; if(typeof f !== 'function') return;
  window[n] = function(){ const r = f.apply(this, arguments); try{ updatePageHead(); }catch(e){} if(n === 'setManualCat' || n === 'setLibCat'){ try{ renderNav(); }catch(e){} } return r; };
});
function smConfirm(title, message, opts){ return smDialog(Object.assign({ title, message }, opts || {})); }
function smAlert(title, message, opts){ return smDialog(Object.assign({ title, message, icon:'!', cancelText:null }, opts || {})); }
function smForm(title, fields, opts){ return smDialog(Object.assign({ title, fields, icon:'+' }, opts || {})); }
</script>
